Deviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"note\"><strong>📝 На схемі</strong> <p>Лінії від абонентів до комутаторів індивідуальні, а канал між комутаторами один на всіх: по ньому одночасно проходять сеанси A з C та B з D. Саме цей спільний канал і є результатом комутації.</p>\n</div>\n\n","<h1>🔀 Види комутації</h1>\n<p><strong>Головна ідея:</strong> Три схеми комутації відрізняються тим, чи резервується канал заздалегідь і якими порціями передаються дані.</p>\n<p>📞 При <strong>комутації каналів</strong> спочатку встановлюється з'єднання, і на весь час розмови між абонентами існує виділений шлях. Так працює телефонний дзвінок: поки триває розмова, канал зайнятий, навіть якщо обидва мовчать.</p>\n<p>📦 При <strong>комутації пакетів</strong> з'єднання не встановлюється. Дані ріжуться на невеликі пакети з адресою призначення, і кожен пакет вузли пересилають незалежно. Канал зайнятий лише в момент передачі пакета, решту часу ним користуються інші.</p>\n<p>✉️ При <strong>комутації повідомлень</strong> дані передаються цілим повідомленням: кожен вузол отримує його повністю, зберігає і лише потім передає далі. Це зручно для пошти, але не для інтерактивної роботи.</p>\n<table>\n<thead>\n<tr>\n<th>Вид</th>\n<th>Принцип роботи</th>\n<th>Затримка</th>\n<th>Ефективність</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📞 <strong>Каналів</strong></td>\n<td>Перед передачею встановлюється канал, зарезервований на весь сеанс</td>\n<td>Мінімальна і стабільна</td>\n<td>Низька: канал зайнятий навіть у паузах</td>\n<td>Класична телефонна мережа</td>\n</tr>\n<tr>\n<td>📦 <strong>Пакетів</strong></td>\n<td>Дані діляться на пакети, кожен передається незалежно</td>\n<td>Змінна</td>\n<td>Висока: канал вільний між пакетами</td>\n<td>Інтернет, IP-мережі</td>\n</tr>\n<tr>\n<td>✉️ <strong>Повідомлень</strong></td>\n<td>Повідомлення передається цілком від вузла до вузла із збереженням у кожному</td>\n<td>Велика</td>\n<td>Середня: потрібні великі буфери</td>\n<td>Ранні поштові системи</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Чому Інтернет побудований на комутації пакетів</strong> <p>Трафік комп'ютерних мереж імпульсний: користувач хвилину завантажує сторінку, а потім десять хвилин її читає. Резервувати канал на весь цей час марнотратно. Пакетна комутація дозволяє сотням користувачів ділити один канал.</p>\n</div>\n\n","<h1>🗺️ Маршрутизація та маршрутизатор</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Маршрутизація</strong> (Routing) - процес визначення шляху проходження даних від відправника до отримувача через проміжні вузли. Виконується <strong>маршрутизаторами</strong> на мережевому рівні моделі OSI.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Комутатор доставляє кадр у межах однієї мережі. Коли отримувач знаходиться в іншій мережі, потрібен пристрій, який знає, куди передати пакет далі. Це маршрутизатор.</p>\n<p>Маршрутизатор має кілька мережевих інтерфейсів, кожен із яких належить своїй мережі. Отримавши пакет на одному інтерфейсі, він за адресою призначення визначає, через який інтерфейс і якому сусідові передати пакет далі. Це рішення приймається для кожного пакета окремо.</p>\n<h2>⚙️ Апаратний та програмний маршрутизатор</h2>\n<p>Спочатку маршрутизація виконувалася звичайним комп'ютером із кількома мережевими картами та спеціальним програмним забезпеченням. Згодом з'явилися спеціалізовані пристрої, у яких пересиланням пакетів займається окрема мікросхема, а процесор лише будує таблицю. Обидва підходи використовуються дотепер.</p>\n<table>\n<thead>\n<tr>\n<th>⚙️ Апаратний</th>\n<th>💻 Програмний</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Спеціалізований пристрій: пакети пересилає мікросхема ASIC</td>\n<td>Звичайний комп'ютер із кількома мережевими інтерфейсами</td>\n</tr>\n<tr>\n<td>Мільйони пакетів за секунду</td>\n<td>Швидкість обмежена процесором</td>\n</tr>\n<tr>\n<td>Cisco, Juniper, MikroTik</td>\n<td>RRAS у Windows Server, засоби ядра Linux</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Назва пристрою походить від основної функції</strong> <p>Маршрутизатор також комутує пакети між своїми портами, а комутатор обирає порт для кадру за таблицею MAC-адрес. Назва відображає головну функцію, а не єдину.</p>\n</div>\n\n","<h1>🗂️ Класифікація маршрутизації</h1>\n<p><strong>Головна ідея:</strong> Усі способи маршрутизації поділяються на дві групи залежно від того, чи зберігає маршрутизатор таблицю маршрутів.</p>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    R[🗺️ Вибір&lt;br/&gt;маршруту] --&gt; NT[📵 Без таблиць]\n    R --&gt; WT[📋 З таблицями]\n    NT --&gt; FL[🌊 Лавинна]\n    NT --&gt; EV[⚡ Керована&lt;br/&gt;подіями]\n    NT --&gt; SR[📍 Від джерела]\n    WT --&gt; ST[🔒 Статична]\n    WT --&gt; DY[🔄 Динамічна]\n    style R fill:#fff9c4,stroke:#f9a825\n    style NT fill:#fce4ec,stroke:#c2185b\n    style WT fill:#e3f2fd,stroke:#1565c0\n    style FL fill:#fce4ec,stroke:#c2185b\n    style EV fill:#fce4ec,stroke:#c2185b\n    style SR fill:#fce4ec,stroke:#c2185b\n    style ST fill:#e8f5e9,stroke:#388e3c\n    style DY fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1789449692155-5-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 936px;\" viewBox=\"4 4 936 312\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789449692155-5-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789449692155-5-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789449692155-5-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789449692155-5-0 .error-icon{fill:#552222;}#e n<td>Пакет іде маршрутом, який раніше вже приводив до успішної доставки</td>\n</tr>\n<tr>\n<td>📍 <strong>Від джерела</strong></td>\n<td>Відправник сам записує в пакет перелік проміжних маршрутизаторів</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 На практиці</strong> <p>У сучасних IP-мережах домінує маршрутизація на основі таблиць. Далі розглядаємо саме її.</p>\n</div>\n\n","<h1>🗄️ Таблиця маршрутизації</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Таблиця маршрутизації</strong> (Routing Table) - список відомих маршрутизатору мереж, де для кожної мережі вказано, через який інтерфейс і якому сусідньому маршрутизатору передати пакет.</p>\n</div>\n\n\n\n<p>Розглянемо маршрутизатор R1. До нього підключено локальну мережу, сусідній маршрутизатор R2 і провайдер:</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    LAN[🏠 10.1.0.0/24] --&gt; R1[🗺️ R1]\n    R1 --&gt;|10.2.0.0/24| R2[🗺️ R2&lt;br/&gt;10.2.0.2]\n    R2 --&gt; NET3[🏢 10.3.0.0/24]\n    R1 --&gt; ISP[🌐 Провайдер&lt;br/&gt;203.0.113.1]\n    style R1 fill:#fff3e0,stroke:#ef6c00\n    style R2 fill:#fff3e0,stroke:#ef6c00\n    style LAN fill:#e8f5e9,stroke:#388e3c\n    style NET3 fill:#e8f5e9,stroke:#388e3c\n    style ISP fill:#e3f2fd,stroke:#1565c0\"><svg id=\"exp-1789449692179-6-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 936px;\" viewBox=\"4 4 936 175.5\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789449692179-6-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789449692179-6-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789449692179-6-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animati -opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789449692179-6-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<h2>📋 Таблиця маршрутизації R1</h2>\n<table>\n<thead>\n<tr>\n<th>🌐 Мережа призначення</th>\n<th>➡️ Наступний маршрутизатор</th>\n<th>🔌 Інтерфейс R1</th>\n<th>Звідки маршрут</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>10.1.0.0/24</td>\n<td>не потрібен</td>\n<td>Gig0/0</td>\n<td>Мережа підключена до R1</td>\n</tr>\n<tr>\n<td>10.2.0.0/24</td>\n<td>не потрібен</td>\n<td>Gig0/1</td>\n<td>Мережа підключена до R1</td>\n</tr>\n<tr>\n<td>10.3.0.0/24</td>\n<td>R2 (10.2.0.2)</td>\n<td>Gig0/1</td>\n<td>Прописав адміністратор</td>\n</tr>\n<tr>\n<td>0.0.0.0/0</td>\n<td>Провайдер (203.0.113.1)</td>\n<td>Gig0/2</td>\n<td>Маршрут за замовчуванням</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Наступний маршрутизатор</strong> <p>Якщо мережа підключена безпосередньо до R1, посередник не потрібен: R1 сам доставить пакет отримувачу через свій інтерфейс. Якщо мережа далеко, у рядку вказано адресу сусіднього маршрутизатора, якому R1 передасть пакет, а той уже розбиратиметься далі.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Маршрут за замовчуванням</strong> <p>Рядок <code>0.0.0.0/0</code> означає \"усі інші мережі\". Маршрутизатору не потрібно знати весь Інтернет: усе, чого немає в таблиці, він передає провайдеру.</p>\n</div>\n\n","<h1>🔍 Як маршрутизатор обирає рядок таблиці</h1>\n<p><strong>Головна ідея:</strong> Маршрутизатор перевіряє, до якої мережі з таблиці належить адреса призначення пакета. Якщо підходить кілька рядків, перемагає точніший, тобто той, у якого довша маска.</p>\n<h2>🧮 Приклад: пакет до 10.3.0.77</h2>\n<table>\n<thead>\n<tr>\n<th>Рядок таблиці</th>\n<th>Чи належить 10.3.0.77 цій мережі?</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>10.1.0.0/24</td>\n<td>❌ Ні: 10.3 не дорівнює 10.1</td>\n</tr>\n<tr>\n<td>10.2.0.0/24</td>\n<td>❌ Ні: 10.3 не дорівнює 10.2</td>\n</tr>\n<tr>\n<td>10.3.0.0/24</td>\n<td>✅ Так: перші три октети збігаються</td>\n</tr>\n<tr>\n<td>0.0.0.0/0</td>\n<td>✅ Так: маска /0 означає \"будь-яка адреса\"</td>\n</tr>\n</tbody></table>\n<p>Підходять два рядки. Обираємо <strong>10.3.0.0/24</strong>, бо маска /24 довша за /0. Пакет передається на R2 (10.2.0.2).</p>\n<h2>🧮 Приклад: пакет до 8.8.8.8</h2>\n<p>Жоден із рядків 10.x.x.x не підходить. Підходить лише 0.0.0.0/0, тому пакет іде провайдеру (203.0.113.1).</p>\n<div class=\"warning\"><strong>⚠️ Чому саме довша маска</strong> <p>Довша маска описує меншу, а отже точнішу мережу. Рядок /24 каже \"я знаю саме цю мережу\", а рядок /0 лише \"усе інше\". Без цього правила маршрут за замовчуванням перехоплював би всі пакети.</p>\n</div>\n\n\n\n\n\n<div class=\"danger\"><strong>🚫 Немає жодного збігу</strong> <p>Якщо немає ані відповідного рядка, ані маршруту за замовчуванням, маршрутизатор відкидає пакет. Це одна з найчастіших причин, чому \"пінг не проходить\" у лабораторних роботах.</p>\n</div>\n\n","<h1>🛤️ Шлях пакета між мережами</h1>\n<p><strong>Головна ідея:</strong> Комп'ютер вирішує лише одне: чи знаходиться отримувач у його власній мережі. Усе, що поза нею, він передає <strong>шлюзу за замовчуванням</strong>, а далі рішення приймають маршрутизатори.</p>\n<div class=\"note\"><strong>📝 Чиєю маскою порівнюємо</strong> <p>ПК A не знає маску ПК B, він бачить лише його IP-адресу. Тому він накладає <strong>власну</strong> маску і на свою адресу, і на адресу отримувача та порівнює результати. Якщо адреси мережі збігаються, отримувач поруч, якщо ні, пакет іде на шлюз.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    PA[🖥️ ПК A&lt;br/&gt;10.1.0.10] --&gt; R1[🗺️ R1&lt;br/&gt;10.1.0.1]\n    R1 --&gt;|10.2.0.0/24| R2[🗺️ R2&lt;br/&gt;10.3.0.1]\n    R2 --&gt; PB[🖥️ ПК B&lt;br/&gt;10.3.0.20]\n    style PA fill:#e8f5e9,stroke:#388e3c\n    style PB class=\"edgeLabels\"><g class=\"edgeLabel\" transform=\"translate(437.8359375, 47.5)\"><g class=\"label\" data-id=\"L_R1_R2_0\" transform=\"translate(0, -10)\"><g><rect class=\"background\" style=\"\" x=\"-41.8359375\" y=\"-1\" width=\"83.671875\" height=\"22\"></rect><text y=\"-10.1\" text-anchor=\"middle\" style=\"\"><tspan class=\"text-outer-tspan row\" x=\"0\" y=\"-0.1em\" dy=\"1.1em\" text-anchor=\"middle\"><tspan font-style=\"normal\" class=\"text-inner-tspan\" font-weight=\"normal\">10.2.0.0/24</tspan></tspan></text></g></g></g></g><g class=\"nodes\"><g class=\"node default  \" id=\"exp-1789449692196-8-0-flowchart-PA-0\" data-look=\"neo\" transform=\"translate(88, 48)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🖥️ ПК A<br>10.1.0.10</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789449692196-8-0-flowchart-R1-1\" data-look=\"neo\" transform=\"translate(280, 48)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🗺️ R1<br>10.1.0.1</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789449692196-8-0-flowchart-R2-3\" data-look=\"neo\" transform=\"translate(595.671875, 48)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🗺️ R2<br>10.3.0.1</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789449692196-8-0-flowchart-PB-5\" data-look=\"neo\" transform=\"translate(787.671875, 48)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🖥️ ПК B<br>10.3.0.20</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789449692196-8-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789449692196-8-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"info\"><strong>ℹ️ Шлюз і маршрутизатор</strong> <p><strong>Шлюз за замовчуванням</strong> - це не окремий пристрій, а роль маршрутизатора з точки зору комп'ютера: той маршрутизатор у моїй мережі, якому я віддаю все, що йде назовні. Для ПК A шлюзом є R1 (10.1.0.1), для ПК B шлюзом є R2 (10.3.0.1). R1 при цьому для ПК B не шлюз, а просто один із маршрутизаторів на шляху.</p>\n</div>\n\n\n\n<h2>📦 ПК A (10.1.0.10/24) надсилає пакет до ПК B (10.3.0.20/24)</h2>\n<table>\n<thead>\n<tr>\n<th>Крок</th>\n<th>Хто</th>\n<th>Що робить</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1️⃣</td>\n<td>🖥️ ПК A</td>\n<td>Накладає свою маску /24 на обидві адреси: своя мережа 10.1.0.0, мережа отримувача 10.3.0.0. Вони різні, отже отримувач в іншій мережі</td>\n</tr>\n<tr>\n<td>2️⃣</td>\n<td>🖥️ ПК A</td>\n<td>Надсилає кадр на MAC-адресу шлюзу R1 (10.1.0.1). IP-адреса призначення в пакеті: 10.3.0.20</td>\n</tr>\n<tr>\n<td>3️⃣</td>\n<td>🗺️ R1</td>\n<td>Шукає 10.3.0.20 у таблиці: рядок 10.3.0.0/24 через R2. Передає пакет на R2</td>\n</tr>\n<tr>\n<td>4️⃣</td>\n<td>🗺️ R2</td>\n<td>Мережа 10.3.0.0/24 підключена до нього безпосередньо. Формує кадр на MAC-адресу ПК B і доставляє</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ Важливо</strong> <p>IP-адреси відправника та отримувача <strong>не змінюються</strong> на всьому шляху. На кожній ділянці змінюється лише кадр канального рівня, який маршрутизатор створює заново для наступного вузла.</p>\n</div>\n\n","<h1>🔒 Статична та 🔄 динамічна маршрутизація</h1>\n<p><strong>Головна ідея:</strong> Таблицю маршрутизації хтось має заповнити. Або це робить адміністратор вручну, і тоді маршрутизація статична, або маршрутизатори домовляються між собою через протокол маршрутизації, і тоді вона динамічна.</p>\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>🔒 Статична</th>\n<th>🔄 Динамічна</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Хто заповнює таблицю</td>\n<td>Адміністратор вручну</td>\n<td>Маршрутизатори автоматично через протокол маршрутизації</td>\n</tr>\n<tr>\n<td>Реакція на відмову каналу</td>\n<td>Відсутня: пакети продовжують іти \"в нікуди\"</td>\n<td>Таблиці перебудовуються, знаходиться обхідний шлях</td>\n</tr>\n<tr>\n<td>Службовий трафік</td>\n<td>Немає</td>\n<td>Є: маршрутизатори постійно обмінюються анонсами</td>\n</tr>\n<tr>\n<td>Передбачуваність</td>\n<td>Повна</td>\n<td>Маршрут може змінитися без участі адміністратора</td>\n</tr>\n<tr>\n<td>Масштаб</td>\n<td>Малі мережі, один вихід до провайдера</td>\n<td>Середні та великі мережі з кількома шляхами</td>\n</tr>\n</tbody></table>\n<h2>💻 Статичні маршрути у Cisco IOS</h2>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">R1(config)# ip route 10.3.0.0 255.255.255.0 10.2.0.2\nR1(config)# ip route 0.0.0.0 0.0.0.0 203.0.113.1\nR1# show ip route</code></pre><p>Перша команда: мережу 10.3.0.0/24 передавати на R2. Друга: усе інше передавати провайдеру. Третя показує таблицю: статичні маршрути позначено <strong>S</strong>, підключені мережі <strong>C</strong>.</p>\n<div class=\"info\"><strong>ℹ️ Дві функції динамічного маршрутизатора</strong> <p>📋 Підтримувати власну таблицю в актуальному стані на основі анонсів сусідів.<br>📡 Розповсюджувати анонси про свої мережі та зміни топології серед сусідів.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Збіжність</strong> <p><strong>Збіжність</strong> (Convergence) - стан, коли всі маршрутизатори мережі мають узгоджені таблиці. Час збіжності після зміни топології - ключова характеристика протоколу маршрутизації.</p>\n</div>\n\n","<h1>📏 Метрика маршруту</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Метрика</strong> (Metric) - числова оцінка \"вартості\" маршруту. Якщо до мережі є кілька шляхів, протокол обирає той, у якого метрика менша.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Параметр</th>\n<th>Що описує</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔢 <strong>Кількість переходів</strong></td>\n<td>Число маршрутизаторів на шляху до призначення</td>\n</tr>\n<tr>\n<td>📶 <strong>Смуга пропускання</strong></td>\n<td>Пропускна здатність каналів на шляху</td>\n</tr>\n<tr>\n<td>⏱️ <strong>Затримка</strong></td>\n<td>Час проходження пакета каналом</td>\n</tr>\n<tr>\n<td>📊 <strong>Навантаження</strong></td>\n<td>Наскільки канал зайнятий у даний момент</td>\n</tr>\n<tr>\n<td>🛡️ <strong>Надійність</strong></td>\n<td>Рівень помилок у каналі</td>\n</tr>\n<tr>\n<td>💰 <strong>Вартість</strong></td>\n<td>Довільне значення, задане адміністратором</td>\n</tr>\n</tbody></table>\n<h2>🧮 Приклад: різні протоколи обирають різні шляхи</h2>\n<p>Два шляхи до однієї мережі:</p>\n<table>\n<thead>\n<tr>\n<th>Шлях</th>\n<th>Переходи</th>\n<th>Канали</th>\n<th>RIP рахує переходи</th>\n<th>OSPF рахує вартість каналів</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td>2</td>\n<td>Два канали 10 Мбіт/с</td>\n<td><strong>2</strong></td>\n<td>10 + 10 = 20</td>\n</tr>\n<tr>\n<td>B</td>\n<td>3</td>\n<td>Три канали 1 Гбіт/с</td>\n<td>3</td>\n<td>1 + 1 + 1 = <strong>3</strong></td>\n</tr>\n</tbody></table>\n<p>RIP обере шлях A як коротший, OSPF обере шлях B як швидший.</p>\n<div class=\"note\"><strong>📝 Як OSPF рахує вартість каналу</strong> <p>Вартість = 100 Мбіт/с ÷ швидкість каналу, але не менше 1. Канал 10 Мбіт/с коштує 10, канал 100 Мбіт/с і швидший коштує 1. Вартість шляху - сума вартостей каналів.</p>\n</div>\n\n","<h1>🧮 Алгоритми динамічної маршрутизації</h1>\n<p><strong>Головна ідея:</strong> Є два способи дізнатися, як дістатися до віддаленої мережі: запитати сусідів або мати власну карту.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    DV[📐 Дистанційно-&lt;br/&gt;векторний] --&gt; DV1[🗣️ Питає&lt;br/&gt;сусідів]\n    DV1 --&gt; DV2[➕ Довіряє&lt;br/&gt;відповіді]\n    LS[🗺️ Стану&lt;br/&gt;каналів] --&gt; LS1[🧩 Збирає&lt;br/&gt;карту мережі]\n    LS1 --&gt; LS2[🧮 Сам рахує&lt;br/&gt;шлях]\n    style DV fill:#fff3e0,stroke:#ef6c00\n    style DV1 fill:#fff3e0,stroke:#ef6c00\n    style DV2 fill:#fff3e0,stroke:#ef6c00\n    style LS fill:#e3f2fd,stroke:#1565c0\n    style LS1 fill:#e3f2fd,stroke:#1565c0\n    style LS2 fill:#e3f2fd,stroke:#1565c0\"><svg id=\"exp-1789449692220-11-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 552px;\" viewBox=\"4 4 552 224\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789449692220-11-0{font-family:sys el \"><p>🧮 Сам рахує<br>шлях</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789449692220-11-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789449692220-11-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<p>📐 <strong>Дистанційно-векторний</strong> (Distance Vector): маршрутизатор знає лише те, що йому сказали сусіди. Сусід повідомляє \"до мережі X мені 3 переходи\", маршрутизатор записує \"до X мені 4, через цього сусіда\". Усієї мережі він не бачить.</p>\n<p>🗺️ <strong>Стану каналів</strong> (Link State): кожен маршрутизатор повідомляє лише про свої власні канали, але це повідомлення доходить до всіх маршрутизаторів мережі, а не лише до сусідів. Зібравши такі повідомлення від усіх, кожен має повну карту мережі і сам обчислює найкоротший шлях за алгоритмом Дейкстри.</p>\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>📐 Дистанційно-векторний</th>\n<th>🗺️ Стану каналів</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Що знає маршрутизатор</td>\n<td>Лише сусідів і їхні слова про решту мережі</td>\n<td>Усю мережу: хто з ким з'єднаний і з якою вартістю</td>\n</tr>\n<tr>\n<td>Що передається</td>\n<td>Готова таблиця маршрутів, лише сусідам</td>\n<td>Факти про власні канали, усім маршрутизаторам</td>\n</tr>\n<tr>\n<td>Збіжність</td>\n<td>Повільна</td>\n<td>Швидка</td>\n</tr>\n<tr>\n<td>Масштаб</td>\n<td>Малі мережі</td>\n<td>Середні та великі мережі</td>\n</tr>\n<tr>\n<td>Приклад</td>\n<td><strong>RIP</strong>: метрика - переходи, максимум 15</td>\n<td><strong>OSPF</strong>: метрика - вартість за смугою пропускання</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Аналогія</strong> <p>Дистанційно-векторний підхід - дороговказ на перехресті: \"до міста N 40 км, прямо\". Ви довіряєте табличці, не бачачи дороги. Стану каналів - навігатор із повною картою, який сам будує маршрут.</p>\n</div>\n\n","<h1>⚖️ Комутатор vs маршрутизатор</h1>\n<p><strong>Головна ідея:</strong> Обидва пристрої пересилають дані, але на різних рівнях моделі OSI. Комутатор працює з MAC-адресами в межах однієї мережі, маршрутизатор з IP-адресами між мережами.</p>\n<table>\n<thead>\n<tr>\n<th>Функція</th>\n<th>🔀 Комутатор</th>\n<th>🗺️ Маршрутизатор</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏗️ Рівень OSI</td>\n<td>Канальний (2)</td>\n<td>Мережевий (3)</td>\n</tr>\n<tr>\n<td>🏷️ Адресація</td>\n<td>MAC-адреси</td>\n<td>IP-адреси</td>\n</tr>\n<tr>\n<td>🗄️ Таблиця</td>\n<td>MAC-адреса → порт</td>\n<td>Мережа → наступний маршрутизатор</td>\n</tr>\n<tr>\n<td>⚡ Швидкість обробки</td>\n<td>Вища</td>\n<td>Нижча</td>\n</tr>\n<tr>\n<td>📢 Широкомовні розсилки</td>\n<td>Пропускає на всі порти</td>\n<td>Блокує</td>\n</tr>\n<tr>\n<td>🌐 Сегментація</td>\n<td>Розділяє домени колізій, широкомовний домен спільний</td>\n<td>Розділяє і домени колізій, і широкомовні домени</td>\n</tr>\n<tr>\n<td>🛡️ Безпека</td>\n<td>Нижча</td>\n<td>Вища: може фільтрувати трафік між мережами</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph D1[Домен 1]\n        PC1[🖥️ ПК 1] --&gt; SW1[🔀 SW1]\n        PC2[🖥️ ПК 2] --&gt; SW1\n    end\n    SW1 --&gt; R[🗺️ R1]\n    R --&gt; SW2\n    subgraph D2[Домен 2]\n        SW2[🔀 SW2] --&gt; PC3[🖥️ ПК 3]\n        SW2 --&gt; PC4[🖥️ ПК 4]\n    end\n    style D1 fill:#e8f5e9,stroke:#388e3c\n    style D2 fill:#e3f2fd,stroke:#1565c0\n    style R fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1789449692244-12-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1092px;\" viewBox=\"4 4 1092 237\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789449692244-12-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial SW2</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789449692244-12-0-flowchart-PC3-9\" data-look=\"neo\" transform=\"translate(988, 87)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🖥️ ПК 3</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789449692244-12-0-flowchart-PC4-11\" data-look=\"neo\" transform=\"translate(988, 185)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🖥️ ПК 4</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789449692244-12-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789449692244-12-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"warning\"><strong>⚠️ Широкомовний шторм</strong> <p>Комутатори пропускають широкомовні кадри на всі порти. Якщо через петлю або помилку конфігурації їх кількість лавиноподібно зростає, виникає <strong>широкомовний шторм</strong>, який паралізує сегмент. Маршрутизатор обмежує шторм одним широкомовним доменом.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> <ol>\n<li><strong>Комутація</strong> дозволяє абонентам спільно використовувати канали. Інтернет побудований на комутації пакетів</li>\n<li><strong>Маршрутизація</strong> визначає шлях пакета між мережами і виконується маршрутизаторами на мережевому рівні моделі OSI</li>\n<li><strong>Таблиця маршрутизації</strong> для кожної мережі вказує інтерфейс і сусідній маршрутизатор. Рядок 0.0.0.0/0 приймає \"усе інше\"</li>\n<li><strong>Довша маска перемагає</strong>: точніша мережа завжди має пріоритет над загальнішою</li>\n<li><strong>IP-адреси не змінюються</strong> на шляху пакета, кадр створюється заново на кожній ділянці</li>\n<li><strong>Статична</strong> маршрутизація проста і передбачувана, <strong>динамічна</strong> сама адаптується до змін</li>\n<li><strong>Метрика</strong> визначає найкращий шлях: RIP рахує переходи, OSPF враховує смугу пропускання</li>\n<li><strong>Комутатор</strong> працює з MAC-адресами в одній мережі, <strong>маршрутизатор</strong> з IP-адресами між мережами і блокує широкомовний трафік</li>\n</ol>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 Що таке комутація і чому неможливо надати кожній парі абонентів окрему лінію?</p>\n</li>\n<li><p>🤔 Чим відрізняються комутація каналів, пакетів та повідомлень?</p>\n</li>\n<li><p>🤔 Що таке маршрутизація і на якому рівні моделі OSI вона виконується?</p>\n</li>\n<li><p>🤔 Що зберігається в таблиці маршрутизації? Чому при кількох збігах обирається рядок із довшою маскою?</p>\n</li>\n<li><p>🤔 Що таке маршрут за замовчуванням і для чого він потрібен?</p>\n</li>\n<li><p>🤔 Коли доцільна статична маршрутизація, а коли динамічна?</p>\n</li>\n<li><p>🤔 Що таке метрика і чому RIP та OSPF можуть обрати різні шляхи?</p>\n</li>\n<li><p>🤔 Чому маршрутизатор обмежує широкомовний шторм, а комутатор ні?</p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Комутація</td>\n<td>Switching</td>\n<td>З'єднання абонентів через транзитні вузли зі спільним використанням каналів</td>\n</tr>\n<tr>\n<td>Комутація пакетів</td>\n<td>Packet Switching</td>\n<td>Передача даних незалежними пакетами зі спільним використанням каналів</td>\n</tr>\n<tr>\n<td>Маршрутизація</td>\n<td>Routing</td>\n<td>Визначення шляху передачі даних між мережами через проміжні вузли</td>\n</tr>\n<tr>\n<td>Маршрутизатор</td>\n<td>Router</td>\n<td>Пристрій мережевого рівня, що пересилає пакети між мережами</td>\n</tr>\n<tr>\n<td>Протокол маршрутизації</td>\n<td>Routing Protocol</td>\n<td>Протокол обміну інформацією про мережі між маршрутизаторами, наприклад RIP, OSPF</td>\n</tr>\n<tr>\n<td>Таблиця маршрутизації</td>\n<td>Routing Table</td>\n<td>Список мереж із зазначенням інтерфейсу та наступного маршрутизатора для кожної</td>\n</tr>\n<tr>\n<td>Маршрут за замовчуванням</td>\n<td>Default Route</td>\n<td>Маршрут 0.0.0.0/0, що використовується за відсутності точнішого збігу</td>\n</tr>\n<tr>\n<td>Шлюз за замовчуванням</td>\n<td>Default Gateway</td>\n<td>Маршрутизатор, якому комп'ютер передає пакети для інших мереж</td>\n</tr>\n<tr>\n<td>Метрика</td>\n<td>Metric</td>\n<td>Числова оцінка вартості маршруту; менше значення означає кращий маршрут</td>\n</tr>\n<tr>\n<td>Збіжність</td>\n<td>Convergence</td>\n<td>Стан, коли всі маршрутизатори мережі мають узгоджені таблиці</td>\n</tr>\n<tr>\n<td>Широкомовний домен</td>\n<td>Broadcast Domain</td>\n<td>Частина мережі, у межах якої поширюються широкомовні кадри</td>\n</tr>\n<tr>\n<td>Широкомовний шторм</td>\n<td>Broadcast Storm</td>\n<td>Лавиноподібне зростання широкомовного трафіку, що паралізує сегмент мережі</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>OSI</strong></td>\n<td>Open Systems Interconnection</td>\n<td>Модель взаємодії відкритих систем</td>\n</tr>\n<tr>\n<td><strong>IP</strong></td>\n<td>Internet Protocol</td>\n<td>Міжмережевий протокол</td>\n</tr>\n<tr>\n<td><strong>MAC</strong></td>\n<td>Media Access Control</td>\n<td>Керування доступом до середовища</td>\n</tr>\n<tr>\n<td><strong>RIP</strong></td>\n<td>Routing Information Protocol</td>\n<td>Протокол маршрутної інформації</td>\n</tr>\n<tr>\n<td><strong>OSPF</strong></td>\n<td>Open Shortest Path First</td>\n<td>Протокол вибору найкоротшого шляху першим</td>\n</tr>\n<tr>\n<td><strong>ASIC</strong></td>\n<td>Application-Specific Integrated Circuit</td>\n<td>Спеціалізована інтегральна мікросхема</td>\n</tr>\n<tr>\n<td><strong>RRAS</strong></td>\n<td>Routing and Remote Access Service</td>\n<td>Служба маршрутизації та віддаленого доступу</td>\n</tr>\n<tr>\n<td><strong>IOS</strong></td>\n<td>Internetwork Operating System</td>\n<td>Операційна система мережевих пристроїв Cisco</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;

function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
