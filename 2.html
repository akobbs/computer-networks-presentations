#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 19</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>Апаратні засоби побудови та структуризації комп'ютерних мереж</h1>\n<p><strong>Курс:</strong> Організація компʼютерних мереж / Компʼютерні мережі</p>\n<p><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h1>📋 План лекції</h1>\n<ol>\n<li>🧰 Що таке мережеве обладнання</li>\n<li>🔌 Мережевий адаптер: ворота комп'ютера в мережу</li>\n<li>🔄 Концентратор: усі чують усіх</li>\n<li>🔀 Комутатор: кожному лише його дані</li>\n<li>🌳 Spanning Tree: захист від петель</li>\n<li>🌐 Маршрутизатор: з'єднання різних мереж</li>\n<li>🌉 Міст та 🚪 шлюз</li>\n<li>🏗️ Як пристрої ділять мережу на частини</li>\n<li>📝 Висновки, контрольні питання, глосарій</li>\n</ol>\n","<h1>🧰 Що таке мережеве обладнання</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Мережеве обладнання</strong> (Network Hardware) - технічні засоби, які фізично з'єднують комп'ютери, передають дані між ними та ділять мережу на частини: мережеві адаптери, концентратори, комутатори, маршрутизатори, мости, шлюзи.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> кожен пристрій \"розуміє\" дані лише до певної глибини. Одні бачать лише електричний сигнал, інші вміють читати адресу отримувача, а треті розуміють навіть, яка програма надіслала дані.</p>\n<table>\n<thead>\n<tr>\n<th>Що бачить пристрій</th>\n<th>Аналогія зі службою доставки посилок</th>\n<th>Пристрої</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1️⃣ Лише сигнал</td>\n<td>Стрічка конвеєра, що везе всі посилки підряд, не читаючи їх</td>\n<td>Концентратор</td>\n</tr>\n<tr>\n<td>2️⃣ Адресу пристрою (MAC-адресу)</td>\n<td>Кур'єр, що дивиться номер квартири у своєму будинку</td>\n<td>Комутатор, міст</td>\n</tr>\n<tr>\n<td>3️⃣ Адресу мережі (IP-адресу)</td>\n<td>Сортувальний термінал, що читає місто та відділення</td>\n<td>Маршрутизатор</td>\n</tr>\n<tr>\n<td>4️⃣ Зміст даних</td>\n<td>Перекладач, що переписує вкладений лист іншою мовою</td>\n<td>Шлюз</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Дві адреси, які треба розрізняти</strong> <p><strong>MAC-адреса</strong> - унікальний номер, \"зашитий\" виробником у кожен мережевий адаптер. Працює всередині однієї локальної мережі. <strong>IP-адреса</strong> - адреса, яку призначають при налаштуванні мережі. За нею дані знаходять шлях між різними мережами, зокрема в Інтернеті.</p>\n</div>\n\n","<h1>🔌 Мережевий адаптер (NIC)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Мережевий адаптер</strong> (NIC, Network Interface Card / Мережева інтерфейсна карта) - пристрій усередині комп'ютера, який з'єднує його з кабелем або радіоканалом і перетворює дані на сигнали для передачі.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> процесор працює з байтами, а кабель передає електричні або світлові імпульси. Адаптер є перекладачем між ними в обидва боки. Без нього комп'ютер не може стати частиною мережі.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🖥️ Процесор та операційна система] &lt;--&gt;|Байти даних| B[🔌 Мережевий адаптер]\n    B &lt;--&gt;|Сигнали| C[🌐 Кабель або радіоканал]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#fff3e0,stroke:#ef6c00\n    style C fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1788586587521-3-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1003.859375px;\" viewBox=\"0 0 1003.859375 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586587521-3-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788586587521-3-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788586587521-3-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788586587521-3-0 .error-icon{fill:#552222;}#exp-1788586587521-3-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788586587521-3-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788586587521-3-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788586587521-3-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1788586587521-3-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1788586587521-3-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1788586587521 defs></svg></div>\n<h2>⚙️ Що робить адаптер</h2>\n<table>\n<thead>\n<tr>\n<th>Функція</th>\n<th>Простими словами</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔄 Перетворення даних</td>\n<td>Байти перетворює на сигнали при передачі та сигнали на байти при прийомі</td>\n</tr>\n<tr>\n<td>🎯 Відбір своїх кадрів</td>\n<td>Пропускає в комп'ютер лише дані, адресовані його MAC-адресі, решту відкидає</td>\n</tr>\n<tr>\n<td>💾 Тимчасове зберігання</td>\n<td>Накопичує дані в буфері, бо швидкість мережі та комп'ютера відрізняються</td>\n</tr>\n<tr>\n<td>🚦 Черга на передачу</td>\n<td>Слідкує, чи вільний канал, і не починає передачу, поки хтось інший передає</td>\n</tr>\n<tr>\n<td>⚡ Електричний захист</td>\n<td>Ізолює комп'ютер від кабелю, щоб перепад напруги в мережі не пошкодив його</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Види адаптерів</strong> <p>Дротові адаптери Ethernet та бездротові Wi-Fi. Класично адаптер - окрема плата, у сучасних комп'ютерах він вбудований у материнську плату.</p>\n</div>\n\n","<h1>🔄 Концентратор (Hub)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Концентратор</strong> (Hub) - пристрій із кількома портами, який будь-який сигнал, що прийшов на один порт, просто повторює на всі інші порти.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> концентратор нічого не читає й не аналізує. Він працює як гучномовець: що б не сказав один пристрій, чують усі. Кожен адаптер сам вирішує, чи призначені ці дані йому.</p>\n\n<div class=\"mermaid\" data-source=\"graph TB\n    PC1[💻 ПК 1 передає] --&gt;|Порт 1| H((🔄 Концентратор))\n    H --&gt;|Порт 2| PC2[💻 ПК 2 отримує копію]\n    H --&gt;|Порт 3| PC3[💻 ПК 3 отримує копію]\n    H --&gt;|Порт 4| PC4[💻 ПК 4 отримує копію]\n    style H fill:#fce4ec,stroke:#c2185b\n    style PC1 fill:#e3f2fd,stroke:#1565c0\n    style PC2 fill:#fff9c4,stroke:#f9a825\n    style PC3 fill:#fff9c4,stroke:#f9a825\n    style PC4 fill:#fff9c4,stroke:#f9a825\"><svg id=\"exp-1788586587534-4-0\" width=\"100%\" xmln de default  \" id=\"exp-1788586587534-4-0-flowchart-H-1\" data-look=\"classic\" transform=\"translate(392.59375, 200.3203125)\"><circle class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" r=\"72.3203125\" cx=\"0\" cy=\"0\"></circle><g class=\"label\" style=\"\" transform=\"translate(-66.3203125, -12)\"><rect></rect><foreignObject width=\"132.640625\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔄 Концентратор</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587534-4-0-flowchart-PC2-3\" data-look=\"classic\" transform=\"translate(119.46875, 368.640625)\"><rect class=\"basic label-container\" style=\"fill:#fff9c4 !important;stroke:#f9a825 !important\" x=\"-111.46875\" y=\"-24\" width=\"222.9375\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-87.46875, -12)\"><rect></rect><foreignObject width=\"174.9375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻 ПК 2 отримує копію</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587534-4-0-flowchart-PC3-5\" data-look=\"classic\" transform=\"translate(392.59375, 368.640625)\"><rect class=\"basic label-container\" style=\"fill:#fff9c4 !important;stroke:#f9a825 !important\" x=\"-111.65625\" y=\"-24\" width=\"223.3125\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-87.65625, -12)\"><rect></rect><foreignObject width=\"175.3125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻 ПК 3 отримує копію</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587534-4-0-flowchart-PC4-7\" data-look=\"classic\" transform=\"translate(666.0390625, 368.640625)\"><rect class=\"basic label-container\" style=\"fill:#fff9c4 !important;stroke:#f9a825 !important\" x=\"-111.7890625\" y=\"-24\" width=\"223.578125\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-87.7890625, -12)\"><rect></rect><foreignObject width=\"175.578125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻 ПК 4 отримує копію</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788586587534-4-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586587534-4-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"warning\"><strong>⚠️ Колізія</strong> <p>Якщо два комп'ютери починають передачу одночасно, їхні сигнали накладаються і псуються. Це називають <strong>колізією</strong> (Collision). Обидва відправники зупиняються, чекають випадковий короткий час і пробують знову. Через концентратор одночасно може говорити лише один пристрій, як у розмові по рації: поки говорить один, решта слухає.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Наслідок</strong> <p>Що більше комп'ютерів підключено до концентратора, то частіше виникають колізії і то менша частка часу дістається кожному. Пропускна здатність одного порту ділиться між усіма.</p>\n</div>\n\n","<h1>🔄 Концентратор: різновиди та особливості</h1>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>У чому різниця</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔋 Пасивний</td>\n<td>Просто з'єднує кабелі, сигнал не підсилює</td>\n</tr>\n<tr>\n<td>⚡ Активний</td>\n<td>Підсилює ослаблений сигнал, тому потребує живлення від розетки</td>\n</tr>\n<tr>\n<td>🧠 Інтелектуальний</td>\n<td>Має вбудований процесор і може повідомляти про несправності</td>\n</tr>\n<tr>\n<td>📚 Стековий</td>\n<td>Кілька корпусів з'єднуються спеціальним кабелем і працюють як один</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Автоматичне відключення несправного порту</strong> <p>Концентратор кожні 16 мілісекунд надсилає в кожен порт тестовий імпульс. Якщо відповіді немає, порт вимикається, щоб несправний кабель або комп'ютер не заважав решті мережі. Коли відповідь з'являється знову, порт вмикається автоматично.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Дешевий і простий, налаштувань немає</td>\n<td>Одночасно передає лише один пристрій, решта чекає</td>\n</tr>\n<tr>\n<td>Обрив одного кабелю вимикає лише один комп'ютер</td>\n<td>Усі бачать чужі дані, що небезпечно</td>\n</tr>\n<tr>\n<td>Лампочки на портах показують, де є зв'язок</td>\n<td>Що більше пристроїв, то повільніша мережа</td>\n</tr>\n<tr>\n<td>Зручний для спостереження за всім трафіком</td>\n<td>Витіснений комутаторами, у нових мережах не застосовується</td>\n</tr>\n</tbody></table>\n","<h1>🔀 Комутатор (Switch)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Комутатор</strong> (Switch) - пристрій із кількома портами, який читає в кожному кадрі MAC-адресу отримувача і передає кадр лише на той порт, до якого підключений отримувач.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Що таке кадр</strong> <p><strong>Кадр</strong> (Frame) - порція даних, яку адаптер надсилає в мережу. Як конверт: на ньому вказано MAC-адресу \"від кого\" та \"кому\", а всередині лежать самі дані.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> комутатор веде <strong>таблицю</strong>, у якій записано, який комп'ютер підключений до якого п =\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>3️⃣ Шукає MAC отримувача в таблиці</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587562-7-0-flowchart-D-5\" data-look=\"classic\" transform=\"translate(959.2109375, 111)\"><polygon points=\"61.5234375,0 123.046875,-61.5234375 61.5234375,-123.046875 0,-61.5234375\" class=\"label-container\" transform=\"translate(-61.0234375, 61.5234375)\" style=\"fill:#f3e5f5 !important;stroke:#7b1fa2 !important\"></polygon><g class=\"label\" style=\"\" transform=\"translate(-37.5234375, -12)\"><rect></rect><foreignObject width=\"75.046875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>Знайшов?</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587562-7-0-flowchart-E-7\" data-look=\"classic\" transform=\"translate(1224.609375, 44)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>✅ Передає лише на потрібний порт</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587562-7-0-flowchart-F-9\" data-look=\"classic\" transform=\"translate(1224.609375, 178)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-124\" y=\"-48\" width=\"248\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -36)\"><rect></rect><foreignObject width=\"200\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>📢 Передає на всі порти, крім того, звідки прийшов кадр</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788586587562-7-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586587562-7-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"tip\"><strong>💡 Приклад</strong> <p>ПК 1 надсилає перший кадр для ПК 2. Комутатор ще нікого не знає, тому запам'ятовує \"ПК 1 на порту 1\" і розсилає кадр усім. ПК 2 відповідає, і комутатор запам'ятовує \"ПК 2 на порту 2\". Далі кадри між ними йдуть лише через ці два порти.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Керовані та некеровані</strong> <p><strong>Некерований</strong> комутатор працює одразу після підключення кабелів і не має жодних налаштувань. <strong>Керований</strong> дозволяє адміністратору заходити в його інтерфейс і налаштовувати: наприклад, розділяти порти на кілька ізольованих груп або обмежувати швидкість окремих портів.</p>\n</div>\n\n","<h1>⚡ Два способи комутації</h1>\n<p><strong>Головна ідея:</strong> комутатор може або відправляти кадр далі одразу, щойно прочитав адресу отримувача, або спочатку прийняти його повністю і перевірити, чи не пошкоджений він у дорозі.</p>\n<table>\n<thead>\n<tr>\n<th>Спосіб</th>\n<th>Коли починає передавати</th>\n<th>Швидкість</th>\n<th>Пошкоджені кадри</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏃 \"На льоту\" (cut-through)</td>\n<td>Одразу після прочитання адреси отримувача</td>\n<td>Найшвидше</td>\n<td>❌ Передаються далі</td>\n</tr>\n<tr>\n<td>📦 З повним прийомом (store-and-forward)</td>\n<td>Після прийому всього кадру та перевірки цілісності</td>\n<td>Повільніше</td>\n<td>✅ Відкидаються</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Аналогія з кур'єром</strong> <p>Перший кур'єр читає лише адресу на конверті й одразу біжить. Другий спочатку перевіряє, чи конверт не порваний і не мокрий, і зіпсовані листи не доставляє. Другий повільніший, зате отримувач не витрачає час на непотріб.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Як перевіряють цілісність</strong> <p>У кінці кожного кадру відправник додає <strong>контрольну суму</strong>: число, обчислене з усіх байтів кадру. Отримувач обчислює її знову. Якщо числа не збіглися, кадр у дорозі спотворився. Більшість сучасних комутаторів працює саме за другим способом.</p>\n</div>\n\n","<h1>🌳 Spanning Tree: захист від петель</h1>\n<p><strong>Головна ідея:</strong> щоб мережа не зупинилась через один обірваний кабель, комутатори з'єднують кількома шляхами. Але зайвий шлях створює <strong>петлю</strong>, у якій кадр може кружляти нескінченно і забити мережу. STP залишає активним лише один шлях, а запасний вмикає лише тоді, коли основний обірвався.</p>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>STP</strong> (Spanning Tree Protocol / Протокол кістякового дерева) - механізм, за яким комутатори самі домовляються, які з'єднання залишити активними, а які тимчасово заблокувати, щоб у мережі не було петель.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph TB\n    R[👑 Головний комутатор] --- S1[🔀 Комутатор A]\n    R --- S2[🔀 Комутатор B]\n    S1 -. ⛔ Запасний шлях заблоковано .- S2\n    style R fill:#fff9c4,stroke:#f9a825\n    style S1 fill:#e8f5e9,stroke:#388e3c\n    style S2 fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1788586587574-9-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 273.60546875px;\" viewBox=\"0 0 273.60546875 301.6000061035156\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586587574-9-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788586587574-9-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788586587574-9-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788586587574-9-0 .error-icon{fill:#552222;}#exp-1788586587574-9-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788586587574-9-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788586587574-9-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788586587574-9-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1788586587574-9-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1788586587574-9-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1788586587574-9-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1788586587574-9-0 .marker{fill:#333333;stroke:#333333;}#exp-1788586587574-9-0 .marker.cross{stroke:#333333;}#exp-1788586587574-9-0 svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;}#exp-1788586587574-9-0 p{margin:0;}#exp-1788586587574-9-0 .label{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;color:#333;}#exp-1788586587574-9-0 .cluster-label text{fill:#333;}#exp-1788586587574-9-0 .cluster-label span{color:#333;}#exp-1788586587574-9-0 .cluster-label span p{background-color:transparent;}#exp-1788586587574-9 efs><filter id=\"exp-1788586587574-9-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586587574-9-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<h2>🪜 Як комутатори домовляються</h2>\n<table>\n<thead>\n<tr>\n<th>Крок</th>\n<th>Що відбувається</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1️⃣</td>\n<td>Обирається <strong>головний (кореневий) комутатор</strong>: той, у якого найменший ідентифікатор, або призначений адміністратором</td>\n</tr>\n<tr>\n<td>2️⃣</td>\n<td>Кожен інший комутатор визначає, через який свій порт до головного найкоротший шлях</td>\n</tr>\n<tr>\n<td>3️⃣</td>\n<td>Усі інші з'єднання, що ведуть до головного довшим шляхом, блокуються</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Результат</strong> <p>Петлі зникають, а мережа лишається стійкою: якщо активний кабель обірветься, заблокований порт увімкнеться автоматично.</p>\n</div>\n\n","<h1>🌐 Маршрутизатор (Router)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Маршрутизатор</strong> (Router) - пристрій, який з'єднує кілька різних мереж і за IP-адресою отримувача вирішує, у яку з них передати дані.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> комутатор доставляє кадри всередині однієї локальної мережі, наприклад в одному офісі. Маршрутизатор передає дані <strong>між</strong> мережами: з офісу до провайдера, від провайдера далі в Інтернет. Домашній Wi-Fi роутер саме це й робить: з'єднує домашню мережу з мережею провайдера.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph L1[🏠 Домашня мережа]\n        PC1[💻 Ноутбук]\n        PC2[📱 Смартфон]\n    end\n    R[🌐 Маршрутизатор]\n    I[☁️ Мережа провайдера та Інтернет]\n    PC1 --- R\n    PC2 --- R\n ></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587583-10-0-flowchart-I-3\" data-look=\"classic\" transform=\"translate(627.28125, 116)\"><rect class=\"basic label-container\" style=\"fill:#fff9c4 !important;stroke:#f9a825 !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>☁️ Мережа провайдера та Інтернет</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788586587583-10-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586587583-10-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"note\"><strong>📝 Таблиця маршрутизації</strong> <p>Комутатор має таблицю \"яка MAC-адреса на якому порту\". Маршрутизатор має схожу таблицю, але про мережі: \"щоб потрапити в таку мережу, передай дані на такий інтерфейс такому сусідньому маршрутизатору\". Таблицю заповнює адміністратор вручну або маршрутизатори обмінюються цією інформацією між собою автоматично.</p>\n</div>\n\n","<h1>🌐 Що ще вміє маршрутизатор</h1>\n<p><strong>Головна ідея:</strong> окрім передачі даних між мережами, сучасний маршрутизатор бере на себе кілька службових завдань локальної мережі.</p>\n<table>\n<thead>\n<tr>\n<th>Функція</th>\n<th>Простими словами</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏷️ DHCP</td>\n<td>Сам роздає IP-адреси всім пристроям, які підключаються, щоб не налаштовувати кожен вручну</td>\n</tr>\n<tr>\n<td>🔁 NAT</td>\n<td>Дозволяє десяткам домашніх пристроїв виходити в Інтернет через одну адресу від провайдера</td>\n</tr>\n<tr>\n<td>🛡️ Міжмережевий екран</td>\n<td>Не пропускає з Інтернету з'єднання, які ніхто в локальній мережі не запитував</td>\n</tr>\n<tr>\n<td>📡 Точка доступу Wi-Fi</td>\n<td>Підключає бездротові пристрої</td>\n</tr>\n<tr>\n<td>🔋 Живлення через кабель</td>\n<td>Подає електроживлення камерам і точкам доступу тим самим кабелем, що й дані (PoE)</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Домашній роутер: чотири пристрої в одному</strong> <p>Усередині типового Wi-Fi роутера є маршрутизатор, невеликий комутатор на 4 порти, точка доступу Wi-Fi та сервер DHCP. Один кабель від провайдера перетворюється на доступ для всіх пристроїв удома.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Характеристики при виборі</strong> <p>Швидкість обробки (скільки пакетів за секунду), кількість і тип портів, підтримка Wi-Fi та наявність перелічених вище функцій.</p>\n</div>\n\n","<h1>🌉 Міст (Bridge)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Міст</strong> (Bridge) - пристрій, який з'єднує два сегменти мережі та передає кадр з одного в інший лише тоді, коли отримувач знаходиться в іншому сегменті.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> міст є попередником комутатора. Колись мережу будували на концентраторах, і що більше в ній ставало комп'ютерів, то більше було колізій. Міст ділив таку мережу на дві частини: локальні кадри залишалися у своїй половині, і колізій ставало вдвічі менше.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph S1[Сегмент 1]\n        A[💻 ПК A] --- H1((🔄 Hub))\n        B[💻 ПК B] --- H1\n    end\n    H1 --- BR[🌉 Міст]\n    BR --- H2\n    subgraph S2[Сегмент 2]\n        H2((🔄 Hub)) --- C[💻 ПК C]\n        H2 --- D[💻 ПК D]\n    end\n    style BR fill:#fff3e0,stroke:#ef6c00\n    style H1 fill:#fce4ec,stroke:#c2185b\n    style H2 fill:#fce4ec,stroke:#c2185b\"><svg id=\"exp-1788586587 "150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"note\"><strong>📝 Прозорий міст</strong> <p>Міст працює так само, як комутатор: дивиться на адреси відправників, запам'ятовує, хто в якому сегменті, і за цим вирішує, чи передавати кадр. Комп'ютери про нього не знають і нічого спеціального не роблять, тому його називають <strong>прозорим</strong>. Комутатор фактично є мостом із багатьма портами, де в кожному \"сегменті\" один комп'ютер.</p>\n</div>\n\n","<h1>🚪 Шлюз (Gateway)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Шлюз</strong> (Gateway) - пристрій або програма, що з'єднує мережі, які \"розмовляють\" різними протоколами, і переписує дані з одного формату в інший.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> маршрутизатор передає дані між мережами, які використовують однакові правила передачі. Якщо ж правила різні, потрібен перекладач, і це шлюз. Наприклад, дзвінок із застосунку через Інтернет потрапляє на звичайний міський телефон саме через шлюз.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[📞 Інтернет-телефонія] --&gt;|Дані у форматі IP-мережі| G[🚪 Шлюз перетворює формат]\n    G --&gt;|Сигнал телефонної мережі| B[☎️ Міська телефонна лінія]\n    style G fill:#fce4ec,stroke:#c2185b\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1788586587608-13-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1178.3046875px;\" viewBox=\"0 0 1178.3046875 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586587608-13-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788586587608-13-0 .edge-animation-slow{stroke-da ;\"><span class=\"nodeLabel \"><p>🚪 Шлюз перетворює формат</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587608-13-0-flowchart-B-3\" data-look=\"classic\" transform=\"translate(1046.390625, 44)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-123.9140625\" y=\"-24\" width=\"247.828125\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-99.9140625, -12)\"><rect></rect><foreignObject width=\"199.828125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>☎️ Міська телефонна лінія</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788586587608-13-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586587608-13-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"warning\"><strong>⚠️ Швидкість</strong> <p>Шлюз має розібрати дані повністю, аж до змісту, і зібрати їх заново. Тому він працює повільніше за комутатор і маршрутизатор.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Те саме слово в іншому значенні</strong> <p>У налаштуваннях мережі на комп'ютері є поле \"основний шлюз\" (default gateway). Там вказують IP-адресу звичайного маршрутизатора, через який комп'ютер виходить з локальної мережі. Це просто усталена назва, а не перетворювач протоколів.</p>\n</div>\n\n","<h1>🏗️ Як пристрої ділять мережу на частини</h1>\n<p><strong>Головна ідея:</strong> мережу треба ділити на частини з двох причин. Перша - колізії: що менше комп'ютерів у спільному середовищі, то їх менше. Друга - кадри \"для всіх\": комп'ютери регулярно надсилають кадри, адресовані одразу всім у мережі, і у великій мережі вони заважають кожному.</p>\n<div class=\"info\"><strong>ℹ️ Два види \"частин\"</strong> <p><strong>Домен колізій</strong> - група пристроїв, між якими можливі колізії. <strong>Домен широкомовлення</strong> - група пристроїв, до яких доходить кадр, надісланий \"усім\".</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Пристрій</th>\n<th>Що читає</th>\n<th>Домени колізій</th>\n<th>Домени широкомовлення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔄 Концентратор</td>\n<td>Нічого</td>\n<td>Усі порти в одному</td>\n<td>Усі порти в одному</td>\n</tr>\n<tr>\n<td>🌉 Міст</td>\n<td>MAC-адреси</td>\n<td>Кожен сегмент окремо</td>\n<td>Усі сегменти в одному</td>\n</tr>\n<tr>\n<td>🔀 Комутатор</td>\n<td>MAC-адреси</td>\n<td>Кожен порт окремо</td>\n<td>Усі порти в одному</td>\n</tr>\n<tr>\n<td>🌐 Маршрутизатор</td>\n<td>IP-адреси</td>\n<td>Кожна мережа окремо</td>\n<td>Кожна мережа окремо</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph TB\n    subgraph B1[📢 Домен широкомовлення 1]\n        H1((🔄 Hub)) --- S1[🔀 Switch]\n        P1[💻] --- H1\n        P2[💻] --- H1\n        P3[💻] --- S1\n    end\n    R[🌐 Маршрутизатор]\n    subgraph B2[📢 Домен широкомовлення 2]\n        S2[🔀 Switch] --- P4[💻]\n        S2 --- P5[💻]\n    end\n    S1 --- R\n    R --- S2\n    style H1 fill:#fce4ec,stroke:#c2185b\n    style S1 fill:#e8f5e9,stroke:#388e3c\n    style S2 fill:#e8f5e9,stroke:#388e3c\n    style R fill:#f3e5f5,stroke:#7b1fa2\"><svg id=\"exp-1788586587616-14-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 357.03515625px;\" viewBox=\"0 -1 357.03515625 673.296875\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586587616-14-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke- ult  \" id=\"exp-1788586587616-14-0-flowchart-R-8\" data-look=\"classic\" transform=\"translate(207.8046875, 394.296875)\"><rect class=\"basic label-container\" style=\"fill:#f3e5f5 !important;stroke:#7b1fa2 !important\" x=\"-97.4140625\" y=\"-24\" width=\"194.828125\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-73.4140625, -12)\"><rect></rect><foreignObject width=\"146.828125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🌐 Маршрутизатор</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587616-14-0-flowchart-S2-9\" data-look=\"classic\" transform=\"translate(207.8046875, 517.296875)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-60.4609375\" y=\"-24\" width=\"120.921875\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-36.4609375, -12)\"><rect></rect><foreignObject width=\"72.921875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🔀 Switch</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587616-14-0-flowchart-P4-10\" data-look=\"classic\" transform=\"translate(148.8046875, 615.296875)\"><rect class=\"basic label-container\" style=\"\" x=\"-34\" y=\"-24\" width=\"68\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-10, -12)\"><rect></rect><foreignObject width=\"20\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586587616-14-0-flowchart-P5-12\" data-look=\"classic\" transform=\"translate(266.8046875, 615.296875)\"><rect class=\"basic label-container\" style=\"\" x=\"-34\" y=\"-24\" width=\"68\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-10, -12)\"><rect></rect><foreignObject width=\"20\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788586587616-14-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586587616-14-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"tip\"><strong>💡 Запам'ятати</strong> <p>Комутатор прибирає колізії, але кадри \"для всіх\" пропускає на всі порти. Зупиняє їх лише маршрутизатор. Тому велику мережу ділять на кілька менших саме маршрутизаторами.</p>\n</div>\n\n","<h1>📝 Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> <ol>\n<li><strong>Пристрої розрізняються тим, що вони \"читають\".</strong> Концентратор нічого, комутатор і міст MAC-адресу, маршрутизатор IP-адресу, шлюз сам зміст даних</li>\n<li><strong>Мережевий адаптер</strong> перетворює байти на сигнали і назад та пропускає в комп'ютер лише кадри, адресовані йому</li>\n<li><strong>Концентратор</strong> повторює все на всі порти, тому одночасно передавати може лише один пристрій, а решта чекає. Застарів</li>\n<li><strong>Комутатор</strong> сам вивчає, хто на якому порту, і передає кадр лише отримувачу. Колізій між комп'ютерами немає</li>\n<li><strong>Два способи комутації:</strong> \"на льоту\" швидше, з повним прийомом надійніше, бо пошкоджені кадри відкидаються</li>\n<li><strong>STP</strong> блокує запасні з'єднання, щоб у мережі не було петель, і вмикає їх при обриві основного</li>\n<li><strong>Маршрутизатор</strong> з'єднує різні мережі, а <strong>шлюз</strong> з'єднує мережі з різними протоколами</li>\n<li><strong>Маршрутизатор зупиняє кадри \"для всіх\",</strong> а комутатор ні, тому велику мережу ділять маршрутизаторами</li>\n</ol>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p><strong>Що таке мережеве обладнання?</strong> Перелічіть основні пристрої.</p>\n</li>\n<li><p><strong>Які функції виконує мережевий адаптер?</strong></p>\n</li>\n<li><p><strong>Що таке колізія?</strong> Чому в мережі на концентраторі вона виникає, а на комутаторі ні?</p>\n</li>\n<li><p><strong>Як комутатор дізнається, до якого порту підключений комп'ютер?</strong> Що він робить із кадром для невідомої адреси?</p>\n</li>\n<li><p><strong>Чим відрізняються комутація \"на льоту\" та з повним прийомом кадру?</strong></p>\n</li>\n<li><p><strong>Для чого потрібен маршрутизатор?</strong> Чим він відрізняється від комутатора?</p>\n</li>\n<li><p><strong>Для чого потрібен шлюз?</strong> Чому він повільніший за маршрутизатор?</p>\n</li>\n<li><p><strong>Який пристрій зупиняє кадри \"для всіх\", а який ні?</strong></p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Мережевий адаптер</td>\n<td>Network Adapter</td>\n<td>Пристрій, що з'єднує комп'ютер із кабелем або радіоканалом</td>\n</tr>\n<tr>\n<td>Концентратор</td>\n<td>Hub</td>\n<td>Пристрій, що повторює сигнал з одного порту на всі інші</td>\n</tr>\n<tr>\n<td>Комутатор</td>\n<td>Switch</td>\n<td>Пристрій, що передає кадр лише на порт отримувача за MAC-адресою</td>\n</tr>\n<tr>\n<td>Міст</td>\n<td>Bridge</td>\n<td>Пристрій, що з'єднує два сегменти та пропускає між ними лише потрібні кадри</td>\n</tr>\n<tr>\n<td>Маршрутизатор</td>\n<td>Router</td>\n<td>Пристрій, що передає дані між різними мережами за IP-адресою</td>\n</tr>\n<tr>\n<td>Шлюз</td>\n<td>Gateway</td>\n<td>Пристрій або програма, що з'єднує мережі з різними протоколами</td>\n</tr>\n<tr>\n<td>Кадр</td>\n<td>Frame</td>\n<td>Порція даних із MAC-адресами відправника та отримувача</td>\n</tr>\n<tr>\n<td>Колізія</td>\n<td>Collision</td>\n<td>Накладання сигналів при одночасній передачі двох пристроїв</td>\n</tr>\n<tr>\n<td>Домен колізій</td>\n<td>Collision Domain</td>\n<td>Група пристроїв, між якими можливі колізії</td>\n</tr>\n<tr>\n<td>Домен широкомовлення</td>\n<td>Broadcast Domain</td>\n<td>Група пристроїв, до яких доходить кадр, надісланий \"усім\"</td>\n</tr>\n<tr>\n<td>Таблиця комутації</td>\n<td>Switching Table</td>\n<td>Список \"яка MAC-адреса на якому порту\" всередині комутатора</td>\n</tr>\n<tr>\n<td>Таблиця маршрутизації</td>\n<td>Routing Table</td>\n<td>Список \"як дістатися до якої мережі\" всередині маршрутизатора</td>\n</tr>\n<tr>\n<td>Петля</td>\n<td>Loop</td>\n<td>Замкнений шлях між комутаторами, у якому кадр може кружляти нескінченно</td>\n</tr>\n<tr>\n<td>Контрольна сума</td>\n<td>Checksum</td>\n<td>Число в кінці кадру для перевірки, чи не спотворилися дані в дорозі</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>NIC</strong></td>\n<td>Network Interface Card / Мережева інтерфейсна карта</td>\n</tr>\n<tr>\n<td><strong>MAC</strong></td>\n<td>Media Access Control / Керування доступом до середовища</td>\n</tr>\n<tr>\n<td><strong>IP</strong></td>\n<td>Internet Protocol / Міжмережевий протокол</td>\n</tr>\n<tr>\n<td><strong>STP</strong></td>\n<td>Spanning Tree Protocol / Протокол кістякового дерева</td>\n</tr>\n<tr>\n<td><strong>DHCP</strong></td>\n<td>Dynamic Host Configuration Protocol / Протокол динамічної конфігурації хоста</td>\n</tr>\n<tr>\n<td><strong>NAT</strong></td>\n<td>Network Address Translation / Трансляція мережевих адрес</td>\n</tr>\n<tr>\n<td><strong>PoE</strong></td>\n<td>Power over Ethernet / Живлення через Ethernet</td>\n</tr>\n<tr>\n<td><strong>Wi-Fi</strong></td>\n<td>Wireless Fidelity / Бездротова локальна мережа за стандартом IEEE 802.11</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
