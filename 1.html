терфейси та протоколи</li>\n<li>🔷 Топології локальних мереж</li>\n<li>⚖️ Порівняння топологій та висновки</li>\n<li>📚 Глосарій</li>\n</ol>\n","<h1>🌐 Що таке комп'ютерна мережа?</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Комп'ютерна мережа</strong> (Computer Network) - сукупність вузлів (комп'ютерів, серверів та інших пристроїв), з'єднаних комунікаційними каналами, разом із обладнанням, яке забезпечує передачу інформації між ними.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Мережа перетворює набір ізольованих комп'ютерів на єдину систему, у якій ресурси одного вузла доступні іншим.</p>\n<table>\n<thead>\n<tr>\n<th>Призначення</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📤 <strong>Обмін даними</strong></td>\n<td>Електронна пошта, месенджери, Git</td>\n</tr>\n<tr>\n<td>🖥️ <strong>Віддалене керування</strong></td>\n<td>SSH до сервера, RDP</td>\n</tr>\n<tr>\n<td>🖨️ <strong>Спільний доступ</strong></td>\n<td>Мережевий принтер, файлове сховище</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Історичний факт</strong> <p>Перша великомасштабна мережа з комутацією пакетів <strong>ARPANET</strong> запрацювала у 1969 році та з'єднувала чотири університети США. Саме з неї виріс сучасний Інтернет.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Чому це важливо інженеру ПЗ</strong> <p>Майже кожен сучасний застосунок є мережевим: вебсайт, мобільний клієнт, база даних у хмарі. Розуміння мережі допомагає проєктувати швидкі та надійні системи.</p>\n</div>\n\n","<h1>🔀 Комутація: як дані знаходять шлях</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Комутація</strong> (Switching) - технологія вибору напрямку та організації передачі даних у мережах, що мають кілька альтернативних маршрутів. Інформаційні потоки, які передаються мережею, називають <strong>мережевим трафіком</strong>.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Тип комутації</th>\n<th>Принцип роботи</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📞 <strong>Комутація каналів</strong></td>\n<td>На час сеансу між вузлами створюється виділений канал</td>\n<td>Класична телефонна мережа</td>\n</tr>\n<tr>\n<td>✉️ <strong>Комутація повідомлень</strong></td>\n<td>Повідомлення передається цілком, від вузла до вузла, із зберіганням</td>\n<td>Телеграф</td>\n</tr>\n<tr>\n<td>📦 <strong>Комутація пакетів</strong></td>\n<td>Дані розбиваються на пакети, кожен з яких може йти власним маршрутом</td>\n<td>Інтернет</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[💻 Відправник] --&gt;|Пакет 1| R1[🔀 Вузол A]\n    A --&gt;|Пакет 2| R2[🔀 Вузол B]\n    R1 --&gt; R3[🔀 Вузол C]\n    R2 --&gt; R3\n    R3 --&gt;|Збирання пакетів| B[💻 Отримувач]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#e8f5e9,stroke:#388e3c\n    style R1 fill:#fff3e0,stroke:#ef6c00\n    style R2 fill:#fff3e0,stroke:#ef6c00\n    style R3 fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1788586561333-3-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 942.953125px;\" viewBox=\"0 0 942.953125 162\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586561333-3-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788586561333-3-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788586561333-3-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788586561333-3-0 .error-icon{fill:#552222;}#exp-1788586561333-3-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788586561333-3-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788586561333-3-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-17885  data-id=\"L_MAN_WAN_0\" transform=\"translate(0, 0)\"><text y=\"-10.1\" text-anchor=\"middle\"><tspan class=\"text-outer-tspan row\" x=\"0\" y=\"-0.1em\" dy=\"1.1em\" text-anchor=\"middle\"></tspan></text></g></g><g><rect class=\"background\" style=\"stroke: none\"></rect></g></g><g class=\"nodes\"><g class=\"node default  \" id=\"exp-1788586561352-4-0-flowchart-PAN-0\" data-look=\"classic\" transform=\"translate(81.890625, 44)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-73.890625\" y=\"-36\" width=\"147.78125\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-49.890625, -24)\"><rect></rect><foreignObject width=\"99.78125\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🧑 PAN<br>кілька метрів</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586561352-4-0-flowchart-LAN-1\" data-look=\"classic\" transform=\"translate(303.046875, 44)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-97.265625\" y=\"-36\" width=\"194.53125\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-73.265625, -24)\"><rect></rect><foreignObject width=\"146.53125\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🏢 LAN<br>будівля або кампус</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586561352-4-0-flowchart-MAN-3\" data-look=\"classic\" transform=\"translate(536.53125, 44)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-86.21875\" y=\"-36\" width=\"172.4375\" height=\"72\"></rect><g class=\"label\" style=\"\" transform= Area Network</td>\n<td>Інтернет, мережа міжнародної корпорації</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Чому масштаб змінює правила</strong> <p>Чим довша лінія зв'язку, тим гірше співвідношення сигнал/шум і тим більша затримка. Тому зі збільшенням масштабу змінюється не лише відстань, а й спосіб організації мережі.</p>\n</div>\n\n","<h1>🗂️ Класифікація за іншими ознаками</h1>\n<h2>📡 За технологією передачі</h2>\n<table>\n<thead>\n<tr>\n<th>Технологія</th>\n<th>Принцип</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📢 <strong>Віщання</strong> (Broadcast)</td>\n<td>Спільний канал: сигнал одного вузла фізично отримують усі</td>\n<td>Wi-Fi, Ethernet на концентраторі</td>\n</tr>\n<tr>\n<td>🔗 <strong>Точка-точка</strong> (Point-to-Point)</td>\n<td>Індивідуальний канал між двома вузлами</td>\n<td>З'єднання ПК з комутатором, виділені лінії</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ Про що йдеться</strong> <p>Ознака стосується <strong>середовища передачі</strong>, а не того, кому адресоване повідомлення. У мережі з віщанням кожен вузол отримує всі повідомлення, порівнює адресу призначення зі своєю і чужі відкидає.</p>\n<p><strong>Приклад:</strong> у кав'ярні ваш ноутбук надсилає запит через Wi-Fi. Кадр адресований лише точці доступу, але радіосигнал чують усі пристрої у зоні покриття. Вони приймають кадр, бачать чужу адресу і відкидають його. Саме тому Wi-Fi потребує шифрування. Далі по кабелю до провайдера той самий запит іде лінією точка-точка: його отримує лише інший кінець кабелю.</p>\n</div>\n\n\n\n<h2>🔌 За середовищем передачі даних</h2>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🧵 <strong>Провідні</strong></td>\n<td>Коаксіальний кабель, кручена пара (UTP/STP), оптоволокно</td>\n</tr>\n<tr>\n<td>📶 <strong>Бездротові</strong></td>\n<td>Wi-Fi, Bluetooth, мобільні мережі 4G/5G, супутниковий зв'язок</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 За швидкістю передачі</strong> <p>Історично мережі поділяли на низькошвидкісні (до 10 Мбіт/с), середньошвидкісні (до 100 Мбіт/с) та високошвидкісні (понад 100 Мбіт/с). Сьогодні 1 Гбіт/с є базовим рівнем для локальних мереж.</p>\n</div>\n\n","<h1>🏗️ Однорангові та ієрархічні мережі</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Сервер</strong> (Server) - комп'ютер або програма, що надає іншим вузлам мережі доступ до своїх служб і ресурсів.<br><strong>Клієнт</strong> (Client) - комп'ютер або програма, що використовує служби та ресурси сервера.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph P2P[🤝 Однорангова мережа]\n        A1[💻] &lt;--&gt; A2[💻]\n        A2 &lt;--&gt; A3[💻]\n        A3 &lt;--&gt; A1\n    end\n    subgraph CS[🏢 Ієрархічна мережа]\n        S[🗄️ Сервер]\n        C1[💻] --&gt; S\n        C2[💻] --&gt; S\n        C3[💻] --&gt; S\n    end\n    style P2P fill:#e8f5e9,stroke:#388e3c\n    style CS fill:#e3f2fd,stroke:#1565c0\n    style S fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1788586561364-6-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 390px;\" viewBox=\"0 -1 390 683\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586561364-6-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788586561364-6-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788586561364-6-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788586561364-6-0 .error-icon{fill:#552222;}#exp-1788586561364-6-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788586561364-6-0 .edge-thickness-normal{stroke-width:1px;}#exp-17885 8\"></rect><g class=\"label\" style=\"\" transform=\"translate(-10, -12)\"><rect></rect><foreignObject width=\"20\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586561364-6-0-flowchart-A3-3\" data-look=\"classic\" transform=\"translate(111.5, 315.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-34\" y=\"-24\" width=\"68\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-10, -12)\"><rect></rect><foreignObject width=\"20\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id=\"exp-1788586561364-6-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586561364-6-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Критерій</th>\n<th>🤝 Однорангова (Peer-to-Peer)</th>\n<th>🏢 Ієрархічна (з виділеним сервером)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Права вузлів</strong></td>\n<td>Усі рівні, кожен і клієнт, і сервер</td>\n<td>Сервер обслуговує, клієнти користуються</td>\n</tr>\n<tr>\n<td><strong>Адміністрування</strong></td>\n<td>Кожен власник керує своїм ПК</td>\n<td>Централізоване</td>\n</tr>\n<tr>\n<td><strong>Масштаб</strong></td>\n<td>Домашні мережі, малі групи</td>\n<td>Мережа коледжу, підприємства</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Дві архітектури використання сервера</strong> <p><strong>Файл-сервер:</strong> дані та програми пересилаються на клієнт і обробляються там. Просто, але велике навантаження на мережу.<br><strong>Клієнт-сервер:</strong> обробка відбувається на сервері, клієнт отримує лише результат. Так працює будь-який вебзастосунок: браузер надсилає запит, сервер повертає готову відповідь.</p>\n</div>\n\n","<h1>🔌 Інтерфейси та протоколи</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Інтерфейс</strong> (Interface) - фізична або логічна межа взаємодії кількох незалежних об'єктів.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Рівень</th>\n<th>Що це</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔧 <strong>Фізичний інтерфейс</strong></td>\n<td>Порт підключення: роз'єм з групою контактів</td>\n<td>Роз'єм RJ-45, USB</td>\n</tr>\n<tr>\n<td>📜 <strong>Логічний інтерфейс</strong></td>\n<td>Набір правил (протокол), що визначає логіку обміну даними</td>\n<td>Ethernet, IP, HTTP</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ Ключові терміни</strong> <p><strong>Канал (лінія) передачі даних</strong> - пара портів, з'єднаних кабелем або бездротовим зв'язком.<br><strong>Протокол передачі даних</strong> (Protocol) - набір правил, згідно з якими кодують, передають та обробляють повідомлення у мережі, включно з обробкою помилок.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Аналогія</strong> <p>Фізичний інтерфейс подібний до телефонної слухавки та лінії: він дає можливість говорити. Протокол подібний до мови та етикету розмови: обидві сторони мають розуміти, хто говорить першим, як привітатися і що робити, якщо щось не розчули.</p>\n</div>\n\n","<h1>🔷 Топологія мережі</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Топологія комп'ютерної мережі</strong> (Network Topology) - конфігурація фізичних зв'язків між комп'ютерами та іншими мережевими пристроями.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Погляд</th>\n<th>Що описує</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📐 <strong>Фізична топологія</strong></td>\n<td>Геометричне розташування вузлів і кабелів</td>\n<td>Усі кабелі сходяться до комутатора в серверній</td>\n</tr>\n<tr>\n<td>🔄 <strong>Логічна топологія</strong></td>\n<td>Як саме дані переміщуються між вузлами</td>\n<td>Дані передаються по черзі, ніби по спільній шині</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph TB\n    T[🔷 Топології локальних мереж] --&gt; B[📏 Шина]\n    T --&gt; R[⭕ Кільце]\n    T --&gt; S[⭐ Зірка]\n    T --&gt; D[🌳 Дерево]\n    T --&gt; M[🕸️ Повнозв'язна]\n    T --&gt; C[🔲 Комірчаста]\n    style T fill:#e3f2fd,stroke:#1565c0\n    style B fill:#fff3e0,stroke:#ef6c00\n    style R fill:#fff3e0,stroke:#ef6c00\n    style S fill:#e8f5e9,stroke:#388e3c\n    style D fill:#e8f5e9,stroke:#388e3c\n    style M fill:#f3e5f5,stroke:#7b1fa2\n    style C fill:#f3e5f5,stroke:#7b1fa2\"><svg id=\"exp-1788586561383-8-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1076.5625px;\" viewBox=\"0 0 1076.5625 186\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586561383-8-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788586561383-8-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788586561383-8-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788586561383-8-0 .error-icon{fill:#552222;}#exp-1788586561383-8-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788586561383-8-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788586561383-8-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788586561383-8-0 .edge-patter ркулював маркер (token), і передавати міг лише вузол, що його захопив. Сьогодні кільцеві технології витіснені Ethernet.</p>\n</div>\n\n","<h1>⭐ Топологія \"Зірка\" (Star)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Зірка</strong> - топологія з виділеним центром (комутатором), до якого окремим кабелем підключений кожен вузол. Увесь обмін даними проходить через центральний пристрій.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph TB\n    SW[🔀 Комутатор]\n    PC1[💻 ПК 1] &lt;--&gt; SW\n    PC2[💻 ПК 2] &lt;--&gt; SW\n    PC3[💻 ПК 3] &lt;--&gt; SW\n    PR[🖨️ Принтер] &lt;--&gt; SW\n    style SW fill:#e8f5e9,stroke:#388e3c,stroke-width:3px\n    style PC1 fill:#e3f2fd,stroke:#1565c0\n    style PC2 fill:#e3f2fd,stroke:#1565c0\n    style PC3 fill:#e3f2fd,stroke:#1565c0\n    style PR fill:#f3e5f5,stroke:#7b1fa2\"><svg id=\"exp-1788586561425-11-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 625.171875px;\" viewBox=\"0 0 625.171875 162\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788586561425-11-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788586561425-11-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788586561425-11-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788586561425-11-0 .error-icon{fill:#552222;}#exp-1788586561425-11-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788586561425-11-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788586561425-11-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788586561425-11-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1788586561425-11-0 .edge -C-3\" data-look=\"classic\" transform=\"translate(218.7890625, 315.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-41.6640625\" y=\"-24\" width=\"83.328125\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-17.6640625, -12)\"><rect></rect><foreignObject width=\"35.328125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻 C</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788586561447-13-0-flowchart-D-5\" data-look=\"classic\" transform=\"translate(132.359375, 438.5)\"><rect class=\"basic label-container\" style=\"\" x=\"-41.75\" y=\"-24\" width=\"83.5\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-17.75, -12)\"><rect></rect><foreignObject width=\"35.5\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>💻 D</p></span></div></foreignObject></g></g></g></g></g></g></g><defs><filter id=\"exp-1788586561447-13-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788586561447-13-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<p><strong>Кількість ліній у повнозв'язній мережі:</strong> n(n-1)/2, де n - кількість вузлів. Для 4 вузлів це 6 ліній, для 10 вузлів уже 45.</p>\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Найвища надійність: є обхідний шлях при будь-якій відмові</td>\n<td>Вартість зростає квадратично з кількістю вузлів</td>\n</tr>\n<tr>\n<td>Мінімальна затримка: дані йдуть напряму</td>\n<td>Кожен вузол потребує окремого порту для кожного сусіда</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Де застосовується</strong> <p>Повнозв'язна топологія трапляється рідко, між невеликою кількістю вузлів: з'єднання кількох дата-центрів. Комірчаста топологія лежить в основі Інтернету та магістралей провайдерів.</p>\n</div>\n\n","<h1>⚖️ Порівняння топологій та висновки</h1>\n<table>\n<thead>\n<tr>\n<th>Топологія</th>\n<th>Надійність</th>\n<th>Вартість</th>\n<th>Де застосовується сьогодні</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📏 <strong>Шина</strong></td>\n<td>Низька, кабель є точкою відмови</td>\n<td>Найнижча</td>\n<td>Історична, логіка збереглася у Wi-Fi</td>\n</tr>\n<tr>\n<td>⭕ <strong>Кільце</strong></td>\n<td>Низька, обрив зупиняє кільце</td>\n<td>Висока</td>\n<td>Історична (Token Ring)</td>\n</tr>\n<tr>\n<td>⭐ <strong>Зірка</strong></td>\n<td>Висока, крім центрального вузла</td>\n<td>Середня</td>\n<td>Основа всіх сучасних LAN</td>\n</tr>\n<tr>\n<td>🌳 <strong>Дерево</strong></td>\n<td>Висока, критичний корінь</td>\n<td>Середня</td>\n<td>Мережі будівель і підприємств</td>\n</tr>\n<tr>\n<td>🕸️ <strong>Повнозв'язна</strong></td>\n<td>Найвища</td>\n<td>Найвища</td>\n<td>З'єднання кількох ЦОД</td>\n</tr>\n<tr>\n<td>🔲 <strong>Комірчаста</strong></td>\n<td>Дуже висока</td>\n<td>Висока</td>\n<td>Інтернет, мережі провайдерів</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> <ol>\n<li><strong>Комп'ютерна мережа</strong> - сукупність вузлів, з'єднаних каналами зв'язку, для обміну даними та спільного використання ресурсів</li>\n<li><strong>Комутація пакетів</strong> є основою сучасних мереж: дані розбиваються на пакети, які можуть йти різними маршрутами</li>\n<li><strong>За масштабом</strong> мережі поділяють на PAN, LAN, MAN та WAN</li>\n<li><strong>Однорангові мережі</strong> мають рівноправні вузли, <strong>ієрархічні</strong> використовують виділені сервери</li>\n<li><strong>Фізичний інтерфейс</strong> дає можливість з'єднання, <strong>протокол</strong> визначає правила обміну</li>\n<li><strong>Зірка та дерево</strong> є основою сучасних локальних мереж, <strong>комірчаста топологія</strong> - основою глобальних</li>\n</ol>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li>Що таке комп'ютерна мережа та яке її призначення?</li>\n<li>Назвіть три типи комутації. Який із них використовується в Інтернеті?</li>\n<li>Чим відрізняються мережі PAN, LAN, MAN та WAN?</li>\n<li>Які мережі називають одноранговими, а які ієрархічними?</li>\n<li>Чим фізичний інтерфейс відрізняється від логічного?</li>\n<li>Назвіть переваги та недоліки топологій шина, кільце та зірка.</li>\n<li>Яка топологія є найпоширенішою в сучасних локальних мережах?</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Комп'ютерна мережа</strong></td>\n<td>Computer Network</td>\n<td>Сукупність вузлів, з'єднаних каналами зв'язку, та обладнання для передачі даних</td>\n</tr>\n<tr>\n<td><strong>Вузол</strong></td>\n<td>Node</td>\n<td>Будь-який пристрій, підключений до мережі</td>\n</tr>\n<tr>\n<td><strong>Комутація</strong></td>\n<td>Switching</td>\n<td>Технологія вибору напрямку та організації передачі даних у мережі</td>\n</tr>\n<tr>\n<td><strong>Мережевий трафік</strong></td>\n<td>Network Traffic</td>\n<td>Інформаційні потоки, що передаються мережею</td>\n</tr>\n<tr>\n<td><strong>Пакет</strong></td>\n<td>Packet</td>\n<td>Блок даних невеликого розміру, що передається мережею як єдине ціле</td>\n</tr>\n<tr>\n<td><strong>Колізія</strong></td>\n<td>Collision</td>\n<td>Спотворення даних через одночасну передачу кількох вузлів у спільному середовищі</td>\n</tr>\n<tr>\n<td><strong>Сервер</strong></td>\n<td>Server</td>\n<td>Комп'ютер або програма, що надає служби та ресурси іншим вузлам</td>\n</tr>\n<tr>\n<td><strong>Клієнт</strong></td>\n<td>Client</td>\n<td>Комп'ютер або програма, що використовує служби та ресурси сервера</td>\n</tr>\n<tr>\n<td><strong>Однорангова мережа</strong></td>\n<td>Peer-to-Peer Network</td>\n<td>Мережа рівноправних вузлів без виділеного сервера</td>\n</tr>\n<tr>\n<td><strong>Інтерфейс</strong></td>\n<td>Interface</td>\n<td>Фізична або логічна межа взаємодії незалежних об'єктів</td>\n</tr>\n<tr>\n<td><strong>Протокол</strong></td>\n<td>Protocol</td>\n<td>Набір правил кодування, передачі та обробки повідомлень у мережі</td>\n</tr>\n<tr>\n<td><strong>Топологія</strong></td>\n<td>Topology</td>\n<td>Конфігурація фізичних зв'язків між вузлами мережі</td>\n</tr>\n<tr>\n<td><strong>Репітер</strong></td>\n<td>Repeater</td>\n<td>Пристрій, що відновлює сигнал для збільшення довжини мережі</td>\n</tr>\n<tr>\n<td><strong>Комутатор</strong></td>\n<td>Switch</td>\n<td>Центральний пристрій зірки, що передає дані лише адресату</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>PAN</strong></td>\n<td>Personal Area Network</td>\n<td>Персональна мережа</td>\n</tr>\n<tr>\n<td><strong>LAN</strong></td>\n<td>Local Area Network</td>\n<td>Локальна мережа</td>\n</tr>\n<tr>\n<td><strong>MAN</strong></td>\n<td>Metropolitan Area Network</td>\n<td>Міська (регіональна) мережа</td>\n</tr>\n<tr>\n<td><strong>WAN</strong></td>\n<td>Wide Area Network</td>\n<td>Глобальна мережа</td>\n</tr>\n<tr>\n<td><strong>P2P</strong></td>\n<td>Peer-to-Peer</td>\n<td>Однорангова мережа</td>\n</tr>\n<tr>\n<td><strong>UTP</strong></td>\n<td>Unshielded Twisted Pair</td>\n<td>Неекранована кручена пара</td>\n</tr>\n<tr>\n<td><strong>STP</strong></td>\n<td>Shielded Twisted Pair</td>\n<td>Екранована кручена пара</td>\n</tr>\n<tr>\n<td><strong>EIA/TIA</strong></td>\n<td>Electronic Industries Alliance / Telecommunications Industry Association</td>\n<td>Альянс електронної промисловості / Асоціація телекомунікаційної промисловості</td>\n</tr>\n<tr>\n<td><strong>ЦОД</strong></td>\n<td>Data Center</td>\n<td>Центр обробки даних</td>\n</tr>\n<tr>\n<td><strong>ARPANET</strong></td>\n<td>Advanced Research Projects Agency Network</td>\n<td>Перша великомасштабна мережа з комутацією пакетів, попередник Інтернету</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
