width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🖥️ ПК по кабелю</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190214636-3-0-flowchart-W-10\" data-look=\"neo\" transform=\"translate(856, 252)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🌐 До провайдера</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190214636-3-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190214636-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Складова роутера</th>\n<th>Що робить</th>\n<th>Рівень OSI</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📡 Точка доступу</td>\n<td>Передає кадри через радіоефір (Wi-Fi, IEEE 802.11)</td>\n<td>Фізичний + канальний</td>\n</tr>\n<tr>\n<td>🔀 Комутатор</td>\n<td>Пересилає кадри між домашніми пристроями за MAC-адресами</td>\n<td>Канальний</td>\n</tr>\n<tr>\n<td>🧭 Маршрутизатор</td>\n<td>Вирішує, які пакети йдуть назовні, і передає їх провайдеру</td>\n<td>Мережевий</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Чому топологія \"зірка\"</strong> <p>Усі пристрої підключені до одного центрального вузла. Вихід з ладу телевізора не зачепить ноутбук, а новий пристрій додається без перебудови мережі. Ціна цього рішення: роутер є єдиною точкою відмови, і поки він вимкнений, Інтернету немає ні в кого. Для дому це прийнятний компроміс.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Чому Wi-Fi, а не кабель</strong> <p>Радіоефір є спільним середовищем: усі пристрої ділять один канал, тому швидкість падає зі зростанням їх кількості, а стіни та сусідні мережі створюють завади. Кабель дає стабільність, Wi-Fi дає мобільність. Для смартфона вибір очевидний, для стаціонарного ПК або консолі кабель зазвичай кращий.</p>\n</div>\n\n","<h1>🔌 Крок 2. Мережа доступу: якими кабелями дані виходять з дому</h1>\n<p><strong>Головна ідея:</strong> Від роутера до вузла провайдера дані проходять \"останню милю\". Саме тут видно, як властивості середовища передачі визначають інженерні рішення.</p>\n<table>\n<thead>\n<tr>\n<th>Технологія доступу</th>\n<th>Середовище</th>\n<th>Відстань без підсилення</th>\n<th>Чому обирають</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔆 Оптика в квартиру (FTTH)</td>\n<td>Одномодове волокно</td>\n<td>Десятки км</td>\n<td>Нечутлива до електромагнітних завад, запас пропускної здатності на роки</td>\n</tr>\n<tr>\n<td>🔌 Оптика в будинок (FTTB)</td>\n<td>Оптика + вита пара</td>\n<td>Оптика: до 20 км, вита пара: до 100 м</td>\n<td>Дешевше за FTTH: одне волокно на будинок, далі вита пара по поверхах</td>\n</tr>\n<tr>\n<td>📶 Мобільний (4G/5G)</td>\n<td>Радіоефір + оптика</td>\n<td>Кілометри від вежі</td>\n<td>Не потребує кабелю до абонента, а базова станція підключена оптикою</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🏠 Роутер] --&gt;|Вита пара Cat5e/Cat6&lt;br/&gt;до 100 м| B[🔀 Комутатор у підʼїзді]\n    B --&gt;|Оптика| C[🏢 Вузол провайдера]\n    D[📱 Смартфон на вулиці] --&gt;|Радіо 4G/5G| E[📡 Базова станція]\n    E --&gt;|Оптика| C\n    style A fill:#e8f5e9,stroke:#388e3c\n    style B fill:#e3f2fd,stroke:#1565c0\n    style C fill:#fff3e0,stroke:#ef6c00\n    style D fill:#e8f5e9,stroke:#388e3c\n    style E fill:#e3f2fd,stroke:#1565c0\"><svg  transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>📱 Смартфон на вулиці</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190214654-4-0-flowchart-E-5\" data-look=\"neo\" transform=\"translate(487.6875, 160)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>📡 Базова станція</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190214654-4-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190214654-4-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"info\"><strong>ℹ️ Чому мідь обмежена 100 метрами</strong> <p>Електричний сигнал у витій парі затухає і накопичує завади з відстанню, тому стандарт Ethernet обмежує сегмент 100 метрами. Це не недолік технології, а свідомий компроміс між дешевизною міді та надійністю. Усе, що довше, будують на оптиці.</p>\n<p>Звідки 20 км для оптики доступу: провайдери зазвичай використовують пасивну оптичну мережу <strong>GPON</strong> (Gigabit Passive Optical Network), де одне волокно від вузла розгалужується на десятки абонентів через пасивні сплітери без живлення. Кожен сплітер поглинає частину сигналу, тому стандарт обмежує дальність 20 км. Пряме волокно без розгалужень працює на значно більші відстані.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Типове непорозуміння</strong> <p>\"Мобільний Інтернет бездротовий\". Бездротовою є лише ділянка від смартфона до найближчої базової станції. Далі трафік іде тими самими оптичними кабелями, що й домашній Інтернет.</p>\n</div>\n\n","<h1>🌐 Крок 3. Провайдер і магістралі: мережа мереж</h1>\n<p><strong>Головна ідея:</strong> Провайдер не знає, де фізично розташований потрібний сервер. Маршрутизатори на кожному кроці лише передають пакет \"у правильному напрямку\" до сусідньої мережі.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🏢 Провайдер A] --- IX[🔁 IXP&lt;br/&gt;точка обміну трафіком]\n    B[🏢 Провайдер B] --- IX\n    C[🏢 Провайдер C] --- IX\n    IX --- T1[🌍 Магістральний оператор]\n    A --- T1\n    T1 --&gt;|Підводний кабель| T2[🌍 Оператор на іншому континенті]\n    T1 --- T3[🌍 Інший магістральний оператор]\n    T3 --- T2\n    style A fill:#fff3e0,stroke:#ef6c00\n    style B fill:#fff3e0,stroke:#ef6c00\n    style C fill:#fff3e0,stroke:#ef6c00\n    style IX fill:#f3e5f5,stroke:#7b1fa2\n    style T1 fill:#e3f2fd,stroke:#1565c0\n    style T2 fill:#e3f2fd,stroke:#1565c0\n    style T3 fill:#e3f2fd,stroke:#1565c0\"><svg id=\"exp-1789190214671-5-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 936px;\" viewBox=\"4 4 936 312\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190214671-5-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789190214671-5-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-line ant;stroke:#1565c0 !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🌍 Інший магістральний оператор</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190214671-5-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190214671-5-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Елемент</th>\n<th>Роль</th>\n<th>Чому саме так</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🧭 Маршрутизатор провайдера</td>\n<td>Обирає наступний вузол за IP-адресою призначення</td>\n<td>Кожен вузол знає лише напрямок, а не весь шлях: це масштабується на мільйони мереж</td>\n</tr>\n<tr>\n<td>🔁 IXP (напр. UA-IX)</td>\n<td>Місце, де провайдери обмінюються трафіком напряму</td>\n<td>Трафік між двома українськими провайдерами не має їхати через Європу</td>\n</tr>\n<tr>\n<td>🌍 Магістраль</td>\n<td>Оптичні лінії між містами та країнами, зі спектральним ущільненням DWDM</td>\n<td>Одне волокно переносить десятки каналів на різних довжинах хвиль</td>\n</tr>\n<tr>\n<td>🌊 Підводні кабелі</td>\n<td>Оптика по дну океанів між континентами</td>\n<td>Переважна частина міжконтинентального трафіку йде кабелями, а не супутниками</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Чому топологія \"частково звʼязана\" (mesh)</strong> <p>На рівні магістралей Інтернет побудований так, щоб між будь-якими двома точками існувало кілька незалежних шляхів. Пошкодження одного кабелю, наприклад якорем судна, не зупиняє звʼязок: маршрутизатори автоматично перенаправляють трафік іншим шляхом. Це дорожче, ніж \"зірка\", але саме така надлишковість робить Інтернет стійким.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Чому не супутники</strong> <p>Затримка сигналу до геостаціонарного супутника і назад перевищує 500 мс, а оптикою через Атлантику пакет проходить приблизно за 60-70 мс. Тому супутник є резервом і засобом для віддалених регіонів, а не основою магістралей.</p>\n</div>\n\n","<h1>🏢 Крок 4. Дата-центр: остання ділянка шляху</h1>\n<p><strong>Головна ідея:</strong> Сервер, який відповідає на запит, стоїть у дата-центрі, де ті самі пристрої та середовища застосовані у максимально щільній конфігурації.</p>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    E[🌐 Прикордонні маршрутизатори] --&gt; S1[🔀 Комутатори ядра]\n    E --&gt; S2[🔀 Комутатори ядра]\n    S1 --&gt; T1[🔀 Комутатор стійки 1]\n    S1 --&gt; T2[🔀 Комутатор стійки 2]\n    S2 --&gt; T1\n    S2 --&gt; T2\n    T1 --&gt; V1[🖥️ Сервери стійки 1]\n    T2 --&gt; V2[🖥️ Сервери стійки 2]\n    style E fill:#fff3e0,stroke:#ef6c00\n    style S1 fill:#f3e5f5,stroke:#7b1fa2\n    style S2 fill:#f3e5f5,stroke:#7b1fa2\n    style T1 fill:#e3f2fd,stroke:#1565c0\n    style T2 fill:#e3f2fd,stroke:#1565c0\n    style V1 fill:#e8f5e9,stroke:#388e3c\n    style V2 fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1789190214699-6-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 360px;\" viewBox=\"4 4 360 464\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190214699-6-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789190214699-6-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset є роботу: та сама ідея надлишковості, що й на магістралях</td>\n</tr>\n<tr>\n<td>🔆 Оптика між рівнями, мідь усередині стійки</td>\n<td>Між комутаторами потрібні швидкості 40-100 Гбіт/с на десятки метрів, усередині стійки досить міді</td>\n</tr>\n<tr>\n<td>🌐 Кілька дата-центрів у різних регіонах</td>\n<td>Сервер ближче до користувача означає меншу затримку, тому великі сервіси дублюють дані географічно</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ Повний шлях і назад</strong> <p>Відповідь сервера повторює той самий шлях у зворотному напрямку, але не обовʼязково тими самими вузлами: маршрутизатори обирають шлях для кожного пакета незалежно. Уся подорож туди й назад займає десятки мілісекунд, і саме тому сторінка відкривається \"миттєво\".</p>\n</div>\n\n","<h1>📚 Що з вивченого спрацювало на кожному кроці</h1>\n<p><strong>Головна ідея:</strong> Один запит зі смартфона задіює всі розглянуті теми одночасно: топології, пристрої, середовища та рівні моделі OSI.</p>\n<table>\n<thead>\n<tr>\n<th>Ділянка шляху</th>\n<th>🕸️ Топологія</th>\n<th>🖧 Пристрої</th>\n<th>🔌 Середовище</th>\n<th>📶 Рівні OSI</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏠 Дім</td>\n<td>Зірка</td>\n<td>Точка доступу, комутатор, роутер</td>\n<td>Wi-Fi, вита пара</td>\n<td>Фізичний, канальний, мережевий</td>\n</tr>\n<tr>\n<td>🔌 Мережа доступу</td>\n<td>Зірка або дерево</td>\n<td>Комутатори, базові станції</td>\n<td>Вита пара, оптика, радіо</td>\n<td>Фізичний, канальний</td>\n</tr>\n<tr>\n<td>🌐 Магістраль</td>\n<td>Частково звʼязана (mesh)</td>\n<td>Маршрутизатори</td>\n<td>Одномодова оптика, DWDM</td>\n<td>Фізичний, мережевий</td>\n</tr>\n<tr>\n<td>🏢 Дата-центр</td>\n<td>Дерево з надлишковістю</td>\n<td>Маршрутизатори, комутатори</td>\n<td>Оптика, вита пара</td>\n<td>Фізичний, канальний, мережевий</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Три принципи, що повторюються на кожному рівні</strong> <ol>\n<li><strong>Середовище обирають за відстанню і завадами.</strong> Мідь там, де дешево і коротко, оптика там, де далеко і швидко, радіо там, де потрібна мобільність</li>\n<li><strong>Пристрій відповідає рівню OSI.</strong> Комутатор працює з кадрами і MAC-адресами всередині мережі, маршрутизатор із пакетами та IP-адресами між мережами</li>\n<li><strong>Надлишковість замість надійності однієї ланки.</strong> Там, де відмова критична (магістралі, дата-центри), будують кілька шляхів. Там, де ні (дім), обходяться простою зіркою</li>\n</ol>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Питання для обговорення</strong> <ol>\n<li>Чому домашній роутер обʼєднує три пристрої в одному корпусі, а в дата-центрі ці функції рознесені по окремому обладнанню?</li>\n<li>Що зміниться на кожній ділянці шляху, якщо замість смартфона запит робить стаціонарний ПК, підключений кабелем?</li>\n<li>Чому обрив одного підводного кабелю не вимикає Інтернет у країні, а поломка домашнього роутера вимикає його в квартирі?</li>\n</ol>\n</div>\n\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
