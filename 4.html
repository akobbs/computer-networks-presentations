<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Еталонна модель взаємодії відкритих систем OSI</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><style>* {

#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 20</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>Еталонна модель взаємодії відкритих систем OSI</h1>\n<p><strong>Курс:</strong> Організація компʼютерних мереж / Компʼютерні мережі</p>\n<p><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h1>📋 План лекції</h1>\n<ol>\n<li>🧩 Призначення еталонної моделі</li>\n<li>🏛️ Сім рівнів моделі OSI</li>\n<li>🔗 Взаємодія рівнів: інтерфейси та протоколи</li>\n<li>📦 Інкапсуляція та одиниці даних</li>\n<li>🔍 Функції рівнів: від фізичного до прикладного</li>\n<li>📚 Протоколи та стеки протоколів</li>\n<li>⚖️ Модель OSI та стек TCP/IP</li>\n<li>📝 Висновки, контрольні питання, глосарій</li>\n</ol>\n","<h1>🧩 Призначення еталонної моделі</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Модель OSI</strong> (Open Systems Interconnection / Взаємодія відкритих систем) - еталонна модель, що описує розподіл функцій мережевої взаємодії між сімома рівнями та правила взаємодії цих рівнів. Розроблена Міжнародною організацією зі стандартизації (<strong>ISO</strong>), стандарт ISO 7498 опубліковано у 1984 році.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> До появи моделі кожен виробник будував мережі за власними закритими правилами, і обладнання різних компаній не могло взаємодіяти. Модель OSI стала спільним каркасом, за яким описують і проєктують мережі.</p>\n<h2>🎯 Що дає модель</h2>\n<table>\n<thead>\n<tr>\n<th>Перевага</th>\n<th>Пояснення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🧱 <strong>Модульність</strong></td>\n<td>Складна задача поділена на сім рівнів із чітко визначеними функціями</td>\n</tr>\n<tr>\n<td>🔄 <strong>Незалежність рівнів</strong></td>\n<td>Реалізацію одного рівня можна змінити, не змінюючи інші</td>\n</tr>\n<tr>\n<td>🏭 <strong>Сумісність</strong></td>\n<td>Обладнання і програмне забезпечення різних виробників працюють разом</td>\n</tr>\n<tr>\n<td>🗣️ <strong>Спільна термінологія</strong></td>\n<td>Інженери описують мережу та її проблеми в термінах рівнів</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Відкрита система</strong> <p><strong>Відкритою</strong> називають систему, побудовану за загальнодоступними стандартами, а не за закритими специфікаціями одного виробника.</p>\n</div>\n\n","<h1>🏛️ Сім рівнів моделі OSI</h1>\n<p><strong>Головна ідея:</strong> Кожен рівень виконує лише власні функції, надає сервіси рівню вище і користується сервісами рівня нижче.</p>\n<table>\n<thead>\n<tr>\n<th>№</th>\n<th>Рівень</th>\n<th>English</th>\n<th>Одиниця даних</th>\n<th>За що відповідає</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>7</td>\n<td>🖥️ <strong>Прикладний</strong></td>\n<td>Application layer</td>\n<td>Дані</td>\n<td>Доступ застосунків до мережевих служб: веб, пошта, файли</td>\n</tr>\n<tr>\n<td>6</td>\n<td>🎨 <strong>Представлення</strong></td>\n<td>Presentation layer</td>\n<td>Дані</td>\n<td>Формат і кодування даних, стиснення, шифрування</td>\n</tr>\n<tr>\n<td>5</td>\n<td>🤝 <strong>Сеансовий</strong></td>\n<td>Session layer</td>\n<td>Дані</td>\n<td>Встановлення, підтримка та завершення діалогу між застосунками</td>\n</tr>\n<tr>\n<td>4</td>\n<td>🚚 <strong>Транспортний</strong></td>\n<td>Transport layer</td>\n<td>Сегмент</td>\n<td>Доставка від програми до програми, порти, надійність</td>\n</tr>\n<tr>\n<td>3</td>\n<td>🗺️ <strong>Мережевий</strong></td>\n<td>Network layer</td>\n<td>Пакет</td>\n<td>Логічна адресація та вибір маршруту між мережами</td>\n</tr>\n<tr>\n<td>2</td>\n<td>🔗 <strong>Канальний</strong></td>\n<td>Data link layer</td>\n<td>Кадр</td>\n<td>Передача кадрів сусідньому вузлу, MAC-адреси, виявлення помилок</td>\n</tr>\n<tr>\n<td>1</td>\n<td>⚡ <strong>Фізичний</strong></td>\n<td>Physical layer</td>\n<td>Біт</td>\n<td>Перетворення бітів на сигнали та передача їх середовищем</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Як запам'ятати порядок</strong> <p>Знизу вгору: <strong>P</strong>lease <strong>D</strong>o <strong>N</strong>ot <strong>T</strong>hrow <strong>S</strong>ausage <strong>P</strong>izza <strong>A</strong>way (Physical, Data link, Network, Transport, Session, Presentation, Application).</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Дві групи рівнів</strong> <p>Рівні 1-3 (<strong>media layers</strong>) відповідають за фізичну доставку даних і реалізуються в мережевому обладнанні. Рівні 4-7 (<strong>host layers</strong>) реалізуються програмно на кінцевих вузлах і забезпечують логічну взаємодію застосунків.</p>\n</div>\n\n","<h1>🔗 Взаємодія рівнів: інтерфейси та протоколи</h1>\n<p><strong>Головна ідея:</strong> У моделі OSI є два види взаємодії: між сусідніми рівнями одного вузла та між однаковими рівнями різних вузлів.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph A[&quot;💻 Вузол відправника&quot;]\n        A7[7 Прикладний] --&gt; A4[4 Транспортний]\n        A4 --&gt; A3[3 Мережевий]\n        A3 --&gt; A1[1 Фізичний]\n    end\n    subgraph B[&quot;💻 Вузол одержувача&quot;]\n        B1[1 Фізичний] --&gt; B3[3 Мережевий]\n        B3 --&gt; B4[4 Транспортний]\n        B4 --&gt; B7[7 Прикладний]\n    end\n    A7 -.-&gt;|протокол рівня 7| B7\n    A4 -.-&gt;|протокол рівня 4| B4\n    A3 -.-&gt;|протокол рівня 3| B3\n    A1 ==&gt;|фізичне середовище| B1\n    style A7 fill:#e3f2fd,stroke:#1565c0\n    style B7 fill:#e3f2fd,stroke:#1565c0\n    style A4 fill:#e8f5e9,stroke:#388e3c\n    style B4 fill:#e8f5e9,stroke:#388e3c\n    style A3 fill:#fff3e0,stroke:#ef6c00\n    style B3 fill:#fff3e0,stroke:#ef6c00\n    style A1 fill:#fce4ec,stroke:#c2185b\n    style B1 fill:#fce4ec,stroke:#c2185b\"><svg id=\"exp-1789021167033-4-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1843.140625px;\" viewBox=\"0 -1 1843.140625 275.5\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789021167033-4-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789021167033-4-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789021167033-4-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789021167033-4-0 .error-icon{fill:#552222;}#exp-1789021167033-4-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789021167033-4-0 .edge-thickness- ong> вузлів</td>\n<td><strong>Протокол</strong>: правила обміну між рівноправними партнерами</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Протокол</strong> - набір правил, що визначає формат і порядок обміну повідомленнями між однойменними рівнями різних вузлів. <strong>Інтерфейс</strong> - набір правил взаємодії між сусідніми рівнями одного вузла.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Умовність горизонтальної взаємодії</strong> <p>Горизонтальна взаємодія логічна: фізично дані проходять униз через усі рівні відправника, середовищем і вгору через рівні одержувача. Реальний обмін сигналами відбувається лише на фізичному рівні.</p>\n</div>\n\n","<h1>📦 Інкапсуляція та одиниці даних</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Інкапсуляція</strong> (Encapsulation) - процес, у якому кожен рівень додає до даних, отриманих від рівня вище, власний <strong>заголовок</strong> зі службовою інформацією і передає результат рівню нижче. На стороні одержувача виконується зворотний процес, <strong>декапсуляція</strong>.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[🖥️ Дані застосунку] --&gt; B[🚚 Заголовок транспортного рівня + Дані = Сегмент]\n    B --&gt; C[🗺️ Заголовок мережевого рівня + Сегмент = Пакет]\n    C --&gt; D[🔗 Заголовок канального рівня + Пакет + Трейлер = Кадр]\n    D --&gt; E[⚡ Послідовність бітів у середовищі]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#e8f5e9,stroke:#388e3c\n    style C fill:#fff3e0,stroke:#ef6c00\n    style D fill:#fff9c4,stroke:#f9a825\n    style E fill:#fce4ec,stroke:#c2185b\"><svg id=\"exp-1789021167096-5-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 264px;\" viewBox=\"0 0 264 624\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789021167096-5-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial, width: 200px;\"><span class=\"nodeLabel \"><p>🔗 Заголовок канального рівня + Пакет + Трейлер = Кадр</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789021167096-5-0-flowchart-E-7\" data-look=\"classic\" transform=\"translate(132, 580)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>⚡ Послідовність бітів у середовищі</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789021167096-5-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789021167096-5-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Рівень</th>\n<th>Одиниця даних</th>\n<th>Основний вміст заголовка</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🚚 Транспортний</td>\n<td><strong>Сегмент</strong></td>\n<td>Номери портів, порядкові номери, контрольна сума</td>\n</tr>\n<tr>\n<td>🗺️ Мережевий</td>\n<td><strong>Пакет</strong></td>\n<td>IP-адреси відправника та одержувача</td>\n</tr>\n<tr>\n<td>🔗 Канальний</td>\n<td><strong>Кадр</strong></td>\n<td>MAC-адреси; у трейлері контрольна сума кадру</td>\n</tr>\n<tr>\n<td>⚡ Фізичний</td>\n<td><strong>Біт</strong></td>\n<td>Заголовка немає, кадр перетворюється на сигнали</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 PDU</strong> <p><strong>PDU</strong> (Protocol Data Unit / Протокольна одиниця даних) - загальна назва блоку даних будь-якого рівня. Для рівнів 5-7 окремих назв не використовують, там оперують просто даними.</p>\n</div>\n\n","<h1>⚡ Рівень 1: Фізичний (Physical)</h1>\n<p><strong>Головна ідея:</strong> Фізичний рівень визначає, як біти представляються електричними, оптичними або радіосигналами і передаються середовищем.</p>\n<h2>🔧 Функції</h2>\n<ul>\n<li>📡 Передача та приймання потоку <strong>бітів</strong> через кабель або радіоефір</li>\n<li>🔌 Специфікація <strong>фізичних характеристик</strong>: роз'єми, контакти, рівні напруги, довжина хвилі</li>\n<li>📐 <strong>Лінійне кодування</strong> сигналу та <strong>синхронізація</strong> передавача і приймача</li>\n<li>↔️ Режим передачі: симплекс, напівдуплекс, дуплекс</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🧵 Середовища</td>\n<td>Вита пара, коаксіальний кабель, оптоволокно, радіоканал</td>\n</tr>\n<tr>\n<td>🖧 Пристрої</td>\n<td><strong>Концентратор</strong> повторює сигнал на всі порти, <strong>повторювач</strong> відновлює сигнал на довгих лініях, <strong>медіаконвертер</strong> переводить сигнал між середовищами, <strong>мережевий адаптер</strong> реалізує рівень на стороні вузла</td>\n</tr>\n<tr>\n<td>📄 Стандарти</td>\n<td>IEEE 802.3 (фізична частина Ethernet), IEEE 802.11 (Wi-Fi), RS-232, DSL, SONET/SDH</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Межа відповідальності</strong> <p>Фізичний рівень не оперує адресами, кадрами чи помилками: він передає потік бітів без аналізу вмісту.</p>\n</div>\n\n","<h1>🔗 Рівень 2: Канальний (Data Link)</h1>\n<p><strong>Головна ідея:</strong> Канальний рівень забезпечує передачу даних між <strong>сусідніми</strong> вузлами в межах одного сегмента мережі: формує кадри, адресує їх фізичними адресами та виявляє помилки передачі.</p>\n<h2>🔧 Функції</h2>\n<ul>\n<li>📦 Об'єднання бітів у <strong>кадри</strong> з визначеними межами</li>\n<li>🏷️ <strong>Фізична адресація</strong> за <strong>MAC-адресами</strong> мережевих адаптерів</li>\n<li>✅ <strong>Виявлення помилок</strong> за контрольною сумою (<strong>CRC</strong>) у трейлері кадру</li>\n<li>🚦 <strong>Керування доступом</strong> до спільного середовища передачі</li>\n</ul>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    N[🗺️ Мережевий рівень] --&gt; LLC[LLC: єдиний інтерфейс до мережевого рівня незалежно від технології]\n    LLC --&gt; MAC[MAC: адресація, формування кадру, доступ до середовища]\n    MAC --&gt; P[⚡ Фізичний рівень]\n    style N fill:#fff3e0,stroke:#ef6c00\n    style LLC fill:#e3f2fd,stroke:#1565c0\n    style MAC fill:#e8f5e9,stroke:#388e3c\n    style P fill:#fce4ec,stroke:#c2185b\"><svg id=\"exp-1789021167108-7-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1070.90625px;\" viewBox=\"0 0 1070.90625 112\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789021167108-7-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789021167108-7-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789021167108-7-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789021167108-7-0 .error-icon{fill:#552222;}#exp-1789021167108-7-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789021167108-7-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789021167108-7-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1789021167108-7-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1789021167108-7-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1789021167108-7-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1789021167108-7-0 .edge-pattern-dotted{stro important\" x=\"-106.7734375\" y=\"-24\" width=\"213.546875\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-82.7734375, -12)\"><rect></rect><foreignObject width=\"165.546875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🗺️ Мережевий рівень</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789021167108-7-0-flowchart-LLC-1\" data-look=\"classic\" transform=\"translate(395.546875, 56)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-124\" y=\"-48\" width=\"248\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -36)\"><rect></rect><foreignObject width=\"200\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>LLC: єдиний інтерфейс до мережевого рівня незалежно від технології</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789021167108-7-0-flowchart-MAC-3\" data-look=\"classic\" transform=\"translate(693.546875, 56)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-124\" y=\"-48\" width=\"248\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -36)\"><rect></rect><foreignObject width=\"200\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>MAC: адресація, формування кадру, доступ до середовища</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789021167108-7-0-flowchart-P-5\" data-look=\"classic\" transform=\"translate(965.2265625, 56)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-97.6796875\" y=\"-24\" width=\"195.359375\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-73.6796875, -12)\"><rect></rect><foreignObject width=\"147.359375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>⚡ Фізичний рівень</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789021167108-7-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789021167108-7-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"info\"><strong>ℹ️ Підрівні за IEEE 802</strong> <p><strong>LLC</strong> (Logical Link Control, IEEE 802.2) не залежить від типу мережі, <strong>MAC</strong> (Media Access Control) визначається технологією: Ethernet, Wi-Fi тощо.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🖧 Пристрої</td>\n<td>Комутатор, міст, точка доступу Wi-Fi</td>\n</tr>\n<tr>\n<td>📄 Протоколи</td>\n<td>Ethernet (IEEE 802.3), Wi-Fi (IEEE 802.11), PPP, HDLC, Frame Relay</td>\n</tr>\n</tbody></table>\n","<h1>🗺️ Рівень 3: Мережевий (Network)</h1>\n<p><strong>Головна ідея:</strong> Канальний рівень працює в межах однієї мережі. Мережевий рівень об'єднує <strong>різні мережі</strong> та визначає шлях пакета до адресата через проміжні вузли.</p>\n<h2>🔧 Функції</h2>\n<ul>\n<li>🏷️ <strong>Логічна адресація</strong>: ієрархічна адреса вузла (<strong>IP-адреса</strong>) містить ідентифікатор мережі та вузла в ній</li>\n<li>🧭 <strong>Маршрутизація</strong>: вибір шляху між мережами</li>\n<li>📤 <strong>Пересилання</strong> пакетів з одного інтерфейсу маршрутизатора на інший</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🖧 Пристрої</td>\n<td>Маршрутизатор, комутатор третього рівня</td>\n</tr>\n<tr>\n<td>📄 Протоколи адресації</td>\n<td><strong>IPv4</strong>, <strong>IPv6</strong>, ICMP, IPsec</td>\n</tr>\n<tr>\n<td>🧭 Протоколи маршрутизації</td>\n<td><strong>RIP</strong>, <strong>OSPF</strong>, <strong>EIGRP</strong>, BGP</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 MAC-адреса vs IP-адреса</strong> <p><strong>MAC-адреса</strong> закріплена за адаптером і не змінюється при переміщенні пристрою між мережами. <strong>IP-адреса</strong> залежить від мережі, у якій перебуває вузол, і саме за нею обирається маршрут.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 ARP</strong> <p>Відповідність між IP-адресою та MAC-адресою сусіднього вузла визначає протокол <strong>ARP</strong>, що працює на межі канального та мережевого рівнів.</p>\n</div>\n\n","<h1>🚚 Рівень 4: Транспортний (Transport)</h1>\n<p><strong>Головна ідея:</strong> Мережевий рівень доставляє пакети між вузлами. Транспортний рівень доставляє дані між <strong>процесами</strong> на цих вузлах і за потреби забезпечує надійність передачі.</p>\n<h2>🔧 Функції</h2>\n<ul>\n<li>🔢 <strong>Порти</strong>: ідентифікація застосунку на вузлі</li>\n<li>✂️ <strong>Сегментація</strong> повідомлення та його збирання на стороні одержувача</li>\n<li>✅ <strong>Надійність</strong>: підтвердження, повторна передача втрачених сегментів, упорядкування</li>\n<li>🚰 <strong>Керування потоком</strong> та перевантаженням</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>🔒 TCP (Transmission Control Protocol)</th>\n<th>🚀 UDP (User Datagram Protocol)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Встановлення з'єднання</td>\n<td>Так (three-way handshake)</td>\n<td>Ні</td>\n</tr>\n<tr>\n<td>Гарантія доставки</td>\n<td>Так, із повторною передачею</td>\n<td>Ні</td>\n</tr>\n<tr>\n<td>Порядок сегментів</td>\n<td>Зберігається</td>\n<td>Не гарантується</td>\n</tr>\n<tr>\n<td>Накладні витрати</td>\n<td>Вищі</td>\n<td>Мінімальні</td>\n</tr>\n<tr>\n<td>Типове застосування</td>\n<td>Веб, пошта, передача файлів</td>\n<td>Відеозв'язок, стрімінг, DNS, онлайн-ігри</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Вибір протоколу</strong> <p>У застосунках реального часу втрата окремого сегмента менш критична за затримку на його повторну передачу, тому доречний UDP. Для передачі файлів потрібна повнота даних, тому обирають TCP.</p>\n</div>\n\n","<h1>🤝 Рівень 5: Сеансовий (Session)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Сеансовий рівень</strong> керує <strong>діалогом</strong> між застосунками: встановлює, підтримує та завершує сеанс зв'язку.</p>\n</div>\n\n\n\n<h2>🔧 Функції</h2>\n<ul>\n<li>🟢 <strong>Встановлення та завершення сеансу</strong></li>\n<li>🎙️ <strong>Керування діалогом</strong>: порядок передачі, напівдуплексний або дуплексний обмін</li>\n<li>📍 <strong>Синхронізація</strong>: контрольні точки, з яких після збою відновлюється передача</li>\n<li>⏸️ <strong>Підтримка сеансу</strong> в періоди неактивності застосунку</li>\n</ul>\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📄 Протоколи</td>\n<td>NetBIOS, RPC (Remote Procedure Call), PPTP, ISO 8327 (X.225)</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 На практиці</strong> <p>У сучасних стеках функції сеансового рівня рідко виділені в окремий протокол: їх реалізують застосунки або бібліотеки прикладного рівня. Тому в стеку TCP/IP цього рівня як окремого немає.</p>\n</div>\n\n","<h1>🎨 Рівень 6: Представлення (Presentation)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Рівень представлення</strong> узгоджує форму даних між застосунками: кодування символів, формати зображень і структур, стиснення та шифрування.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Функція</th>\n<th>Що робить</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔤 <strong>Перетворення кодування</strong></td>\n<td>Узгоджує представлення символів між системами</td>\n<td>ASCII, EBCDIC, Unicode (UTF-8)</td>\n</tr>\n<tr>\n<td>🖼️ <strong>Форматування даних</strong></td>\n<td>Визначає кодування зображень, звуку, відео, структур</td>\n<td>JPEG, MPEG, JSON, XML</td>\n</tr>\n<tr>\n<td>🗜️ <strong>Стиснення</strong></td>\n<td>Зменшує обсяг даних для передачі</td>\n<td>gzip, стиснення у кодеках</td>\n</tr>\n<tr>\n<td>🔐 <strong>Шифрування</strong></td>\n<td>Захищає дані від несанкціонованого читання</td>\n<td>Шифрування даних застосунку</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>Аспект</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📄 Протоколи та стандарти</td>\n<td>ASN.1, XDR (eXternal Data Representation), MIME</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Межа рівнів 6 і 7</strong> <p>JPEG, MPEG чи UTF-8 у контексті моделі є стандартами кодування даних для обміну між різнорідними системами. На практиці стиснення і шифрування часто виконує сам застосунок (наприклад, TLS у браузері), тому межа між рівнями 6 і 7 у реальних системах розмита.</p>\n</div>\n\n","<h1>🖥️ Рівень 7: Прикладний (Application)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Прикладний рівень</strong> надає застосункам <strong>доступ до мережевих служб</strong>. Це не самі програми, а протоколи, якими вони користуються для взаємодії через мережу.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Служба</th>\n<th>Протоколи</th>\n<th>Призначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🌐 Веб</td>\n<td><strong>HTTP</strong>, <strong>HTTPS</strong></td>\n<td>Передача вебсторінок і даних вебзастосунків</td>\n</tr>\n<tr>\n<td>📧 Електронна пошта</td>\n<td><strong>SMTP</strong>, <strong>POP3</strong>, <strong>IMAP</strong></td>\n<td>Надсилання та отримання листів</td>\n</tr>\n<tr>\n<td>📁 Файли</td>\n<td><strong>FTP</strong>, SFTP, SMB</td>\n<td>Передача та спільний доступ до файлів</td>\n</tr>\n<tr>\n<td>🔎 Імена</td>\n<td><strong>DNS</strong></td>\n<td>Перетворення доменних імен на IP-адреси</td>\n</tr>\n<tr>\n<td>⚙️ Налаштування</td>\n<td><strong>DHCP</strong></td>\n<td>Автоматичне призначення IP-адрес</td>\n</tr>\n<tr>\n<td>🖥️ Віддалене керування</td>\n<td><strong>SSH</strong>, Telnet, RDP</td>\n<td>Керування віддаленим вузлом</td>\n</tr>\n<tr>\n<td>📊 Моніторинг</td>\n<td><strong>SNMP</strong></td>\n<td>Керування та моніторинг мережевого обладнання</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Застосунок і протокол</strong> <p>Браузер або поштовий клієнт не є прикладним рівнем: вони <strong>використовують</strong> протоколи прикладного рівня (HTTP, IMAP) для обміну даними із сервером.</p>\n</div>\n\n","<h1>📊 Зведена таблиця: рівні, адреси, обладнання, протоколи</h1>\n<p><strong>Головна ідея:</strong> Кожен рівень має власний тип адреси, обладнання та протоколи.</p>\n<table>\n<thead>\n<tr>\n<th>Рівень</th>\n<th>Одиниця даних</th>\n<th>Адресація</th>\n<th>Обладнання</th>\n<th>Ключові протоколи</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>7 🖥️ Прикладний</td>\n<td>Дані</td>\n<td>URL, доменне ім'я</td>\n<td>Сервери</td>\n<td>HTTP, DNS, SMTP, FTP, SSH, DHCP</td>\n</tr>\n<tr>\n<td>6 🎨 Представлення</td>\n<td>Дані</td>\n<td>-</td>\n<td>-</td>\n<td>ASN.1, XDR, MIME</td>\n</tr>\n<tr>\n<td>5 🤝 Сеансовий</td>\n<td>Дані</td>\n<td>-</td>\n<td>-</td>\n<td>NetBIOS, RPC, PPTP</td>\n</tr>\n<tr>\n<td>4 🚚 Транспортний</td>\n<td>Сегмент</td>\n<td>Номер порту</td>\n<td>Міжмережевий екран</td>\n<td>TCP, UDP</td>\n</tr>\n<tr>\n<td>3 🗺️ Мережевий</td>\n<td>Пакет</td>\n<td>IP-адреса</td>\n<td>Маршрутизатор, L3-комутатор</td>\n<td>IPv4, IPv6, ICMP, OSPF, RIP</td>\n</tr>\n<tr>\n<td>2 🔗 Канальний</td>\n<td>Кадр</td>\n<td>MAC-адреса</td>\n<td>Комутатор, міст, точка доступу</td>\n<td>Ethernet, Wi-Fi, PPP</td>\n</tr>\n<tr>\n<td>1 ⚡ Фізичний</td>\n<td>Біт</td>\n<td>-</td>\n<td>Концентратор, повторювач, кабель</td>\n<td>Специфікації 802.3, 802.11, RS-232</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Діагностика за рівнями</strong> <p>Пошук несправності ведуть знизу вгору: стан фізичного з'єднання (1), наявність MAC-адреси в таблиці комутатора (2), доступність шлюзу за <code>ping</code> (3), відкритість порту (4), відповідь служби (7). Модель задає порядок перевірки.</p>\n</div>\n\n","<h1>📚 Протоколи та стеки протоколів</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Стек протоколів</strong> (Protocol Stack) - ієрархічно організована сукупність протоколів, достатня для взаємодії вузлів у мережі. Модель OSI описує, <strong>що</strong> має робити кожен рівень, а стек протоколів містить <strong>конкретні специфікації</strong>, які це реалізують.</p>\n</div>\n\n\n\n<h2>🔀 Дві групи протоколів за способом обміну</h2>\n<table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>📞 Зі встановленням з'єднання (CONS)</th>\n<th>✉️ Без встановлення з'єднання (CLNS)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Перед обміном</td>\n<td>Вузли встановлюють логічне з'єднання та узгоджують параметри</td>\n<td>Відправник одразу надсилає повідомлення</td>\n</tr>\n<tr>\n<td>Гарантії</td>\n<td>Доставка, порядок, підтвердження</td>\n<td>Відсутні, кожна дейтаграма обробляється незалежно</td>\n</tr>\n<tr>\n<td>Приклади</td>\n<td>TCP, X.25</td>\n<td>UDP, IP, Ethernet</td>\n</tr>\n</tbody></table>\n<h2>🗂️ Приклади стеків протоколів</h2>\n<table>\n<thead>\n<tr>\n<th>Стек</th>\n<th>Розробник</th>\n<th>Стан сьогодні</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>TCP/IP</strong></td>\n<td>DARPA, IETF</td>\n<td>🟢 Основа Інтернету та сучасних мереж</td>\n</tr>\n<tr>\n<td><strong>Стек OSI</strong></td>\n<td>ISO</td>\n<td>🟡 Окремі протоколи (IS-IS, X.500, ASN.1) використовуються досі</td>\n</tr>\n<tr>\n<td><strong>SNA</strong></td>\n<td>IBM</td>\n<td>🔴 Історичний, мейнфрейми IBM</td>\n</tr>\n<tr>\n<td><strong>IPX/SPX</strong></td>\n<td>Novell NetWare</td>\n<td>🔴 Історичний, локальні мережі 1990-х</td>\n</tr>\n<tr>\n<td><strong>AppleTalk</strong></td>\n<td>Apple</td>\n<td>🔴 Історичний, замінений на TCP/IP</td>\n</tr>\n</tbody></table>\n","<h1>⚖️ Модель OSI та стек TCP/IP</h1>\n<p><strong>Головна ідея:</strong> Модель OSI стала загальноприйнятим інструментом опису, тоді як стек протоколів OSI поступився простішому стеку TCP/IP. Рівні TCP/IP досі описують у термінах OSI.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    subgraph OSI[&quot;🏛️ Модель OSI&quot;]\n        O7[7 Прикладний]\n        O6[6 Представлення]\n        O5[5 Сеансовий]\n        O4[4 Транспортний]\n        O3[3 Мережевий]\n        O2[2 Канальний]\n        O1[1 Фізичний]\n    end\n    subgraph TCP[&quot;🌐 Стек TCP/IP&quot;]\n        T4[Прикладний&lt;br/&gt;HTTP, DNS, SMTP, SSH]\n        T3[Транспортний&lt;br/&gt;TCP, UDP]\n        T2[Мережевий Internet&lt;br/&gt;IP, ICMP]\n        T1[Доступу до мережі&lt;br/&gt;Ethernet, Wi-Fi, PPP]\n    end\n    O7 --&gt; T4\n    O6 --&gt; T4\n    O5 --&gt; T4\n    O4 --&gt; T3\n    O3 --&gt; T2\n    O2 --&gt; T1\n    O1 --&gt; T1\n    style O7 fill:#e3f2fd,stroke:#1565c0\n    style O6 fill:#e3f2fd,stroke:#1565c0\n    style O5 fill:#e3f2fd,stroke:#1565c0\n    style O4 fill:#e8f5e9,stroke:#388e3c\n    style O3 fill:#fff3e0,stroke:#ef6c00\n    style O2 fill:#fff9c4,stroke:#f9a825\n    style O1 fill:#fff9c4,stroke:#f9a825\n    style T4 fill:#e3f2fd,stroke:#1565c0\n    style T3 fill:#e8f5e9,stroke:#388e3c\n    style T2 fill:#fff3e0,stroke:#ef6c00\n    style T1 fill:#fff9c4,stroke:#f9a825\"><svg id=\"exp-1789021167121-15-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 564.484375px;\" viewBox=\"0 -1 564.484375 759\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789021167121-15-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#  max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>Доступу до мережі<br>Ethernet, Wi-Fi, PPP</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789021167121-15-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789021167121-15-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Протоколи стеку OSI</th>\n<th>Рівень</th>\n<th>Призначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>FTAM</strong></td>\n<td>7</td>\n<td>File Transfer, Access and Management: передача та керування файлами</td>\n</tr>\n<tr>\n<td><strong>VTP</strong></td>\n<td>7</td>\n<td>Virtual Terminal Protocol: віртуальний термінал</td>\n</tr>\n<tr>\n<td><strong>X.400</strong></td>\n<td>7</td>\n<td>Система обміну електронними повідомленнями</td>\n</tr>\n<tr>\n<td><strong>X.500</strong></td>\n<td>7</td>\n<td>Служба каталогів; її спрощений варіант <strong>LDAP</strong> застосовується повсюдно</td>\n</tr>\n<tr>\n<td><strong>ES-IS, IS-IS</strong></td>\n<td>3</td>\n<td>Маршрутизація; IS-IS досі використовується провайдерами</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Чому стек OSI не набув поширення</strong> <p>Протоколи OSI були складними у реалізації і з'явилися тоді, коли TCP/IP уже працював у реальних мережах і був вільно доступний в Unix-системах.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> <ol>\n<li><strong>Модель OSI - еталон, а не реалізація.</strong> Вона розподіляє функції мережевої взаємодії між сімома рівнями та задає спільну термінологію</li>\n<li><strong>Кожен рівень виконує лише власні функції</strong>, надає сервіс рівню вище і користується сервісом рівня нижче</li>\n<li><strong>Інтерфейс з'єднує сусідні рівні одного вузла, протокол - однакові рівні різних вузлів</strong></li>\n<li><strong>Інкапсуляція додає заголовок на кожному рівні</strong>: дані стають сегментом, пакетом, кадром і бітами</li>\n<li><strong>Кожен рівень має свою адресу та обладнання</strong>: MAC-адреса і комутатор на рівні 2, IP-адреса і маршрутизатор на рівні 3, порт на рівні 4</li>\n<li><strong>Стек TCP/IP витіснив стек OSI</strong>, але його рівні описують у термінах моделі OSI</li>\n</ol>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 Що описує модель OSI і чому вона називається моделлю взаємодії <strong>відкритих</strong> систем?</p>\n</li>\n<li><p>🤔 Назвіть сім рівнів моделі OSI знизу вгору та вкажіть одиницю даних кожного з рівнів 1-4.</p>\n</li>\n<li><p>🤔 Чим <strong>інтерфейс</strong> відрізняється від <strong>протоколу</strong>? Яка взаємодія є вертикальною, а яка горизонтальною?</p>\n</li>\n<li><p>🤔 Поясніть процес <strong>інкапсуляції</strong>. Що додається до даних на транспортному, мережевому та канальному рівнях?</p>\n</li>\n<li><p>🤔 Який рівень забезпечує контроль доступу до середовища? На які підрівні його поділяє специфікація IEEE 802?</p>\n</li>\n<li><p>🤔 Чим відрізняються <strong>MAC-адреса</strong> та <strong>IP-адреса</strong>? На яких рівнях вони використовуються?</p>\n</li>\n<li><p>🤔 Порівняйте <strong>TCP</strong> і <strong>UDP</strong>. Для яких задач доцільний кожен із них?</p>\n</li>\n<li><p>🤔 Чому стек протоколів TCP/IP витіснив стек протоколів OSI, хоча модель OSI використовується досі?</p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Еталонна модель OSI</td>\n<td>OSI Reference Model</td>\n<td>Семирівнева модель ISO, що описує розподіл функцій мережевої взаємодії між рівнями</td>\n</tr>\n<tr>\n<td>Відкрита система</td>\n<td>Open System</td>\n<td>Система, побудована за загальнодоступними стандартами</td>\n</tr>\n<tr>\n<td>Рівень</td>\n<td>Layer</td>\n<td>Модуль моделі з визначеним набором функцій, що надає сервіси рівню вище</td>\n</tr>\n<tr>\n<td>Протокол</td>\n<td>Protocol</td>\n<td>Правила обміну повідомленнями між однойменними рівнями різних вузлів</td>\n</tr>\n<tr>\n<td>Інтерфейс (послуга)</td>\n<td>Interface (Service)</td>\n<td>Правила взаємодії між сусідніми рівнями одного вузла</td>\n</tr>\n<tr>\n<td>Інкапсуляція</td>\n<td>Encapsulation</td>\n<td>Додавання заголовка кожного рівня до даних при передачі вниз стеком</td>\n</tr>\n<tr>\n<td>Кадр</td>\n<td>Frame</td>\n<td>Одиниця даних канального рівня</td>\n</tr>\n<tr>\n<td>Пакет</td>\n<td>Packet</td>\n<td>Одиниця даних мережевого рівня</td>\n</tr>\n<tr>\n<td>Сегмент</td>\n<td>Segment</td>\n<td>Одиниця даних транспортного рівня</td>\n</tr>\n<tr>\n<td>Дейтаграма</td>\n<td>Datagram</td>\n<td>Самостійне повідомлення в протоколах без встановлення з'єднання</td>\n</tr>\n<tr>\n<td>Маршрутизація</td>\n<td>Routing</td>\n<td>Вибір шляху передачі пакета між мережами</td>\n</tr>\n<tr>\n<td>Порт</td>\n<td>Port</td>\n<td>Числовий ідентифікатор застосунку на транспортному рівні</td>\n</tr>\n<tr>\n<td>Стек протоколів</td>\n<td>Protocol Stack</td>\n<td>Ієрархічно організована сукупність протоколів для реалізації мережевої взаємодії</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>OSI</td>\n<td>Open Systems Interconnection</td>\n<td>Взаємодія відкритих систем</td>\n</tr>\n<tr>\n<td>ISO</td>\n<td>International Organization for Standardization</td>\n<td>Міжнародна організація зі стандартизації</td>\n</tr>\n<tr>\n<td>IEEE</td>\n<td>Institute of Electrical and Electronics Engineers</td>\n<td>Інститут інженерів з електротехніки та електроніки</td>\n</tr>\n<tr>\n<td>PDU</td>\n<td>Protocol Data Unit</td>\n<td>Протокольна одиниця даних</td>\n</tr>\n<tr>\n<td>MAC</td>\n<td>Media Access Control</td>\n<td>Керування доступом до середовища</td>\n</tr>\n<tr>\n<td>LLC</td>\n<td>Logical Link Control</td>\n<td>Керування логічним зв'язком</td>\n</tr>\n<tr>\n<td>CRC</td>\n<td>Cyclic Redundancy Check</td>\n<td>Циклічна контрольна сума</td>\n</tr>\n<tr>\n<td>IP</td>\n<td>Internet Protocol</td>\n<td>Міжмережевий протокол</td>\n</tr>\n<tr>\n<td>ARP</td>\n<td>Address Resolution Protocol</td>\n<td>Протокол визначення адрес</td>\n</tr>\n<tr>\n<td>TCP</td>\n<td>Transmission Control Protocol</td>\n<td>Протокол керування передачею</td>\n</tr>\n<tr>\n<td>UDP</td>\n<td>User Datagram Protocol</td>\n<td>Протокол дейтаграм користувача</td>\n</tr>\n<tr>\n<td>CONS</td>\n<td>Connection-Oriented Network Service</td>\n<td>Мережева служба зі встановленням з'єднання</td>\n</tr>\n<tr>\n<td>CLNS</td>\n<td>Connectionless Network Service</td>\n<td>Мережева служба без встановлення з'єднання</td>\n</tr>\n<tr>\n<td>HTTP</td>\n<td>HyperText Transfer Protocol</td>\n<td>Протокол передачі гіпертексту</td>\n</tr>\n<tr>\n<td>DNS</td>\n<td>Domain Name System</td>\n<td>Система доменних імен</td>\n</tr>\n<tr>\n<td>FTAM</td>\n<td>File Transfer, Access and Management</td>\n<td>Передача файлів, доступ і керування</td>\n</tr>\n<tr>\n<td>IS-IS</td>\n<td>Intermediate System to Intermediate System</td>\n<td>Протокол маршрутизації стеку OSI</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
