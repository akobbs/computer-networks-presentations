<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Технології віртуальних мереж</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><style>* {

#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 20</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>Технології віртуальних мереж</h1>\n<p><strong>Курс:</strong> Організація комп'ютерних мереж / Комп'ютерні мережі</p>\n<p><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h1>📋 План лекції</h1>\n<ol>\n<li>🤔 Проблеми \"плоскої\" локальної мережі</li>\n<li>🧩 VLAN: логічне розділення комутатора</li>\n<li>🏷️ Тегування кадрів: стандарт IEEE 802.1Q</li>\n<li>🔌 Порти access і trunk, native VLAN</li>\n<li>⚙️ Налаштування та перевірка VLAN у Cisco IOS</li>\n<li>🔗 Маршрутизація між VLAN</li>\n<li>🔐 VPN: приватна мережа поверх Інтернету</li>\n<li>🛡️ Структура, захист і класифікація VPN</li>\n<li>✅ Висновки, контрольні питання, глосарій</li>\n</ol>\n","<h1>🤔 Проблеми \"плоскої\" локальної мережі</h1>\n<div class=\"info\"><strong>ℹ️ Ситуація</strong> <p>У мережі з комутаторів усі підключені пристрої утворюють <strong>один широкомовний домен</strong>: кадр, надісланий на широкомовну адресу, отримує кожен вузол мережі.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Поки мережа невелика, це не заважає. Але зі зростанням кількості пристроїв \"плоска\" структура створює проблеми продуктивності, безпеки та керованості.</p>\n<table>\n<thead>\n<tr>\n<th>Проблема</th>\n<th>У чому проявляється</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📢 Широкомовний трафік</td>\n<td>Кожен DHCP-запит чи пошук адреси доходить до всіх 200 комп'ютерів</td>\n</tr>\n<tr>\n<td>🐢 Зайве навантаження</td>\n<td>Кожен вузол витрачає ресурси на обробку чужих кадрів</td>\n</tr>\n<tr>\n<td>🔓 Відсутність ізоляції</td>\n<td>Комп'ютер бухгалтерії на канальному рівні \"бачить\" сервери розробки</td>\n</tr>\n<tr>\n<td>🏢 Прив'язка до кабелів</td>\n<td>Група користувачів визначається тим, у який комутатор увімкнений ПК</td>\n</tr>\n<tr>\n<td>🛠️ Складність змін</td>\n<td>Переведення співробітника в інший відділ вимагає перекомутації</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Класичне рішення і його ціна</strong> <p>Розділити мережу можна фізично: окремий комутатор і окремі кабелі для кожного відділу. Це дорого, негнучко і не працює, коли відділи розташовані на різних поверхах. Тому розділення переносять із фізичного рівня на логічний.</p>\n</div>\n\n","<h1>🧩 VLAN: логічне розділення комутатора</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>VLAN</strong> (Virtual Local Area Network / Віртуальна локальна мережа) - логічна група портів і пристроїв, що поводиться як окрема локальна мережа з власним широкомовним доменом, незалежно від фізичного розташування пристроїв.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> VLAN дозволяє один фізичний комутатор розділити на кілька незалежних віртуальних комутаторів. Це технологія <strong>канального рівня</strong>, тому реалізується саме на комутаторах.</p>\n\n<div class=\"mermaid\" data-source=\"graph TB\n    subgraph SW[&quot;🔲 Один комутатор&quot;]\n        direction LR\n        V10[&quot;VLAN 10&lt;br/&gt;Бухгалтерія&quot;]\n        V20[&quot;VLAN 20&lt;br/&gt;Розробка&quot;]\n        V30[&quot;VLAN 30&lt;br/&gt;Гості&quot;]\n    end\n    PC1[&quot;💻 PC1&quot;] --&gt; V10\n    PC2[&quot;💻 PC2&quot;] --&gt; V10\n    PC3[&quot;💻 PC3&quot;] --&gt; V20\n    PC4[&quot;💻 PC4&quot;] --&gt; V20\n    PC5[&quot;📱 Гість&quot;] --&gt; V30\n    style V10 fill:#e8f5e9,stroke:#388e3c\n    style V20 fill:#e3f2fd,stroke:#1565c0\n    style V30 fill:#fff3e0,stroke:#ef6c00\n    style SW fill:#fff9c4,stroke:#f9a825\"><svg id=\"exp-1789461843722-3-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 936px;\" viewBox=\"4 4 936 261\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789461843722-3-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789461843722-3-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789461843722-3-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789461843722-3-0 .error-icon{fill:#552222;}#exp-1789461843722-3-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789461843722-3-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789461843722-3-0 .edge-thickness-thick{stroke-width:3.5px;}#exp \"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 PC1</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843722-3-0-flowchart-PC2-5\" data-look=\"neo\" transform=\"translate(280, 36)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 PC2</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843722-3-0-flowchart-PC3-7\" data-look=\"neo\" transform=\"translate(472, 36)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 PC3</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843722-3-0-flowchart-PC4-9\" data-look=\"neo\" transform=\"translate(664, 36)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 PC4</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843722-3-0-flowchart-PC5-11\" data-look=\"neo\" transform=\"translate(856, 36)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>📱 Гість</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789461843722-3-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789461843722-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Що дає VLAN</th>\n<th>Результат</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🛡️ Ізоляція трафіку</td>\n<td>PC1 не отримує кадри з VLAN 20, навіть на тому самому комутаторі</td>\n</tr>\n<tr>\n<td>📉 Менші широкомовні домени</td>\n<td>Широкомовний кадр залишається всередині своєї VLAN</td>\n</tr>\n<tr>\n<td>🧩 Групування за логікою</td>\n<td>Відділ, а не поверх чи шафа з обладнанням</td>\n</tr>\n<tr>\n<td>🔄 Гнучкість</td>\n<td>Переведення користувача в інший відділ - одна команда, а не кабель</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Ключове правило</strong> <p>Пристрої різних VLAN не можуть обмінюватися даними лише засобами комутатора. Для цього потрібен пристрій <strong>мережевого рівня</strong>.</p>\n</div>\n\n","<h1>🔢 Ідентифікатори VLAN</h1>\n<p><strong>Головна ідея:</strong> Кожна VLAN має числовий ідентифікатор <strong>VLAN ID</strong>, за яким комутатор визначає належність кадру та порту.</p>\n<table>\n<thead>\n<tr>\n<th>Діапазон</th>\n<th>Призначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>0, 4095</strong></td>\n<td>Зарезервовані стандартом, не використовуються</td>\n</tr>\n<tr>\n<td><strong>1</strong></td>\n<td>VLAN за замовчуванням: усі порти нового комутатора належать їй</td>\n</tr>\n<tr>\n<td><strong>2 - 1001</strong></td>\n<td>Звичайний діапазон (normal range) для щоденної роботи</td>\n</tr>\n<tr>\n<td><strong>1002 - 1005</strong></td>\n<td>Історично зарезервовані для Token Ring та FDDI</td>\n</tr>\n<tr>\n<td><strong>1006 - 4094</strong></td>\n<td>Розширений діапазон (extended range) для великих мереж</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Звідки межа 4094</strong> <p>Ідентифікатор займає 12 біт, тобто 2¹² = 4096 значень. Два з них (0 і 4095) зарезервовані, тому реально доступно <strong>4094</strong> VLAN.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Практика безпеки</strong> <p>VLAN 1 не використовують для користувацького трафіку: усі порти нового комутатора належать їй за замовчуванням, тому будь-який несанкціоновано підключений пристрій одразу опиняється в тій самій мережі, що й службовий трафік комутаторів. У навчальних і виробничих мережах працюють у діапазоні 2 - 1001.</p>\n</div>\n\n","<h1>🏷️ Тегування кадрів: IEEE 802.1Q</h1>\n<p><strong>Головна ідея:</strong> Кадр, що переходить з одного комутатора на інший, має \"нести\" номер своєї VLAN. Для цього стандарт <strong>IEEE 802.1Q</strong> вставляє в кадр Ethernet 4-байтний тег між полем Source MAC і полем Type.</p>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">┌──────────┬─────────┬──────────────┬──────┬──────────┬─────┐\n│ Dest MAC │ Src MAC │  802.1Q TAG  │ Type │   Data   │ FCS │\n│  6 байт  │  6 байт │    4 байти   │  2   │          │  4  │\n└──────────┴─────────┴──────────────┴──────┴──────────┴─────┘\n                            │\n                            ▼\n              ┌────────────┬────────────────────────┐\n              │   TPID     │          TCI           │\n              │  2 байти   │        2 байти         │\n              │  (0x8100)  │  PCP 3б │ DEI 1б │ VID 12б │\n              └────────────┴────────────────────────┘</code></pre><table>\n<thead>\n<tr>\n<th>Поле</th>\n<th>Розмір</th>\n<th>Призначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>TPID</strong></td>\n<td>2 байти</td>\n<td>Значення <code>0x8100</code> повідомляє, що далі йде тег, а не поле Type</td>\n</tr>\n<tr>\n<td><strong>PCP</strong></td>\n<td>3 біти</td>\n<td>Пріоритет кадру для QoS: 8 рівнів, від 0 до 7</td>\n</tr>\n<tr>\n<td><strong>DEI</strong></td>\n<td>1 біт</td>\n<td>Ознака, що кадр можна відкинути першим при перевантаженні</td>\n</tr>\n<tr>\n<td><strong>VID</strong></td>\n<td>12 біт</td>\n<td>Номер VLAN, до якої належить кадр</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Кінцеві пристрої тегу не бачать</strong> <p>Тег додає комутатор, коли передає кадр на магістральне з'єднання, і знімає його, коли передає кадр на порт кінцевого пристрою. Комп'ютер працює зі звичайним кадром Ethernet і \"не знає\" про існування VLAN.</p>\n</div>\n\n","<h1>🔌 Порти access і trunk</h1>\n<div class=\"info\"><strong>ℹ️ Два режими порту</strong> <p>Порт комутатора працює або в режимі <strong>access</strong> (обслуговує одну VLAN), або в режимі <strong>trunk</strong> (передає трафік кількох VLAN одночасно).</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>🎯 Access port</th>\n<th>🛣️ Trunk port</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Кількість VLAN</td>\n<td>Одна</td>\n<td>Кілька або всі</td>\n</tr>\n<tr>\n<td>Тегування</td>\n<td>Кадри без тегу</td>\n<td>Кадри з тегом 802.1Q</td>\n</tr>\n<tr>\n<td>Що підключають</td>\n<td>ПК, принтери, IP-телефони, точки Wi-Fi</td>\n<td>Інші комутатори, маршрутизатори, сервери</td>\n</tr>\n<tr>\n<td>Хто знає про VLAN</td>\n<td>Тільки комутатор</td>\n<td>Обидва пристрої на кінцях з'єднання</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" da le=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 PC<br>VLAN 10</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843752-6-0-flowchart-PC4-9\" data-look=\"neo\" transform=\"translate(986.6328125, 160)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 PC<br>VLAN 20</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789461843752-6-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789461843752-6-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"note\"><strong>📝 Native VLAN</strong> <p>На trunk-порту одна VLAN передається <strong>без тегу</strong>: це <strong>native VLAN</strong>, за замовчуванням VLAN 1. Кадр, що прийшов на trunk без тегу, комутатор відносить саме до неї. Native VLAN має збігатися на обох кінцях з'єднання, інакше кадри потраплять \"не в ту\" мережу. З міркувань безпеки native VLAN переносять з VLAN 1 на окрему невикористовувану, наприклад VLAN 99.</p>\n</div>\n\n","<h1>⚙️ Налаштування VLAN у Cisco IOS</h1>\n<p><strong>Головна ідея:</strong> Налаштування складається з трьох кроків: створити VLAN, призначити порти доступу, налаштувати магістраль між комутаторами.</p>\n<h2>1️⃣ Створення VLAN</h2>\n<pre><code class=\"language-cisco\">Switch(config)# vlan 10\nSwitch(config-vlan)# name Accounting\nSwitch(config-vlan)# exit\nSwitch(config)# vlan 20\nSwitch(config-vlan)# name Development\nSwitch(config-vlan)# exit\nSwitch(config)# vlan 99\nSwitch(config-vlan)# name Management\nSwitch(config-vlan)# exit</code></pre><h2>2️⃣ Призначення access-портів</h2>\n<pre><code class=\"language-cisco\">Switch(config)# interface fa0/5\nSwitch(config-if)# switchport mode access\nSwitch(config-if)# switchport access vlan 10\nSwitch(config-if)# exit\nSwitch(config)# interface range fa0/6 - 10\nSwitch(config-if-range)# switchport mode access\nSwitch(config-if-range)# switchport access vlan 20</code></pre><h2>3️⃣ Налаштування trunk-порту</h2>\n<pre><code class=\"language-cisco\">Switch(config)# interface gi0/1\nSwitch(config-if)# switchport mode trunk\nSwitch(config-if)# switchport trunk native vlan 99\nSwitch(config-if)# switchport trunk allowed vlan 10,20,99</code></pre><div class=\"tip\"><strong>💡 Дві корисні звички</strong> <p><code>interface range</code> налаштовує групу портів однією командою. <code>switchport trunk allowed vlan</code> обмежує магістраль лише потрібними VLAN: за замовчуванням trunk пропускає всі, а це зайвий трафік і зайва поверхня для атак.</p>\n</div>\n\n","<h1>🔍 Перевірка VLAN та IP-адреса комутатора</h1>\n<p><strong>Головна ідея:</strong> Після кожного етапу налаштування варто переконатися, що порти опинилися у правильних VLAN, а магістраль справді працює як trunk.</p>\n<table>\n<thead>\n<tr>\n<th>Команда</th>\n<th>Що показує</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>show vlan brief</code></td>\n<td>Перелік VLAN і портів, що до них належать</td>\n</tr>\n<tr>\n<td><code>show interfaces trunk</code></td>\n<td>Магістральні порти, native VLAN, дозволені VLAN</td>\n</tr>\n<tr>\n<td><code>show interfaces fa0/5 switchport</code></td>\n<td>Режим конкретного порту та його VLAN</td>\n</tr>\n</tbody></table>\n<pre><code class=\"language-plaintext hljs\" data-highlighted=\"yes\">Switch# show vlan brief\nVLAN Name          Status    Ports\n---- ------------- --------- ----------------------------\n1    default       active    Fa0/1, Fa0/2, Fa0/3, Fa0/4\n10   Accounting    active    Fa0/5\n20   Development   active    Fa0/6, Fa0/7, Fa0/8, Fa0/9, Fa0/10\n99   Management    active</code></pre><div class=\"info\"><strong>ℹ️ SVI: IP-адреса для керування комутатором</strong> <p>Комутатор канального рівня не має IP-адрес на фізичних портах. Для віддаленого керування IP-адресу призначають віртуальному інтерфейсу VLAN, який називають <strong>SVI</strong> (Switched Virtual Interface). Керування виносять в окрему <strong>management VLAN</strong>, недоступну звичайним користувачам.</p>\n</div>\n\n\n\n<pre><code class=\"language-cisco\">Switch(config)# interface vlan 99\nSwitch(config-if)# ip address 192.168.99.2 255.255.255.0\nSwitch(config-if)# no shutdown\nSwitch(config-if)# exit\nSwitch(config)# ip default-gateway 192.168.99.1</code></pre>","<h1>🔗 Маршрутизація між VLAN</h1>\n<div class=\"warning\"><strong>⚠️ Ключовий факт</strong> <p>Кожна VLAN, як правило, є окремою IP-підмережею. Щоб бухгалтерія могла звернутися до сервера розробки, трафік має пройти через пристрій мережевого рівня: <strong>маршрутизатор</strong> або <strong>комутатор 3-го рівня</strong>.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Найпоширеніший підхід у невеликих мережах називають <strong>router-on-a-stick</strong>: маршрутизатор підключають до комутатора одним trunk-каналом, а на його інтерфейсі створюють підінтерфейс для кожної VLAN.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    V10[&quot;💻 VLAN 10&lt;br/&gt;192.168.10.0&quot;] --- SW[&quot;🔲 Switch&quot;]\n    V20[&quot;💻 VLAN 20&lt;br/&gt;192.168.20.0&quot;] --- SW\n    SW ===|&quot;trunk&quot;| R[&quot;🔀 Router&lt;br/&gt;Gi0/0.10&lt;br/&gt;Gi0/0.20&quot;]\n    style V10 fill:#e8f5e9,stroke:#388e3c\n    style V20 fill:#e3f2fd,stroke:#1565c0\n    style SW fill:#fff9c4,stroke:#f9a825\n    style R fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1789461843771-9-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 633.703125px;\" viewBox=\"4 4 633.703125 200\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789461843771-9-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789461843771-9-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789461843771-9-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789461843771-9-0 .error-icon{fill:#552222;}#exp-1789461843771-9-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789461843771-9-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789461843771-9-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1789461843771-9-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1789461843771-9-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1789461843771-9-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1789461843771-9-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1789461843771-9-0 .marker{fill:#333333;stroke:#333333;}#exp-1789461843771-9-0 .marker.cross{stroke:#333333;}#exp-1789461843771-9-0 svg{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;}#exp-1789461843771-9-0 p{margin:0;}#exp-1789461843771-9-0 .label{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;color:#333;}#exp-1789461843771-9-0 .cluster-label text{fill:#333;}#exp-1789461843771-9-0 .cluster-label span{color:#333;}#exp-1789461843771-9-0 . r(config-if)# no shutdown\nRouter(config-if)# interface gi0/0.10\nRouter(config-subif)# encapsulation dot1Q 10\nRouter(config-subif)# ip address 192.168.10.1 255.255.255.0\nRouter(config-subif)# interface gi0/0.20\nRouter(config-subif)# encapsulation dot1Q 20\nRouter(config-subif)# ip address 192.168.20.1 255.255.255.0</code></pre><table>\n<thead>\n<tr>\n<th>Підхід</th>\n<th>Як реалізовано</th>\n<th>Де застосовують</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔀 Router-on-a-stick</td>\n<td>Один trunk і підінтерфейси на маршрутизаторі</td>\n<td>Малі та середні мережі</td>\n</tr>\n<tr>\n<td>🔲 Комутатор 3-го рівня</td>\n<td>Маршрутизація між SVI всередині самого комутатора</td>\n<td>Корпоративні мережі</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Підінтерфейс і тег</strong> <p>Команда <code>encapsulation dot1Q 10</code> означає: кадри з тегом VLAN 10 належать цьому підінтерфейсу. Адреса підінтерфейсу стає шлюзом за замовчуванням для всіх комп'ютерів VLAN 10.</p>\n</div>\n\n","<h1>🔐 VPN: приватна мережа поверх Інтернету</h1>\n<p><strong>Головна ідея:</strong> VLAN розділяє одну фізичну мережу на кілька логічних. Протилежна задача виникає, коли офіси або співробітники розкидані по світу: потрібно <strong>об'єднати</strong> віддалені частини в одну приватну мережу, не прокладаючи власних каналів.</p>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>VPN</strong> (Virtual Private Network / Віртуальна приватна мережа) - технологія побудови захищеної логічної мережі поверх іншої, зазвичай загальнодоступної мережі, такої як Інтернет.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Чому не просто Інтернет</strong> <p>Інтернет побудований на принципах відкритих систем: трафік проходить через десятки чужих маршрутизаторів. Без додаткового захисту дані можна перехопити, змінити або підмінити відправника. VPN усуває ці загрози, \"загортаючи\" трафік у зашифрований тунель.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[&quot \"node default  \" id=\"exp-1789461843807-11-0-flowchart-U-0\" data-look=\"neo\" transform=\"translate(88, 48)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 Віддалений<br>користувач</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843807-11-0-flowchart-I-1\" data-look=\"neo\" transform=\"translate(395.859375, 48)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🌐 Зовнішня<br>мережа</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843807-11-0-flowchart-S-3\" data-look=\"neo\" transform=\"translate(703.71875, 48)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🛡️ VPN-сервер</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843807-11-0-flowchart-N-5\" data-look=\"neo\" transform=\"translate(895.71875, 48)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏢 Внутрішня<br>мережа</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789461843807-11-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789461843807-11-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"info\"><strong>ℹ️ Тунелювання</strong> <p><strong>Тунелювання</strong> (tunneling) - інкапсуляція вихідного пакета в новий пакет, адресований VPN-серверу. Проміжні маршрутизатори Інтернету бачать лише зовнішній заголовок і не мають доступу до вмісту. На виході з тунелю сервер розпаковує пакет і передає його у внутрішню мережу.</p>\n</div>\n\n\n\n<h2>🔑 Три кроки підключення до VPN</h2>\n<table>\n<thead>\n<tr>\n<th>Крок</th>\n<th>Питання</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1️⃣ Ідентифікація</td>\n<td>Хто ти?</td>\n<td>Користувач вводить логін <code>a.kovalenko</code></td>\n</tr>\n<tr>\n<td>2️⃣ Автентифікація</td>\n<td>Доведи, що це справді ти</td>\n<td>Пароль, сертифікат, одноразовий код із застосунку</td>\n</tr>\n<tr>\n<td>3️⃣ Авторизація</td>\n<td>Що тобі дозволено?</td>\n<td>Доступ до файлового сервера, але не до бухгалтерії</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Сервер доступу</strong> <p>VPN-сервер підключений і до зовнішньої, і до внутрішньої мережі. Саме він виконує всі три кроки і лише після успішної авторизації пропускає користувача всередину.</p>\n</div>\n\n","<h1>🛡️ Захист інформації у VPN</h1>\n<p><strong>Головна ідея:</strong> Тунель сам по собі не захищає дані. Приватною мережу робить набір криптографічних механізмів, що працюють усередині тунелю.</p>\n<table>\n<thead>\n<tr>\n<th>Механізм</th>\n<th>Від якої загрози захищає</th>\n<th>Як працює</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔒 <strong>Шифрування</strong></td>\n<td>Перехоплення та читання даних</td>\n<td>Дані перетворюються так, що прочитати їх може лише власник ключа</td>\n</tr>\n<tr>\n<td>✅ <strong>Контроль цілісності</strong></td>\n<td>Підміна або спотворення даних у дорозі</td>\n<td>До кожного пакета додається криптографічний відбиток (хеш)</td>\n</tr>\n<tr>\n<td>🪪 <strong>Автентифікація</strong></td>\n<td>Підключення стороннього під чужим іменем</td>\n<td>Обидві сторони доводять свою справжність перед створенням тунелю</td>\n</tr>\n<tr>\n<td>🚪 <strong>Контроль доступу</strong></td>\n<td>Доступ до зайвих ресурсів</td>\n<td>Після входу користувач отримує лише дозволені йому ресурси</td>\n</tr>\n</tbody></table>\n<div class=\"success\"><strong>✅ Сучасні алгоритми</strong> <p>Шифрування: <strong>AES</strong> (зазвичай AES-256 у режимі GCM) та <strong>ChaCha20</strong>. Цілісність: хеш-функції сімейства <strong>SHA-2</strong>, наприклад SHA-256. Обмін ключами: протоколи на основі <strong>Діффі-Геллмана</strong>.</p>\n</div>\n\n\n\n\n\n<div class=\"danger\"><strong>🚫 Застарілі алгоритми</strong> <p><strong>DES</strong>, <strong>3DES</strong>, <strong>MD5</strong> та <strong>SHA-1</strong> ще трапляються у старих конфігураціях, але вважаються небезпечними: для них існують практичні атаки. У нових мережах їх не використовують.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Ціна захисту</strong> <p>Шифрування та додаткові заголовки тунелю збільшують обсяг переданих даних приблизно на 10-15% і потребують обчислювальної потужності. Для сучасного обладнання з апаратним прискоренням AES це навантаження малопомітне.</p>\n</div>\n\n","<h1>🗂️ Класифікація VPN за призначенням</h1>\n<p><strong>Головна ідея:</strong> Одна й та сама технологія тунелювання вирішує різні бізнес-задачі залежно від того, кого і з ким потрібно з'єднати.</p>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    VPN[&quot;🔐 VPN за&lt;br/&gt;призначенням&quot;] --&gt; RA[&quot;👤 Remote&lt;br/&gt;Access&quot;]\n    VPN --&gt; S2S[&quot;🏢 Site-to-Site&lt;br/&gt;Intranet&quot;]\n    VPN --&gt; EX[&quot;🤝 Extranet&quot;]\n    RA --&gt; RA1[&quot;Співробітник&lt;br/&gt;з дому&quot;]\n    S2S --&gt; S2S1[&quot;Філії однієї&lt;br/&gt;компанії&quot;]\n    EX --&gt; EX1[&quot;Партнери,&lt;br/&gt;клієнти&quot;]\n    style VPN fill:#e3f2fd,stroke:#1565c0\n    style RA fill:#e8f5e9,stroke:#388e3c\n    style S2S fill:#fff3e0,stroke:#ef6c00\n    style EX fill:#f3e5f5,stroke:#7b1fa2\"><svg id=\"exp-1789461843830-13-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 552px;\" viewBox=\"4 4 552 312\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789461843830-13-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789461843830-13-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789461843830-13-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789461843830-13-0 .error-icon{fill:#552222;}#exp-1789461843830-13-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789461843830-13-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789461843830-13-0 .edge-t "node default  \" id=\"exp-1789461843830-13-0-flowchart-S2S-3\" data-look=\"neo\" transform=\"translate(280, 160)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏢 Site-to-Site<br>Intranet</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843830-13-0-flowchart-EX-5\" data-look=\"neo\" transform=\"translate(472, 160)\"><rect class=\"basic label-container\" style=\"fill:#f3e5f5 !important;stroke:#7b1fa2 !important\" x=\"-76\" y=\"-24\" width=\"152\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -12)\"><rect></rect><foreignObject width=\"120\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🤝 Extranet</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843830-13-0-flowchart-RA1-7\" data-look=\"neo\" transform=\"translate(88, 272)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>Співробітник<br>з дому</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843830-13-0-flowchart-S2S1-9\" data-look=\"neo\" transform=\"translate(280, 272)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>Філії однієї<br>компанії</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789461843830-13-0-flowchart-EX1-11\" data-look=\"neo\" transform=\"translate(472, 272)\"><rect class=\"basic label-container\" style=\"\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>Партнери,<br>клієнти</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789461843830-13-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789461843830-13-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Кого з'єднує</th>\n<th>Типовий приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>👤 <strong>Remote Access</strong></td>\n<td>Окремий пристрій і корпоративну мережу</td>\n<td>Співробітник з ноутбука в кафе працює з внутрішнім сервером</td>\n</tr>\n<tr>\n<td>🏢 <strong>Site-to-Site</strong></td>\n<td>Дві або більше мереж однієї організації</td>\n<td>Офіси в Києві та Львові працюють як одна мережа</td>\n</tr>\n<tr>\n<td>🤝 <strong>Extranet</strong></td>\n<td>Корпоративну мережу і сторонні організації</td>\n<td>Постачальник має доступ лише до системи замовлень</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Захищені та довірчі VPN</strong> <p>За типом середовища VPN поділяють на <strong>захищені</strong> (тунель через ненадійну мережу з обов'язковим шифруванням: IPsec, TLS) та <strong>довірчі</strong> (мережа провайдера вважається надійною, шифрування не використовується: MPLS). Довірчі VPN застосовують оператори зв'язку для розділення трафіку різних клієнтів у своїй магістралі.</p>\n</div>\n\n","<h1>📡 Протоколи VPN</h1>\n<p><strong>Головна ідея:</strong> Протокол VPN визначає, як створюється тунель, як домовляються про ключі та як захищаються пакети. Вибір протоколу впливає на безпеку, швидкість і сумісність.</p>\n<table>\n<thead>\n<tr>\n<th>Протокол</th>\n<th>Рівень OSI</th>\n<th>Особливості</th>\n<th>Стан</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔒 <strong>IPsec</strong></td>\n<td>Мережевий</td>\n<td>Набір стандартів для захисту IP-пакетів; основа site-to-site VPN</td>\n<td>✅ Галузевий стандарт</td>\n</tr>\n<tr>\n<td>🔒 <strong>L2TP/IPsec</strong></td>\n<td>Канальний + IPsec</td>\n<td>L2TP створює тунель, IPsec його шифрує</td>\n<td>✅ Широко підтримується</td>\n</tr>\n<tr>\n<td>🌐 <strong>OpenVPN</strong></td>\n<td>Прикладний</td>\n<td>Відкритий код, працює поверх TLS, проходить через більшість фаєрволів</td>\n<td>✅ Популярний</td>\n</tr>\n<tr>\n<td>⚡ <strong>WireGuard</strong></td>\n<td>Мережевий</td>\n<td>Мінімальний код, сучасна криптографія, висока швидкість, вбудований у ядро Linux</td>\n<td>✅ Сучасний вибір</td>\n</tr>\n<tr>\n<td>⚠️ <strong>PPTP</strong></td>\n<td>Канальний</td>\n<td>Один із перших протоколів, простий у налаштуванні</td>\n<td>❌ Зламаний, застарілий</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Про PPTP</strong> <p>PPTP досі трапляється у старих посібниках, але його механізми автентифікації та шифрування практично зламані: пароль можна відновити з перехопленого трафіку. Сучасні операційні системи або відключили його підтримку, або попереджають про небезпеку.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Що обрати на практиці</strong> <p>Для з'єднання офісів між маршрутизаторами: <strong>IPsec</strong>. Для віддалених співробітників: <strong>WireGuard</strong> або <strong>OpenVPN</strong>. L2TP/IPsec залишається варіантом, коли потрібна вбудована підтримка без додаткового програмного забезпечення.</p>\n</div>\n\n","<h1>⚖️ Переваги та недоліки VPN</h1>\n<p><strong>Головна ідея:</strong> VPN дає захищений канал за ціною звичайного доступу до Інтернету, але потребує обчислювальних ресурсів і грамотного налаштування.</p>\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Захищений канал у рази дешевший за виділену лінію між офісами</td>\n<td>Додаткові 10-15% обсягу трафіку через шифрування та заголовки</td>\n</tr>\n<tr>\n<td>Не потрібно змінювати топологію мережі чи переписувати програми</td>\n<td>Навантаження на процесор пристроїв на кінцях тунелю</td>\n</tr>\n<tr>\n<td>Легко масштабується: нова філія - новий тунель</td>\n<td>Обладнання різних виробників не завжди сумісне між собою</td>\n</tr>\n<tr>\n<td>Приховує реальну IP-адресу користувача від зовнішньої мережі</td>\n<td>Помилки в налаштуванні знижують швидкість або відкривають діру</td>\n</tr>\n<tr>\n<td>Безпечна робота через відкриті Wi-Fi мережі</td>\n<td>Уся безпека залежить від захищеності VPN-сервера та ключів</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Реалізація VPN</strong> <p><strong>Апаратна</strong>: спеціалізований пристрій із прискоренням шифрування, найвища продуктивність. <strong>Програмна</strong>: сервер або ПК зі спеціальним ПЗ, найгнучкіша та найдешевша. <strong>Інтегрована</strong>: VPN як функція міжмережевого екрана або маршрутизатора, найпоширеніша в малому та середньому бізнесі.</p>\n</div>\n\n\n\n\n\n<div class=\"danger\"><strong>🚫 Поширена помилка</strong> <p>VPN захищає дані <strong>в дорозі</strong>, але не від зараженого пристрою на одному з кінців тунелю. Ноутбук із вірусом, підключений через VPN, отримує такий самий доступ до внутрішньої мережі, як і будь-який офісний комп'ютер.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> <ol>\n<li><strong>VLAN</strong> логічно розділяє одну фізичну мережу на кілька широкомовних доменів засобами комутатора канального рівня</li>\n<li><strong>VLAN ID</strong> займає 12 біт; на практиці працюють у діапазоні 2 - 1001, а VLAN 1 не використовують для користувацького трафіку</li>\n<li><strong>IEEE 802.1Q</strong> додає до кадру 4-байтний тег із номером VLAN; тег ставить і знімає комутатор, кінцеві пристрої його не бачать</li>\n<li><strong>Access-порт</strong> обслуговує одну VLAN без тегів, <strong>trunk-порт</strong> передає кілька VLAN з тегами; <strong>native VLAN</strong> на trunk іде без тегу</li>\n<li>Для обміну між VLAN потрібен пристрій мережевого рівня: <strong>router-on-a-stick</strong> або комутатор 3-го рівня</li>\n<li><strong>VPN</strong> вирішує зворотну задачу: об'єднує віддалені мережі та користувачів у приватну мережу поверх Інтернету через зашифрований тунель</li>\n<li>Безпеку VPN забезпечують <strong>шифрування, контроль цілісності, автентифікація та контроль доступу</strong>; сучасні протоколи: IPsec, OpenVPN, WireGuard</li>\n</ol>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Одне слово, два масштаби</strong> <p>\"Віртуальна мережа\" у назві лекції означає різне для VLAN і VPN: VLAN віртуалізує комутатор, VPN віртуалізує канал зв'язку. Спільна ідея: логічна структура мережі не зобов'язана повторювати фізичну.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 Що таке <strong>VLAN</strong> і на якому рівні моделі OSI працює ця технологія? Які проблеми \"плоскої\" мережі вона вирішує?</p>\n</li>\n<li><p>🤔 Чому теоретична межа 4096 VLAN на практиці перетворюється на <strong>4094</strong>? Чому VLAN 1 не використовують для користувачів?</p>\n</li>\n<li><p>🤔 Що додає до кадру стандарт <strong>IEEE 802.1Q</strong> і хто саме додає та знімає цей тег?</p>\n</li>\n<li><p>🤔 Чим відрізняються <strong>access-порт</strong> і <strong>trunk-порт</strong>? Що таке native VLAN і чому вона має збігатися на обох кінцях з'єднання?</p>\n</li>\n<li><p>🤔 Якими командами Cisco IOS створюється VLAN, призначається порт доступу і налаштовується магістраль?</p>\n</li>\n<li><p>🤔 Що таке <strong>router-on-a-stick</strong> і навіщо на маршрутизаторі створюють підінтерфейси?</p>\n</li>\n<li><p>🤔 Що таке <strong>VPN</strong>, з яких частин складається і чим відрізняється від VLAN?</p>\n</li>\n<li><p>🤔 Які чотири механізми захисту інформації використовує VPN? Чому PPTP не варто застосовувати?</p>\n</li>\n</ol>\n","<h1>📖 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Віртуальна локальна мережа</td>\n<td>Virtual LAN</td>\n<td>Логічна група пристроїв з власним широкомовним доменом на одному комутаторі</td>\n</tr>\n<tr>\n<td>Широкомовний домен</td>\n<td>Broadcast domain</td>\n<td>Множина пристроїв, що отримують один широкомовний кадр</td>\n</tr>\n<tr>\n<td>Тегування</td>\n<td>Tagging</td>\n<td>Додавання до кадру Ethernet мітки з номером VLAN</td>\n</tr>\n<tr>\n<td>Порт доступу</td>\n<td>Access port</td>\n<td>Порт, що належить одній VLAN і передає кадри без тегу</td>\n</tr>\n<tr>\n<td>Магістральний порт</td>\n<td>Trunk port</td>\n<td>Порт, що передає тегований трафік кількох VLAN</td>\n</tr>\n<tr>\n<td>Native VLAN</td>\n<td>Native VLAN</td>\n<td>VLAN, кадри якої проходять через trunk без тегу</td>\n</tr>\n<tr>\n<td>Підінтерфейс</td>\n<td>Subinterface</td>\n<td>Логічний інтерфейс маршрутизатора, прив'язаний до однієї VLAN</td>\n</tr>\n<tr>\n<td>Маршрутизація між VLAN</td>\n<td>Inter-VLAN routing</td>\n<td>Передача трафіку між VLAN через пристрій мережевого рівня</td>\n</tr>\n<tr>\n<td>Віртуальна приватна мережа</td>\n<td>Virtual Private Network</td>\n<td>Захищена логічна мережа, побудована поверх загальнодоступної</td>\n</tr>\n<tr>\n<td>Тунелювання</td>\n<td>Tunneling</td>\n<td>Інкапсуляція пакета в інший пакет для передачі через проміжну мережу</td>\n</tr>\n<tr>\n<td>Автентифікація</td>\n<td>Authentication</td>\n<td>Перевірка справжності користувача або пристрою</td>\n</tr>\n<tr>\n<td>Авторизація</td>\n<td>Authorization</td>\n<td>Визначення прав доступу після успішної автентифікації</td>\n</tr>\n<tr>\n<td>Шифрування</td>\n<td>Encryption</td>\n<td>Перетворення даних у форму, яку можна прочитати лише з ключем</td>\n</tr>\n<tr>\n<td>Контроль цілісності</td>\n<td>Integrity check</td>\n<td>Перевірка, що дані не були змінені під час передачі</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>VLAN</td>\n<td>Virtual Local Area Network</td>\n<td>Віртуальна локальна мережа</td>\n</tr>\n<tr>\n<td>VPN</td>\n<td>Virtual Private Network</td>\n<td>Віртуальна приватна мережа</td>\n</tr>\n<tr>\n<td>VID</td>\n<td>VLAN Identifier</td>\n<td>Ідентифікатор VLAN</td>\n</tr>\n<tr>\n<td>TPID</td>\n<td>Tag Protocol Identifier</td>\n<td>Ідентифікатор протоколу тегу</td>\n</tr>\n<tr>\n<td>TCI</td>\n<td>Tag Control Information</td>\n<td>Контрольна інформація тегу</td>\n</tr>\n<tr>\n<td>PCP</td>\n<td>Priority Code Point</td>\n<td>Код пріоритету кадру</td>\n</tr>\n<tr>\n<td>DEI</td>\n<td>Drop Eligible Indicator</td>\n<td>Індикатор можливості відкидання кадру</td>\n</tr>\n<tr>\n<td>QoS</td>\n<td>Quality of Service</td>\n<td>Якість обслуговування</td>\n</tr>\n<tr>\n<td>SVI</td>\n<td>Switched Virtual Interface</td>\n<td>Віртуальний інтерфейс комутатора</td>\n</tr>\n<tr>\n<td>IOS</td>\n<td>Internetwork Operating System</td>\n<td>Мережева операційна система Cisco</td>\n</tr>\n<tr>\n<td>IPsec</td>\n<td>Internet Protocol Security</td>\n<td>Набір протоколів захисту IP-пакетів</td>\n</tr>\n<tr>\n<td>L2TP</td>\n<td>Layer 2 Tunneling Protocol</td>\n<td>Протокол тунелювання канального рівня</td>\n</tr>\n<tr>\n<td>PPTP</td>\n<td>Point-to-Point Tunneling Protocol</td>\n<td>Протокол тунелювання \"точка-точка\"</td>\n</tr>\n<tr>\n<td>TLS</td>\n<td>Transport Layer Security</td>\n<td>Захист транспортного рівня</td>\n</tr>\n<tr>\n<td>MPLS</td>\n<td>Multiprotocol Label Switching</td>\n<td>Багатопротокольна комутація за мітками</td>\n</tr>\n<tr>\n<td>AES</td>\n<td>Advanced Encryption Standard</td>\n<td>Стандарт симетричного шифрування</td>\n</tr>\n<tr>\n<td>SHA</td>\n<td>Secure Hash Algorithm</td>\n<td>Криптографічна хеш-функція</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
