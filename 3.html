\" style=\"\" transform=\"translate(-92.15625, -12)\"><rect></rect><foreignObject width=\"184.3125\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🟡 Одномодове волокно</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758550529-3-0-flowchart-I-15\" data-look=\"classic\" transform=\"translate(882.3203125, 374)\"><rect class=\"basic label-container\" style=\"\" x=\"-121.484375\" y=\"-24\" width=\"242.96875\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-97.484375, -12)\"><rect></rect><foreignObject width=\"194.96875\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>🟠 Багатомодове волокно</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758550529-3-0-flowchart-J-17\" data-look=\"classic\" transform=\"translate(952.609375, 264)\"><rect class=\"basic label-container\" style=\"\" x=\"-73.9296875\" y=\"-24\" width=\"147.859375\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-49.9296875, -12)\"><rect></rect><foreignObject width=\"99.859375\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>📻 Радіохвилі</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758550529-3-0-flowchart-K-19\" data-look=\"classic\" transform=\"translate(1200.5390625, 264)\"><rect class=\"basic label-container\" style=\"\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>🔴 Інфрачервоне випромінювання</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758550529-3-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758550529-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"info\"><strong>ℹ️ Мідні кабелі бувають двох типів</strong> <p><strong>Симетричні</strong>: обидва провідники однакові й рівноправні (вита пара).<br><strong>Асиметричні</strong>: центральна жила та зовнішній екран мають різну будову й роль (коаксіальний кабель).</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Практичний орієнтир</strong> <p>Провідні середовища дають стабільність, високу швидкість і захист від сторонніх, безпровідні дають мобільність і швидке розгортання без прокладання кабелів. У реальних мережах їх майже завжди поєднують.</p>\n</div>\n\n","<h1>🔗 Вита пара (Twisted Pair)</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Вита пара</strong> - кабель, що складається з однієї або кількох пар ізольованих мідних провідників, скручених між собою з певним кроком і вміщених у спільну пластикову оболонку. У мережевих кабелях зазвичай 4 пари.</p>\n</div>\n\n\n\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/c/cb/UTP_cable.jpg\" alt=\"Кабель вита пара з чотирма скрученими парами\"></p>\n<p><em>Неекранована вита пара: чотири пари провідників у спільній оболонці</em></p>\n<p><strong>Чому провідники скручують:</strong> зовнішня електромагнітна перешкода наводить у двох скручених провідниках майже однаковий сигнал. Приймач порівнює провідники між собою і відкидає те, що в них спільне, тобто саму перешкоду. Скручування також зменшує взаємний вплив сусідніх пар (перехресні завади).</p>\n<table>\n<thead>\n<tr>\n<th>Компонент</th>\n<th>Призначення</th>\n<th>Матеріали</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔵 <strong>Провідники</strong></td>\n<td>Передача електричного сигналу</td>\n<td>Мідь, діаметр 0,4-0,6 мм</td>\n</tr>\n<tr>\n<td>🟡 <strong>Ізоляція жил</strong></td>\n<td>Захист від замикання, кольорове маркування</td>\n<td>Полівінілхлорид, поліетилен</td>\n</tr>\n<tr>\n<td>✂️ <strong>Розривна нитка</strong></td>\n<td>Розкриття оболонки без пошкодження жил</td>\n<td>Капрон</td>\n</tr>\n<tr>\n<td>⚪ <strong>Оболонка</strong></td>\n<td>Механічний захист, вогнестійкість</td>\n<td>PVC (у приміщенні), PE (на вулиці)</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Історичний факт</strong> <p>Виту пару запатентував Александр Грем Белл у 1881 році для телефонних ліній, і вже до 1900 року вся телефонна мережа США використовувала скручені провідники для захисту від перешкод.</p>\n</div>\n\n","<h1>🛡️ Екранування витої пари</h1>\n<p><strong>Головна ідея:</strong> Скручування захищає від слабких перешкод. Там, де перешкоди сильні (виробництво, силові кабелі поруч), додають металевий екран: фольгу або обплетення.</p>\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/f/fe/U-UTP_twisted_pair_cable_shielding.svg\" alt=\"Неекранована вита пара U/UTP\"></p>\n<p><em>U/UTP: екрана немає, лише скручені пари в оболонці</em></p>\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/5/5c/F-UTP_twisted_pair_cable_shielding.svg\" alt=\"Вита пара із загальним екраном з фольги F/UTP\"></p>\n<p><em>F/UTP: усі пари обгорнуті спільним екраном з фольги</em></p>\n<div class=\"info\"><strong>ℹ️ Позначення за ISO/IEC 11801</strong> <p>Формат <strong>X/YTP</strong>: перша літера описує загальний екран кабелю, друга - екран кожної пари. <strong>U</strong> - без екрана, <strong>F</strong> - фольга, <strong>S</strong> - обплетення.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Позначення</th>\n<th>Загальний екран</th>\n<th>Екран кожної пари</th>\n<th>Типове застосування</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>U/UTP</strong></td>\n<td>❌ Немає</td>\n<td>❌ Немає</td>\n<td>🏠 Офіси, житло, більшість LAN</td>\n</tr>\n<tr>\n<td><strong>F/UTP</strong></td>\n<td>✅ Фольга</td>\n<td>❌ Немає</td>\n<td>🏭 Приміщення з підвищеними завадами</td>\n</tr>\n<tr>\n<td><strong>U/FTP</strong></td>\n<td>❌ Немає</td>\n<td>✅ Фольга</td>\n<td>🖥️ Захист від перехресних завад</td>\n</tr>\n<tr>\n<td><strong>S/FTP</strong></td>\n<td>✅ Обплетення</td>\n<td>✅ Фольга</td>\n<td>🏢 Дата-центри, Cat 7 і вище</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Типова помилка</strong> <p>Екранований кабель захищає лише тоді, коли екран заземлено з боку обладнання. Незаземлений екран працює як антена і може погіршити ситуацію.</p>\n</div>\n\n","<h1>📊 Категорії витої пари</h1>\n<div class=\"info\"><strong>ℹ️ Що таке категорія</strong> <p><strong>Категорія</strong> визначає, до якої частоти кабель гарантовано передає сигнал без надмірних втрат, і, відповідно, яку швидкість мережі він підтримує. Вища категорія означає більше витків на одиницю довжини, якіснішу ізоляцію та жорсткіші вимоги до тестування.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Категорія</th>\n<th>Частота</th>\n<th>Швидкість</th>\n<th>Стан і застосування</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>Cat 3</strong></td>\n<td>16 МГц</td>\n<td>10 Мбіт/с</td>\n<td>📞 Застаріла, лише телефонія</td>\n</tr>\n<tr>\n<td><strong>Cat 5</strong></td>\n<td>100 МГц</td>\n<td>100 Мбіт/с</td>\n<td>⚠️ Застаріла, замінена на Cat 5e</td>\n</tr>\n<tr>\n<td><strong>Cat 5e</strong></td>\n<td>100 МГц</td>\n<td>1 Гбіт/с</td>\n<td>✅ Масово поширена у діючих мережах</td>\n</tr>\n<tr>\n<td><strong>Cat 6</strong></td>\n<td>250 МГц</td>\n<td>1 Гбіт/с, 10 Гбіт/с до 55 м</td>\n<td>✅ Стандарт для нових офісних мереж</td>\n</tr>\n<tr>\n<td><strong>Cat 6a</strong></td>\n<td>500 МГц</td>\n<td>10 Гбіт/с до 100 м</td>\n<td>✅ Оптимальний вибір для нових інсталяцій</td>\n</tr>\n<tr>\n<td><strong>Cat 7</strong></td>\n<td>600 МГц</td>\n<td>10 Гбіт/с</td>\n<td>🏭 Завжди екранована, потребує спецроз'ємів</td>\n</tr>\n<tr>\n<td><strong>Cat 8</strong></td>\n<td>2000 МГц</td>\n<td>25-40 Гбіт/с до 30 м</td>\n<td>🖥️ Короткі з'єднання у дата-центрах</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Обмеження довжини</strong> <p>Для будь-якої категорії максимальна довжина сегмента Ethernet на витій парі становить <strong>100 м</strong> (90 м стаціонарної лінії плюс 10 м патч-кордів). Далі сигнал загасає настільки, що потрібен комутатор або перехід на оптику.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Рекомендація</strong> <p>Кабель прокладають на 10-15 років, а обладнання змінюють частіше. Тому для нових об'єктів обирають Cat 6a: вона підтримує 10 Гбіт/с на повні 100 м і живлення пристроїв через кабель (PoE).</p>\n</div>\n\n","<h1>🔌 Роз'єм RJ-45 та схеми T568A і T568B</h1>\n<div class=\"info\"><strong>ℹ️ Стандарт</strong> <p><strong>RJ-45</strong> (технічно правильна назва 8P8C: 8 позицій, 8 контактів) - модульний роз'єм для підключення витої пари в мережах Ethernet. Порядок кольорів жил на контактах визначає стандарт ANSI/TIA-568.</p>\n</div>\n\n\n\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/e/ea/RJ-45_TIA-568A_Left.svg\" alt=\"Схема розкладки T568A\"></p>\n<p><em>T568A: контакти 1-2 зелена пара, 3-6 помаранчева пара</em></p>\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/9/9a/RJ-45_TIA-568B_Left.svg\" alt=\"Схема розкладки T568B\"></p>\n<p><em>T568B: контакти 1-2 помаранчева пара, 3-6 зелена пара</em></p>\n<table>\n<thead>\n<tr>\n<th>Контакт</th>\n<th>T568A</th>\n<th>T568B</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>біло-зелений</td>\n<td>біло-помаранчевий</td>\n</tr>\n<tr>\n<td>2</td>\n<td>зелений</td>\n<td>помаранчевий</td>\n</tr>\n<tr>\n<td>3</td>\n<td>біло-помаранчевий</td>\n<td>біло-зелений</td>\n</tr>\n<tr>\n<td>4</td>\n<td>синій</td>\n<td>синій</td>\n</tr>\n<tr>\n<td>5</td>\n<td>біло-синій</td>\n<td>біло-синій</td>\n</tr>\n<tr>\n<td>6</td>\n<td>помаранчевий</td>\n<td>зелений</td>\n</tr>\n<tr>\n<td>7</td>\n<td>біло-коричневий</td>\n<td>біло-коричневий</td>\n</tr>\n<tr>\n<td>8</td>\n<td>коричневий</td>\n<td>коричневий</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Правило</strong> <p>Схеми відрізняються лише тим, що зелена та помаранчева пари поміняні місцями. Однакова схема з обох кінців дає <strong>прямий</strong> кабель, різні схеми дають <strong>перехресний</strong> (crossover). Сучасне обладнання самостійно визначає тип кабелю (Auto MDI-X), тому на практиці використовують прямий кабель за схемою T568B.</p>\n</div>\n\n","<h1>📺 Коаксіальний кабель</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Коаксіальний кабель</strong> (Coaxial Cable) - асиметричний кабель, у якому центральна жила, діелектрик, екран та зовнішня оболонка розташовані на спільній осі (co-axial = співвісний).</p>\n</div>\n\n\n\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/f/f4/Coaxial_cable_cutaway.svg\" alt=\"Будова коаксіального кабелю в розрізі\"></p>\n<p><em>A: зовнішня оболонка, B: екран з мідного обплетення, C: діелектрик, D: центральна жила</em></p>\n<p><strong>Головна ідея:</strong> Екран повністю оточує центральну жилу, тому сигнал усередині захищений від зовнішніх перешкод, а сам кабель майже не випромінює назовні.</p>\n<table>\n<thead>\n<tr>\n<th>Шар</th>\n<th>Матеріал</th>\n<th>Роль</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔴 Центральна жила</td>\n<td>Мідь або сталь, плакована міддю</td>\n<td>Передача сигналу</td>\n</tr>\n<tr>\n<td>⚪ Діелектрик</td>\n<td>Спінений поліетилен</td>\n<td>Тримає жилу в центрі, ізолює</td>\n</tr>\n<tr>\n<td>🛡️ Екран</td>\n<td>Алюмінієва фольга та мідне обплетення</td>\n<td>Захист від перешкод, зворотний провідник</td>\n</tr>\n<tr>\n<td>⚫ Зовнішня оболонка</td>\n<td>Поліетилен або полівінілхлорид</td>\n<td>Механічний захист</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Ключова характеристика</strong> <p><strong>Хвильовий опір</strong> (імпеданс) кабелю має відповідати обладнанню: для комп'ютерних мереж використовували кабель 50 Ом, для телебачення та відеоспостереження застосовують 75 Ом.</p>\n</div>\n\n","<h1>📺 Коаксіальний кабель: типи, оцінка, застосування</h1>\n<table>\n<thead>\n<tr>\n<th>Параметр</th>\n<th>Тонкий (Thin, 10BASE2)</th>\n<th>Товстий (Thick, 10BASE5)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📏 Діаметр</td>\n<td>близько 5 мм</td>\n<td>близько 10 мм</td>\n</tr>\n<tr>\n<td>📐 Макс. сегмент</td>\n<td>185 м</td>\n<td>500 м</td>\n</tr>\n<tr>\n<td>⚡ Швидкість</td>\n<td>10 Мбіт/с</td>\n<td>10 Мбіт/с</td>\n</tr>\n<tr>\n<td>🔧 Гнучкість</td>\n<td>Висока</td>\n<td>Низька, важкий монтаж</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Ефективне екранування, велика дальність</td>\n<td>Низька швидкість для сучасних локальних мереж</td>\n</tr>\n<tr>\n<td>Механічна міцність</td>\n<td>Дорогі роз'єми та перехідники</td>\n</tr>\n<tr>\n<td>Не потребує складних інструментів для монтажу</td>\n<td>Обрив у будь-якій точці шини зупиняє всю мережу</td>\n</tr>\n<tr>\n<td></td>\n<td>Мережеві карти та комутатори більше не випускаються</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Історичний контекст</strong> <p>Коаксіальний кабель був основою перших мереж Ethernet у 1980-х: усі комп'ютери підключалися до одного кабелю (топологія \"шина\"). З появою витої пари та комутаторів цей підхід повністю витіснено.</p>\n</div>\n\n\n\n\n\n<div class=\"success\"><strong>✅ Де коаксіал живе сьогодні</strong> <p>Кабельне телебачення, відеоспостереження, антенні лінії, а також <strong>кабельний Інтернет</strong> за стандартом DOCSIS, який по звичайному телевізійному коаксіалу забезпечує швидкості в гігабіти на секунду. У комп'ютерних мережах усередині будівель він не застосовується.</p>\n</div>\n\n","<h1>💎 Оптичне волокно: принцип роботи</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Оптичне волокно</strong> (Optical Fiber) - тонка нитка з оптично прозорого матеріалу (кварцове скло або полімер), яка переносить інформацію у вигляді світлових імпульсів завдяки <strong>повному внутрішньому відбиттю</strong>.</p>\n</div>\n\n\n\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/0/02/Optical_fiber_cable.jpg\" alt=\"Волоконно-оптичний кабель із виведеними волокнами\"></p>\n<p><em>Волоконно-оптичний кабель: кілька волокон у захисній оболонці</em></p>\n<p><strong>Головна ідея:</strong> Волокно має дві зони: серцевину та оболонку з дещо меншим показником заломлення. Світло, що падає на межу серцевини й оболонки під пологим кутом, повністю відбивається назад у серцевину і рухається вздовж волокна, не виходячи назовні.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[💡 Лазер або світлодіод] --&gt;|Світловий імпульс| B[🔵 Серцевина волокна]\n    B --&gt;|Повне внутрішнє відбиття| B\n    B --&gt; C[📥 Фотодетектор]\n    C --&gt; D[💻 Електричний сигнал]\n    style A fill:#fff9c4,stroke:#f9a825\n    style B fill:#e3f2fd,stroke:#1565c0\n    style C fill:#e8f5e9,stroke:#388e3c\n    style D fill:#f3e5f5,stroke:#7b1fa2\"><svg id=\"exp-1788758550553-10-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1356.6953125px;\" viewBox=\"0 11.19711685180664 1356.6953125 141.8778839111328\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788758550553-10-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788758550553-10-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke \"translate(0, 0)\"><rect></rect><foreignObject width=\"0\" height=\"0\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 10px; text-align: center;\"><span class=\"nodeLabel \"></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758550553-10-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758550553-10-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Класифікація</th>\n<th>Варіанти</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🧪 Матеріал волокна</td>\n<td>Скляне (GOF), пластикове (POF)</td>\n</tr>\n<tr>\n<td>📍 Місце монтажу</td>\n<td>Внутрішній (будівлі, дата-центри), зовнішній (ґрунт, повітря, вода)</td>\n</tr>\n<tr>\n<td>🛡️ Умови прокладання</td>\n<td>Підвісний з тросом, броньований для ґрунту, підводний багатошаровий</td>\n</tr>\n</tbody></table>\n","<h1>💎 Одномодове та багатомодове волокно</h1>\n<div class=\"info\"><strong>ℹ️ Мода</strong> <p><strong>Мода</strong> - окремий шлях (траєкторія), яким світло може поширюватися у волокні. Кількість мод залежить від діаметра серцевини.</p>\n</div>\n\n\n\n<p><img src=\"https://upload.wikimedia.org/wikipedia/commons/0/0e/Optical_fiber_types.svg\" alt=\"Типи оптичного волокна: багатомодове ступінчасте, багатомодове градієнтне, одномодове\"></p>\n<p><em>Зверху вниз: багатомодове ступінчасте, багатомодове градієнтне, одномодове волокно. Ліворуч показано профіль показника заломлення</em></p>\n<table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>🟡 Одномодове (SMF)</th>\n<th>🟠 Багатомодове (MMF)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📏 Діаметр серцевини</td>\n<td>8-10 мкм</td>\n<td>50 мкм (Європа), 62,5 мкм (США)</td>\n</tr>\n<tr>\n<td>🌈 Кількість мод</td>\n<td>Одна</td>\n<td>Багато, кожна під своїм кутом</td>\n</tr>\n<tr>\n<td>⏱️ Дисперсія</td>\n<td>Міжмодової немає</td>\n<td>Імпульс розмивається на відстані</td>\n</tr>\n<tr>\n<td>📐 Дальність</td>\n<td>Десятки кілометрів</td>\n<td>Сотні метрів, до 2 км</td>\n</tr>\n<tr>\n<td>💡 Джерело світла</td>\n<td>Лазер</td>\n<td>Світлодіод або дешевий лазер VCSEL</td>\n</tr>\n<tr>\n<td>💰 Вартість обладнання</td>\n<td>Вища</td>\n<td>Нижча</td>\n</tr>\n<tr>\n<td>🎨 Колір оболонки</td>\n<td>Жовтий</td>\n<td>Помаранчевий або аквамариновий</td>\n</tr>\n<tr>\n<td>📍 Застосування</td>\n<td>Магістралі, міжміські лінії</td>\n<td>Усередині будівель, дата-центри</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Два різновиди багатомодового волокна</strong> <p>У <strong>ступінчастому</strong> волокні показник заломлення змінюється різко на межі серцевини й оболонки, тому моди приходять із помітною різницею в часі. У <strong>градієнтному</strong> волокні показник плавно зростає до центру: промені, що йдуть довшим шляхом, рухаються швидше, і дисперсія значно менша. Саме градієнтне волокно використовують у мережах.</p>\n</div>\n\n","<h1>💎 Оптоволокно: переваги, недоліки, роль у мережах</h1>\n<table>\n<thead>\n<tr>\n<th>✅ Переваги</th>\n<th>❌ Недоліки</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Пропускна здатність у сотні гігабіт на одне волокно</td>\n<td>Крихкість: надмірний вигин руйнує волокно</td>\n</tr>\n<tr>\n<td>Повна нечутливість до електромагнітних перешкод</td>\n<td>Складний монтаж: зварювання волокон спецобладнанням</td>\n</tr>\n<tr>\n<td>Волокна в кабелі не впливають одне на одне</td>\n<td>Ремонт лінії важчий і дорожчий, ніж для міді</td>\n</tr>\n<tr>\n<td>Захищеність: підключитися непомітно майже неможливо</td>\n<td>Кожне з'єднання додає загасання</td>\n</tr>\n<tr>\n<td>Десятки кілометрів без підсилювачів</td>\n<td>Вартість активного обладнання вища за мідне</td>\n</tr>\n<tr>\n<td>Не проводить струм: безпечно у вибухонебезпечних зонах</td>\n<td></td>\n</tr>\n</tbody></table>\n<p><strong>Головна ідея:</strong> Оптика виграє там, де потрібна відстань, швидкість або захист від перешкод, мідь виграє там, де потрібна дешевизна й простота підключення кінцевих пристроїв.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🌍 Магістраль провайдера] --&gt;|Одномодове волокно| B[🏢 Будівля]\n    B --&gt;|Багатомодове волокно| C[🏬 Поверх]\n    C --&gt;|Вита пара до 100 м| D[💻 Робоче місце]\n    style A fill:#fff9c4,stroke:#f9a825\n    style B fill:#fff3e0,stroke:#ef6c00\n    style C fill:#e3f2fd,stroke:#1565c0\n    style D fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1788758550566-12-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1330.375px;\" viewBox=\"0 0 1330.375 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1788758550566-12-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1788758550566-12-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1788758550566-12-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1788758550566-12-0 .error-icon{fill:#552222;}#exp-1788758550566-12-0 .error-text{fill:#552222;stroke:#552222;}#exp-1788758550566-12-0 .edge-thickness-normal{stroke-width:1px;}#exp-1788758550566-12-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1788758550566-12-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1788758550566-12-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1788758550566-12-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1788758550566-12-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1788758550566-12-0 .marker{fill:#333333;stroke:#33 </feDropShadow></filter></defs></svg></div>\n<div class=\"success\"><strong>✅ Типова структура сучасної мережі</strong> <p>Оптика на магістралях і між поверхами, вита пара на останніх 100 метрах до робочих місць, Wi-Fi для мобільних пристроїв. Кожне середовище працює там, де воно найефективніше.</p>\n</div>\n\n","<h1>📶 Безпровідні середовища передачі</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Безпровідна передача даних</strong> - обмін інформацією без фізичного каналу між пристроями за допомогою електромагнітних хвиль різних діапазонів.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Безпровідні мережі використовують три технології передачі, які відрізняються діапазоном хвиль і способом використання спектра.</p>\n<table>\n<thead>\n<tr>\n<th>Технологія</th>\n<th>Принцип</th>\n<th>Приклади</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔴 <strong>Інфрачервона</strong></td>\n<td>Світло, невидиме оку; потребує прямої видимості</td>\n<td>IrDA, пульти дистанційного керування</td>\n</tr>\n<tr>\n<td>📻 <strong>Вузькосмугова радіо</strong></td>\n<td>Одна фіксована частота, як у радіостанції</td>\n<td>Старі радіомодеми, LoRa</td>\n</tr>\n<tr>\n<td>📡 <strong>Широкосмугова радіо</strong></td>\n<td>Сигнал розподілено по широкій смузі частот або постійно змінює канал</td>\n<td>Wi-Fi, Bluetooth, 4G/5G</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[📶 Безпровідні технології] --&gt; B[📲 NFC до 10 см]\n    A --&gt; C[📱 Bluetooth до 100 м]\n    A --&gt; D[📡 Wi-Fi десятки метрів]\n    A --&gt; E[📱 Мобільні мережі 4G і 5G кілометри]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#f3e5f5,stroke:#7b1fa2\n    style C fill:#e8f5e9,stroke:#388e3c\n    style D fill:#fff9c4,stroke:#f9a825\n    style E fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1788758550577-13-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 1016.0625px;\" viewBox=\"0 0 1016.0625 186\" role=\"graphics-document ct></g></g><g class=\"node default  \" id=\"exp-1788758550577-13-0-flowchart-D-5\" data-look=\"classic\" transform=\"translate(597.26171875, 142)\"><rect class=\"basic label-container\" style=\"fill:#fff9c4 !important;stroke:#f9a825 !important\" x=\"-112.80078125\" y=\"-24\" width=\"225.6015625\" height=\"48\"></rect><g class=\"label\" style=\"\" transform=\"translate(-88.80078125, -12)\"><rect></rect><foreignObject width=\"177.6015625\" height=\"24\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;\"><span class=\"nodeLabel \"><p>📡 Wi-Fi десятки метрів</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1788758550577-13-0-flowchart-E-7\" data-look=\"classic\" transform=\"translate(884.0625, 142)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-124\" y=\"-36\" width=\"248\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-100, -24)\"><rect></rect><foreignObject width=\"200\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;\"><span class=\"nodeLabel \"><p>📱 Мобільні мережі 4G і 5G кілометри</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1788758550577-13-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1788758550577-13-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"warning\"><strong>⚠️ Ціна мобільності</strong> <p>Радіоефір спільний для всіх: пристрої ділять одну смугу частот, сигнал можна перехопити, а стіни, дощ і сусідні мережі знижують швидкість. Тому безпровідний канал завжди повільніший і менш стабільний, ніж кабель тієї ж епохи.</p>\n</div>\n\n","<h1>📶 Порівняння безпровідних технологій</h1>\n<table>\n<thead>\n<tr>\n<th>Технологія</th>\n<th>Стандарт</th>\n<th>Макс. швидкість</th>\n<th>Радіус дії</th>\n<th>Частоти</th>\n<th>Призначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🔴 <strong>IrDA</strong></td>\n<td>IrDA</td>\n<td>до 16 Мбіт/с</td>\n<td>до 1 м, пряма видимість</td>\n<td>Інфрачервоне світло</td>\n<td>📼 Застаріла, замінена Bluetooth</td>\n</tr>\n<tr>\n<td>📲 <strong>NFC</strong></td>\n<td>ISO 14443</td>\n<td>424 Кбіт/с</td>\n<td>до 10 см</td>\n<td>13,56 МГц</td>\n<td>💳 Безконтактна оплата, перепустки</td>\n</tr>\n<tr>\n<td>📱 <strong>Bluetooth 5</strong></td>\n<td>IEEE 802.15.1</td>\n<td>до 2 Мбіт/с (LE)</td>\n<td>10-100 м</td>\n<td>2,4 ГГц</td>\n<td>🎧 Периферія, аудіо, IoT</td>\n</tr>\n<tr>\n<td>📡 <strong>Wi-Fi 5</strong></td>\n<td>802.11ac</td>\n<td>до 6,9 Гбіт/с</td>\n<td>десятки метрів</td>\n<td>5 ГГц</td>\n<td>💻 Локальні мережі</td>\n</tr>\n<tr>\n<td>📡 <strong>Wi-Fi 6 / 6E</strong></td>\n<td>802.11ax</td>\n<td>до 9,6 Гбіт/с</td>\n<td>десятки метрів</td>\n<td>2,4 / 5 / 6 ГГц</td>\n<td>💻 Сучасний стандарт LAN</td>\n</tr>\n<tr>\n<td>📡 <strong>Wi-Fi 7</strong></td>\n<td>802.11be</td>\n<td>до 46 Гбіт/с</td>\n<td>десятки метрів</td>\n<td>2,4 / 5 / 6 ГГц</td>\n<td>💻 Найновіший стандарт</td>\n</tr>\n<tr>\n<td>🏢 <strong>WiMAX</strong></td>\n<td>802.16</td>\n<td>до 70 Мбіт/с</td>\n<td>до десятків км</td>\n<td>2-11 ГГц</td>\n<td>📼 Витіснена мережами 4G/5G</td>\n</tr>\n<tr>\n<td>📱 <strong>5G</strong></td>\n<td>3GPP</td>\n<td>одиниці Гбіт/с</td>\n<td>сотні метрів, кілометри</td>\n<td>0,6-40 ГГц</td>\n<td>🌍 Мобільний доступ</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Максимальна та реальна швидкість</strong> <p>Наведені значення - теоретичні максимуми стандарту. Реальна швидкість Wi-Fi зазвичай у 2-4 рази нижча через перешкоди, відстань, кількість клієнтів і можливості конкретного пристрою.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Як обирати</strong> <p><strong>NFC</strong> для ідентифікації та оплати, <strong>Bluetooth</strong> для підключення периферії з мінімальним енергоспоживанням, <strong>Wi-Fi</strong> для доступу до локальної мережі та Інтернету, <strong>4G/5G</strong> для мобільності поза межами будівлі.</p>\n</div>\n\n","<h1>⚖️ Порівняльний аналіз усіх середовищ</h1>\n<p><strong>Головна ідея:</strong> Універсального середовища не існує. Кожне оптимізує одні характеристики ціною інших.</p>\n<table>\n<thead>\n<tr>\n<th>Критерій</th>\n<th>🔗 Вита пара</th>\n<th>📺 Коаксіал</th>\n<th>💎 Оптоволокно</th>\n<th>📶 Безпровідні</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>💰 <strong>Вартість</strong></td>\n<td>Низька</td>\n<td>Середня</td>\n<td>Висока</td>\n<td>Низька за кабель, вища за обладнання</td>\n</tr>\n<tr>\n<td>⚡ <strong>Швидкість</strong></td>\n<td>до 40 Гбіт/с</td>\n<td>10 Мбіт/с у LAN</td>\n<td>сотні Гбіт/с</td>\n<td>до 46 Гбіт/с</td>\n</tr>\n<tr>\n<td>📏 <strong>Дальність</strong></td>\n<td>100 м</td>\n<td>до 500 м</td>\n<td>десятки км</td>\n<td>десятки метрів у приміщенні</td>\n</tr>\n<tr>\n<td>🛡️ <strong>Завадостійкість</strong></td>\n<td>Середня</td>\n<td>Висока</td>\n<td>Абсолютна</td>\n<td>Низька</td>\n</tr>\n<tr>\n<td>🔧 <strong>Монтаж</strong></td>\n<td>Простий</td>\n<td>Простий</td>\n<td>Складний</td>\n<td>Не потрібен</td>\n</tr>\n<tr>\n<td>🔒 <strong>Безпека</strong></td>\n<td>Середня</td>\n<td>Середня</td>\n<td>Висока</td>\n<td>Низька</td>\n</tr>\n<tr>\n<td>📱 <strong>Мобільність</strong></td>\n<td>Немає</td>\n<td>Немає</td>\n<td>Немає</td>\n<td>Повна</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ Рекомендації щодо вибору</strong> <ul>\n<li>🏠 <strong>Квартира, малий офіс</strong>: вита пара Cat 6 до стаціонарних пристроїв плюс Wi-Fi 6</li>\n<li>🏢 <strong>Офісна будівля</strong>: оптика між поверхами, Cat 6a до робочих місць</li>\n<li>🖥️ <strong>Дата-центр</strong>: одномодове й багатомодове волокно, Cat 8 на короткі з'єднання</li>\n<li>🌉 <strong>Між будівлями</strong>: оптоволокно; радіоміст лише коли прокласти кабель неможливо</li>\n<li>📹 <strong>Відеоспостереження</strong>: вита пара з живленням PoE, коаксіал у застарілих системах</li>\n</ul>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Що ми вивчили сьогодні</strong> <p><strong>📡 Середовище передачі</strong> - фізичний носій сигналу, який визначає швидкість, дальність, завадостійкість і вартість мережі.</p>\n<p><strong>🔗 Вита пара</strong> - основний кабель локальних мереж: скручування захищає від перешкод, категорія визначає швидкість, довжина сегмента обмежена 100 м, роз'єм RJ-45 обжимається за схемою T568A або T568B.</p>\n<p><strong>📺 Коаксіальний кабель</strong> - історична основа Ethernet, у локальних мережах застарів, але живе у телебаченні, відеоспостереженні та кабельному Інтернеті.</p>\n<p><strong>💎 Оптоволокно</strong> - передає світло за принципом повного внутрішнього відбиття; одномодове для магістралей на десятки кілометрів, багатомодове для будівель і дата-центрів.</p>\n<p><strong>📶 Безпровідні технології</strong> - дають мобільність ціною швидкості, стабільності та безпеки; Wi-Fi для доступу, Bluetooth для периферії, NFC для ідентифікації.</p>\n<p><strong>⚖️ Вибір середовища</strong> визначається відстанню, потрібною швидкістю, рівнем перешкод, вимогами до безпеки та бюджетом.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 Що таке <strong>середовище передачі даних</strong>? Назвіть три фізичні природи сигналів і наведіть приклад середовища для кожної.</p>\n</li>\n<li><p>🤔 Чому провідники у <strong>витій парі</strong> скручені? Що станеться, якщо їх розпрямити?</p>\n</li>\n<li><p>🤔 Розшифруйте позначення <strong>U/UTP</strong>, <strong>F/UTP</strong> та <strong>S/FTP</strong>. У яких умовах потрібен екранований кабель?</p>\n</li>\n<li><p>🤔 Чим відрізняються категорії <strong>Cat 5e</strong>, <strong>Cat 6</strong> і <strong>Cat 6a</strong>? Яка максимальна довжина сегмента для будь-якої з них?</p>\n</li>\n<li><p>🤔 Чим відрізняються схеми обжиму <strong>T568A</strong> і <strong>T568B</strong>? Коли кабель називають прямим, а коли перехресним?</p>\n</li>\n<li><p>🤔 Чому <strong>коаксіальний кабель</strong> більше не використовують у локальних мережах, але продовжують використовувати в інших галузях?</p>\n</li>\n<li><p>🤔 Поясніть принцип <strong>повного внутрішнього відбиття</strong>. Чим одномодове волокно відрізняється від багатомодового і де застосовується кожне?</p>\n</li>\n<li><p>🤔 Назвіть три переваги та три недоліки <strong>безпровідних середовищ</strong> порівняно з кабельними.</p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Середовище передачі даних</td>\n<td>Transmission Medium</td>\n<td>Фізична субстанція, по якій сигнал переноситься від передавача до приймача</td>\n</tr>\n<tr>\n<td>Вита пара</td>\n<td>Twisted Pair</td>\n<td>Кабель зі скручених пар ізольованих мідних провідників</td>\n</tr>\n<tr>\n<td>Перехресні завади</td>\n<td>Crosstalk</td>\n<td>Взаємний вплив сусідніх пар провідників у кабелі</td>\n</tr>\n<tr>\n<td>Екранування</td>\n<td>Shielding</td>\n<td>Металевий шар (фольга або обплетення), що захищає провідники від перешкод</td>\n</tr>\n<tr>\n<td>Категорія кабелю</td>\n<td>Cable Category</td>\n<td>Клас витої пари за гарантованою частотою та швидкістю передачі</td>\n</tr>\n<tr>\n<td>Прямий кабель</td>\n<td>Straight-through Cable</td>\n<td>Кабель з однаковою схемою обжиму на обох кінцях</td>\n</tr>\n<tr>\n<td>Перехресний кабель</td>\n<td>Crossover Cable</td>\n<td>Кабель зі схемами T568A і T568B на різних кінцях</td>\n</tr>\n<tr>\n<td>Коаксіальний кабель</td>\n<td>Coaxial Cable</td>\n<td>Асиметричний кабель із центральною жилою та співвісним екраном</td>\n</tr>\n<tr>\n<td>Хвильовий опір</td>\n<td>Characteristic Impedance</td>\n<td>Параметр кабелю, який має відповідати обладнанню (50 або 75 Ом)</td>\n</tr>\n<tr>\n<td>Оптичне волокно</td>\n<td>Optical Fiber</td>\n<td>Прозора нитка, що переносить світлові імпульси за принципом повного внутрішнього відбиття</td>\n</tr>\n<tr>\n<td>Мода</td>\n<td>Mode</td>\n<td>Окрема траєкторія поширення світла у волокні</td>\n</tr>\n<tr>\n<td>Дисперсія</td>\n<td>Dispersion</td>\n<td>Розмивання світлового імпульсу через різницю в часі проходження мод</td>\n</tr>\n<tr>\n<td>Одномодове волокно</td>\n<td>Single-Mode Fiber</td>\n<td>Волокно із серцевиною 8-10 мкм, що пропускає одну моду, для великих відстаней</td>\n</tr>\n<tr>\n<td>Багатомодове волокно</td>\n<td>Multi-Mode Fiber</td>\n<td>Волокно із серцевиною 50-62,5 мкм для коротких відстаней</td>\n</tr>\n<tr>\n<td>Загасання</td>\n<td>Attenuation</td>\n<td>Втрата потужності сигналу з відстанню</td>\n</tr>\n</tbody></table>\n","<h1>📝 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>UTP</td>\n<td>Unshielded Twisted Pair</td>\n<td>Неекранована вита пара</td>\n</tr>\n<tr>\n<td>FTP</td>\n<td>Foiled Twisted Pair</td>\n<td>Вита пара з екраном із фольги</td>\n</tr>\n<tr>\n<td>STP</td>\n<td>Shielded Twisted Pair</td>\n<td>Вита пара з екраном з обплетення</td>\n</tr>\n<tr>\n<td>PVC</td>\n<td>Polyvinyl Chloride</td>\n<td>Полівінілхлорид, матеріал оболонки для приміщень</td>\n</tr>\n<tr>\n<td>PE</td>\n<td>Polyethylene</td>\n<td>Поліетилен, матеріал оболонки для зовнішньої прокладки</td>\n</tr>\n<tr>\n<td>LSZH</td>\n<td>Low Smoke Zero Halogen</td>\n<td>Оболонка з низьким димовиділенням без галогенів</td>\n</tr>\n<tr>\n<td>RJ-45</td>\n<td>Registered Jack 45</td>\n<td>8-контактний роз'єм для витої пари</td>\n</tr>\n<tr>\n<td>8P8C</td>\n<td>8 Position 8 Contact</td>\n<td>Технічна назва роз'єму RJ-45</td>\n</tr>\n<tr>\n<td>TIA</td>\n<td>Telecommunications Industry Association</td>\n<td>Асоціація телекомунікаційної промисловості</td>\n</tr>\n<tr>\n<td>PoE</td>\n<td>Power over Ethernet</td>\n<td>Живлення пристроїв через мережевий кабель</td>\n</tr>\n<tr>\n<td>SMF</td>\n<td>Single-Mode Fiber</td>\n<td>Одномодове оптичне волокно</td>\n</tr>\n<tr>\n<td>MMF</td>\n<td>Multi-Mode Fiber</td>\n<td>Багатомодове оптичне волокно</td>\n</tr>\n<tr>\n<td>GOF</td>\n<td>Glass Optical Fiber</td>\n<td>Скляне оптичне волокно</td>\n</tr>\n<tr>\n<td>POF</td>\n<td>Plastic Optical Fiber</td>\n<td>Пластикове оптичне волокно</td>\n</tr>\n<tr>\n<td>DOCSIS</td>\n<td>Data Over Cable Service Interface Specification</td>\n<td>Стандарт передачі даних по телевізійному коаксіалу</td>\n</tr>\n<tr>\n<td>IrDA</td>\n<td>Infrared Data Association</td>\n<td>Стандарт інфрачервоної передачі даних</td>\n</tr>\n<tr>\n<td>NFC</td>\n<td>Near Field Communication</td>\n<td>Зв'язок ближнього поля</td>\n</tr>\n<tr>\n<td>WiMAX</td>\n<td>Worldwide Interoperability for Microwave Access</td>\n<td>Технологія безпровідного широкосмугового доступу</td>\n</tr>\n<tr>\n<td>EMI</td>\n<td>Electromagnetic Interference</td>\n<td>Електромагнітні перешкоди</td>\n</tr>\n<tr>\n<td>LAN</td>\n<td>Local Area Network</td>\n<td>Локальна комп'ютерна мережа</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
