і, зашита в обладнання</td>\n<td>Так, залежить від мережі підключення</td>\n</tr>\n<tr>\n<td>Хто використовує</td>\n<td>Комутатор</td>\n<td>Маршрутизатор</td>\n</tr>\n<tr>\n<td>Довжина</td>\n<td>48 бітів</td>\n<td>32 біти (IPv4) або 128 бітів (IPv6)</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Аналогія з поштою</strong> <p><strong>IP-адреса</strong> подібна до поштової адреси: за нею посилку везуть між містами до потрібного будинку. Якщо людина переїде, адреса зміниться. <strong>MAC-адреса</strong> подібна до прізвища одержувача: коли посилка вже прибула до будинку, її вручають конкретній людині за прізвищем, і воно не залежить від того, де людина живе. Маршрутизатор працює як пошта між містами (за IP-адресою), комутатор як консьєрж у будинку (за MAC-адресою).</p>\n</div>\n\n","<h1>🔢 Структура IPv4-адреси</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>IP-адреса</strong> (Internet Protocol address) - унікальна логічна адреса мережевого інтерфейсу вузла в мережі, побудованій на стеку протоколів TCP/IP. Призначається саме інтерфейсу, а не пристрою: маршрутизатор із трьома інтерфейсами має три IP-адреси.</p>\n</div>\n\n\n\n<p>IPv4-адреса має довжину <strong>32 біти</strong>, які для зручності записують як <strong>чотири октети</strong> (по 8 бітів) у десятковому вигляді через крапку. Кожен октет може набувати значення від 0 до 255.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🔢 Адреса&lt;br/&gt;172.20.45.77] --&gt; B[💾 32 біти&lt;br/&gt;4 октети&lt;br/&gt;по 8 бітів]\n    B --&gt; C[🏢 Номер&lt;br/&gt;мережі]\n    B --&gt; D[💻 Номер&lt;br/&gt;вузла]\n    style A fill:#fff9c4,stroke:#f9a825\n    style B fill:#e3f2fd,stroke:#1565c0\n    style C fill:#fff3e0,stroke:#ef6c00\n    style D fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1789371519299-3-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 552px;\" viewBox=\"4 4 552 200\" role=\"graphics-document document\" aria-roledescripti  width: 120px;\"><span class=\"nodeLabel \"><p>🏢 Номер<br>мережі</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519299-3-0-flowchart-D-5\" data-look=\"neo\" transform=\"translate(472, 160)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 Номер<br>вузла</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789371519299-3-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789371519299-3-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Форма запису</th>\n<th>Приклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Десяткова</td>\n<td><code>172.20.45.77</code></td>\n</tr>\n<tr>\n<td>Двійкова</td>\n<td><code>10101100.00010100.00101101.01001101</code></td>\n</tr>\n</tbody></table>\n<h2>🔀 Дві частини адреси</h2>\n<table>\n<thead>\n<tr>\n<th>Частина</th>\n<th>Що ідентифікує</th>\n<th>Хто використовує</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏢 <strong>Номер мережі</strong></td>\n<td>Мережу, до якої належить вузол</td>\n<td>Маршрутизатор, щоб обрати напрямок пересилання</td>\n</tr>\n<tr>\n<td>💻 <strong>Номер вузла</strong></td>\n<td>Конкретний інтерфейс у цій мережі</td>\n<td>Відправник у тій самій мережі або останній маршрутизатор на шляху</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Без маски адреса неповна</strong> <p>Де саме закінчується номер мережі та починається номер вузла, сама адреса не показує. Цю межу визначає <strong>маска підмережі</strong>, яка завжди налаштовується разом з IP-адресою.</p>\n</div>\n\n","<h1>🧠 Двійкова арифметика для IP-адрес</h1>\n<p><strong>Головна ідея:</strong> усі обчислення з IP-адресами (маски, адреси мереж, підмережі) виконуються над бітами. Тому переведення октету між десятковою та двійковою формами потрібно робити впевнено.</p>\n<h2>⚖️ Ваги розрядів одного октету</h2>\n<table>\n<thead>\n<tr>\n<th>2⁷</th>\n<th>2⁶</th>\n<th>2⁵</th>\n<th>2⁴</th>\n<th>2³</th>\n<th>2²</th>\n<th>2¹</th>\n<th>2⁰</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>128</strong></td>\n<td><strong>64</strong></td>\n<td><strong>32</strong></td>\n<td><strong>16</strong></td>\n<td><strong>8</strong></td>\n<td><strong>4</strong></td>\n<td><strong>2</strong></td>\n<td><strong>1</strong></td>\n</tr>\n</tbody></table>\n<p>Сума всіх ваг дорівнює 255. Саме тому октет не може перевищувати 255.</p>\n<h2>📝 Десятковий у двійковий: <code>172.20.45.77</code></h2>\n<p>Кожен октет переводимо окремо, віднімаючи найбільші ваги, що вміщуються в число.</p>\n<table>\n<thead>\n<tr>\n<th>Октет</th>\n<th>Десятково</th>\n<th>Розкладення на ваги</th>\n<th>Двійково</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td><strong>172</strong></td>\n<td>128 + 32 + 8 + 4</td>\n<td><code>10101100</code></td>\n</tr>\n<tr>\n<td>2</td>\n<td><strong>20</strong></td>\n<td>16 + 4</td>\n<td><code>00010100</code></td>\n</tr>\n<tr>\n<td>3</td>\n<td><strong>45</strong></td>\n<td>32 + 8 + 4 + 1</td>\n<td><code>00101101</code></td>\n</tr>\n<tr>\n<td>4</td>\n<td><strong>77</strong></td>\n<td>64 + 8 + 4 + 1</td>\n<td><code>01001101</code></td>\n</tr>\n</tbody></table>\n<h2>📝 Двійковий у десятковий: <code>11001011.00000111.10100001.00011110</code></h2>\n<table>\n<thead>\n<tr>\n<th>Октет</th>\n<th>Двійково</th>\n<th>Ваги одиничних бітів</th>\n<th>Десятково</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td><code>11001011</code></td>\n<td>128 + 64 + 8 + 2 + 1</td>\n<td><strong>203</strong></td>\n</tr>\n<tr>\n<td>2</td>\n<td><code>00000111</code></td>\n<td>4 + 2 + 1</td>\n<td><strong>7</strong></td>\n</tr>\n<tr>\n<td>3</td>\n<td><code>10100001</code></td>\n<td>128 + 32 + 1</td>\n<td><strong>161</strong></td>\n</tr>\n<tr>\n<td>4</td>\n<td><code>00011110</code></td>\n<td>16 + 8 + 4 + 2</td>\n<td><strong>30</strong></td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Практична порада</strong> <p>Запам'ятайте ряд 128, 64, 32, 16, 8, 4, 2, 1. Він же дає значення октетів маски: 128, 192, 224, 240, 248, 252, 254, 255 (кожне наступне число додає ще один одиничний біт праворуч від попередніх).</p>\n</div>\n\n","<h1>🔄 Статичні та динамічні IP-адреси</h1>\n<table>\n<thead>\n<tr>\n<th>Тип</th>\n<th>Як призначається</th>\n<th>Термін дії</th>\n<th>Типове застосування</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📌 <strong>Статична</strong></td>\n<td>Вручну адміністратором у налаштуваннях</td>\n<td>До ручної зміни</td>\n<td>Сервери, принтери, маршрутизатори, комутатори</td>\n</tr>\n<tr>\n<td>🔄 <strong>Динамічна</strong></td>\n<td>Автоматично сервером при підключенні</td>\n<td>На час оренди (lease), потім поновлюється</td>\n<td>Робочі станції, ноутбуки, смартфони</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ DHCP</strong> <p><strong>DHCP</strong> (Dynamic Host Configuration Protocol / Протокол динамічного налаштування вузла) - основний протокол автоматичного призначення мережевих параметрів. Сервер видає клієнту не лише IP-адресу, а повний набір: <strong>адресу, маску, шлюз за замовчуванням та DNS-сервери</strong>.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[💻 Клієнт&lt;br/&gt;Discover] --&gt; B[🖥️ Сервер&lt;br/&gt;Offer]\n    B --&gt; C[💻 Клієнт&lt;br/&gt;Request]\n    C --&gt; D[🖥️ Сервер&lt;br/&gt;Ack]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#e8f5e9,stroke:#388e3c\n    style C fill:#e3f2fd,st m=\"translate(88, 48)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 Клієнт<br>Discover</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519317-5-0-flowchart-B-1\" data-look=\"neo\" transform=\"translate(280, 48)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🖥️ Сервер<br>Offer</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519317-5-0-flowchart-C-3\" data-look=\"neo\" transform=\"translate(472, 48)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 Клієнт<br>Request</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519317-5-0-flowchart-D-5\" data-look=\"neo\" transform=\"translate(664, 48)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🖥️ Сервер<br>Ack</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789371519317-5-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789371519317-5-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<p>Адміністратор налаштовує на сервері <strong>пул адрес</strong> (address pool), тобто діапазон, з якого видаються адреси. Частину адрес із пулу зазвичай виключають і резервують для статичних пристроїв.</p>\n<div class=\"note\"><strong>📝 Що робить пристрій, якщо DHCP-сервер не відповів</strong> <p>Вузол сам призначає собі адресу з діапазону <code>169.254.0.0/16</code> (механізм <strong>APIPA</strong>, Automatic Private IP Addressing). Така адреса працює лише всередині одного сегмента мережі. Адреса <code>169.254.x.x</code> на робочій станції є типовою ознакою того, що DHCP-сервер недоступний.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Як перевірити свої адреси</strong> <p>Windows: <code>ipconfig /all</code> показує IP-адресу, маску, шлюз, MAC-адресу інтерфейсу та термін оренди динамічної адреси. Linux: <code>ip address</code> для адрес і масок, <code>ip route</code> для шлюзу.</p>\n</div>\n\n","<h1>📦 IPv4 та IPv6: у чому різниця</h1>\n<div class=\"warning\"><strong>⚠️ Проблема, яку вирішує IPv6</strong> <p>Простір IPv4 налічує 2³² ≈ 4,3 млрд адрес. Це менше, ніж кількість пристроїв у сучасному Інтернеті. Центральний реєстр IANA вичерпав вільні блоки IPv4 ще у 2011 році. Тимчасово проблему стримують приватні адреси та NAT, довгостроково її вирішує IPv6.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Характеристика</th>\n<th>IPv4</th>\n<th>IPv6</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Довжина адреси</td>\n<td>32 біти (4 байти)</td>\n<td>128 бітів (16 байтів)</td>\n</tr>\n<tr>\n<td>Кількість адрес</td>\n<td>2³² ≈ 4,3 млрд</td>\n<td>2¹²⁸ ≈ 3,4 × 10³⁸</td>\n</tr>\n<tr>\n<td>Форма запису</td>\n<td>4 десяткові октети через крапку</td>\n<td>8 груп по 4 шістнадцяткові цифри через двокрапку</td>\n</tr>\n<tr>\n<td>Приклад</td>\n<td><code>192.168.0.3</code></td>\n<td><code>2001:0db8:85a3:0000:0000:8a2e:0370:7334</code></td>\n</tr>\n<tr>\n<td>Заголовок пакета</td>\n<td>20 байтів, містить контрольну суму</td>\n<td>40 байтів, без контрольної суми</td>\n</tr>\n<tr>\n<td>Автоконфігурація</td>\n<td>Вручну або через DHCP</td>\n<td>Вузол може сам сформувати адресу без DHCP-сервера</td>\n</tr>\n<tr>\n<td>Широкомовна розсилка</td>\n<td>Є (broadcast)</td>\n<td>Немає, замість неї групова розсилка (multicast)</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Скорочений запис IPv6</strong> <p>Початкові нулі в групі можна опускати, а одну послідовність нульових груп замінити на <code>::</code>. Так <code>fe80:0000:0000:0000:0000:0000:0000:0001</code> скорочується до <code>fe80::1</code>. Подвійна двокрапка допускається лише один раз в адресі, інакше запис стане неоднозначним.</p>\n</div>\n\n","<h1>🗂️ Класи IPv4-адрес</h1>\n<div class=\"info\"><strong>ℹ️ Класова адресація</strong> <p>У класовій схемі межа між номером мережі та номером вузла визначається <strong>першими бітами</strong> адреси. Ці біти є ознакою класу, тому клас будь-якої адреси можна визначити за значенням першого октету.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[🔢 IPv4-адреса&lt;br/&gt;перші біти] --&gt; B[Кла bel-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>Клас C<br>110xxxxx<br>192 до 223</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519337-7-0-flowchart-E-7\" data-look=\"neo\" transform=\"translate(664, 192)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>Клас D<br>1110xxxx<br>224 до 239</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519337-7-0-flowchart-F-9\" data-look=\"neo\" transform=\"translate(856, 192)\"><rect class=\"basic label-container\" style=\"fill:#f3e5f5 !important;stroke:#7b1fa2 !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>Клас E<br>1111xxxx<br>240 до 255</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789371519337-7-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789371519337-7-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Клас</th>\n<th>Призначення</th>\n<th>Маска за замовчуванням</th>\n<th>Біти мережі / вузла</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>A</strong></td>\n<td>Дуже великі мережі</td>\n<td><code>255.0.0.0</code> (/8)</td>\n<td>8 / 24</td>\n</tr>\n<tr>\n<td><strong>B</strong></td>\n<td>Середні та великі мережі</td>\n<td><code>255.255.0.0</code> (/16)</td>\n<td>16 / 16</td>\n</tr>\n<tr>\n<td><strong>C</strong></td>\n<td>Малі мережі, найпоширеніший клас</td>\n<td><code>255.255.255.0</code> (/24)</td>\n<td>24 / 8</td>\n</tr>\n<tr>\n<td><strong>D</strong></td>\n<td>Групова розсилка (multicast)</td>\n<td>не застосовується</td>\n<td>не ділиться</td>\n</tr>\n<tr>\n<td><strong>E</strong></td>\n<td>Зарезервовано для досліджень IETF</td>\n<td>не застосовується</td>\n<td>не ділиться</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Як визначити клас за першим октетом</strong> <p>Октет <code>150</code> у двійковому вигляді <code>10010110</code> починається з <code>10</code>, отже, це клас B. Октет <code>200</code> = <code>11001000</code> починається з <code>110</code>, отже, клас C. На практиці достатньо запам'ятати діапазони: 1-126, 128-191, 192-223.</p>\n</div>\n\n","<h1>📊 Класи A, B, C: скільки мереж і вузлів</h1>\n<p><strong>Головна ідея:</strong> 32 біти адреси = біти мережі + біти вузла. Фіксовані біти-ознаки класу входять до мережевої частини, але не можуть змінюватися, тому з підрахунку мереж вони виключаються.</p>\n<table>\n<thead>\n<tr>\n<th>Клас</th>\n<th>Перший октет</th>\n<th>Вільних бітів мережі</th>\n<th>Мереж (макс.)</th>\n<th>Бітів вузла</th>\n<th>Вузлів у мережі (макс.)</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>A</strong></td>\n<td>1-126</td>\n<td>8 − 1 = 7</td>\n<td>2⁷ − 2 = <strong>126</strong></td>\n<td>24</td>\n<td>2²⁴ − 2 = <strong>16 777 214</strong></td>\n</tr>\n<tr>\n<td><strong>B</strong></td>\n<td>128-191</td>\n<td>16 − 2 = 14</td>\n<td>2¹⁴ = <strong>16 384</strong></td>\n<td>16</td>\n<td>2¹⁶ − 2 = <strong>65 534</strong></td>\n</tr>\n<tr>\n<td><strong>C</strong></td>\n<td>192-223</td>\n<td>24 − 3 = 21</td>\n<td>2²¹ = <strong>2 097 152</strong></td>\n<td>8</td>\n<td>2⁸ − 2 = <strong>254</strong></td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Чому у вузлах завжди \"мінус 2\"</strong> <p>Дві адреси кожної мережі є службовими і не призначаються вузлам: <strong>адреса мережі</strong> (усі біти вузла дорівнюють 0) та <strong>широкомовна адреса</strong> (усі біти вузла дорівнюють 1). У класі A ще дві мережі вилучено з підрахунку: <code>0.x.x.x</code> (спеціальне значення) та <code>127.x.x.x</code> (loopback).</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Клас D та клас E</strong> <p>Адреса класу D не ділиться на мережу та вузол: усі 32 біти ідентифікують <strong>групу multicast</strong>, тобто набір вузлів, які підписалися на певний потік. Наприклад, пакет на адресу <code>224.0.0.1</code> отримують усі вузли сегмента, які підтримують групову розсилку. Клас E зарезервований і в публічних мережах не використовується.</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ Класи сьогодні</strong> <p>З 1993 року в Інтернеті застосовується безкласова адресація <strong>CIDR</strong>, де межу мережі задає лише маска, а не перші біти. Класи залишилися як історична основа: вони пояснюють походження масок за замовчуванням, приватних діапазонів і досі використовуються в навчальних задачах.</p>\n</div>\n\n","<h1>🔒 Приватні та спеціальні адреси</h1>\n<h2>🏠 Приватний адресний простір (RFC 1918)</h2>\n<p>Ці адреси призначені лише для локальних мереж і <strong>не маршрутизуються в Інтернеті</strong>. Одна й та сама приватна адреса може одночасно використовуватися в мільйонах мереж світу, а вихід в Інтернет забезпечує <strong>NAT</strong> на межовому маршрутизаторі: механізм, який підміняє приватну адресу відправника на публічну адресу маршрутизатора.</p>\n<table>\n<thead>\n<tr>\n<th>Клас</th>\n<th>Діапазон</th>\n<th>Запис CIDR</th>\n<th>Кількість мереж класу</th>\n<th>Вузлів у мережі</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>A</td>\n<td><code>10.0.0.0</code> до <code>10.255.255.255</code></td>\n<td><code>10.0.0.0/8</code></td>\n<td>1</td>\n<td>16 777 214</td>\n</tr>\n<tr>\n<td>B</td>\n<td><code>172.16.0.0</code> до <code>172.31.255.255</code></td>\n<td><code>172.16.0.0/12</code></td>\n<td>16</td>\n<td>65 534</td>\n</tr>\n<tr>\n<td>C</td>\n<td><code>192.168.0.0</code> до <code>192.168.255.255</code></td>\n<td><code>192.168.0.0/16</code></td>\n<td>256</td>\n<td>254</td>\n</tr>\n</tbody></table>\n<h2>⚙️ Спеціальні адреси</h2>\n<table>\n<thead>\n<tr>\n<th>Адреса</th>\n<th>Призначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>0.0.0.0</code></td>\n<td>Вузол ще не має адреси (відправник на початку обміну DHCP)</td>\n</tr>\n<tr>\n<td><code>127.0.0.1</code> (<code>127.0.0.0/8</code>)</td>\n<td><strong>Loopback</strong>: пакет не виходить у мережу, а повертається самому вузлу</td>\n</tr>\n<tr>\n<td><code>169.254.0.0/16</code></td>\n<td>Link-local адреси APIPA, коли DHCP недоступний</td>\n</tr>\n<tr>\n<td><code>255.255.255.255</code></td>\n<td>Обмежена широкомовна розсилка: усім вузлам поточного сегмента, не проходить маршрутизатор</td>\n</tr>\n<tr>\n<td>Усі біти вузла = 0</td>\n<td>Адреса мережі, ідентифікатор мережі, а не вузла</td>\n</tr>\n<tr>\n<td>Усі біти вузла = 1</td>\n<td>Широкомовна адреса конкретної мережі, наприклад <code>192.168.10.255</code> для <code>/24</code></td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Практика</strong> <p>Домашній маршрутизатор зазвичай має адресу <code>192.168.0.1</code> або <code>192.168.1.1</code>, а корпоративні мережі частіше будують на <code>10.0.0.0/8</code> через величезний запас адрес. Команда <code>ping 127.0.0.1</code> перевіряє, чи взагалі працює стек TCP/IP на комп'ютері, не торкаючись мережі.</p>\n</div>\n\n","<h1>🎭 Маска підмережі та довжина префікса</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Маска підмережі</strong> (subnet mask) - 32-бітне значення, у якому одиниці позначають біти <strong>мережевої</strong> частини IP-адреси, а нулі - біти <strong>вузлової</strong> частини. Маска не містить жодних частин адреси, вона лише показує, де проходить межа між ними.</p>\n</div>\n\n\n\n<p><strong>Правило побудови:</strong> маска завжди складається з безперервної послідовності одиниць зліва, за якою йдуть лише нулі. Мішаних комбінацій на кшталт <code>11101111</code> не буває. Тому лише один октет маски може бути \"неповним\", решта дорівнюють 255 або 0.</p>\n<h2>🔢 Можливі значення октету маски</h2>\n<table>\n<thead>\n<tr>\n<th>Двійково</th>\n<th><code>10000000</code></th>\n<th><code>11000000</code></th>\n<th><code>11100000</code></th>\n<th><code>11110000</code></th>\n<th><code>11111000</code></th>\n<th><code>11111100</code></th>\n<th><code>11111110</code></th>\n<th><code>11111111</code></th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Десятково</td>\n<td><strong>128</strong></td>\n<td><strong>192</strong></td>\n<td><strong>224</strong></td>\n<td><strong>240</strong></td>\n<td><strong>248</strong></td>\n<td><strong>252</strong></td>\n<td><strong>254</strong></td>\n<td><strong>255</strong></td>\n</tr>\n<tr>\n<td>Одиниць</td>\n<td>1</td>\n<td>2</td>\n<td>3</td>\n<td>4</td>\n<td>5</td>\n<td>6</td>\n<td>7</td>\n<td>8</td>\n</tr>\n</tbody></table>\n<h2>🔑 Довжина префікса</h2>\n<p><strong>Довжина префікса</strong> (prefix length) - кількість одиниць у масці, записана через похилу риску після адреси. <code>192.168.3.120/24</code> і <code>192.168.3.120</code> з маскою <code>255.255.255.0</code> означають одне й те саме.</p>\n<table>\n<thead>\n<tr>\n<th>Маска</th>\n<th>Двійковий запис</th>\n<th>Префікс</th>\n<th>Бітів вузла</th>\n<th>Вузлів</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>255.0.0.0</code></td>\n<td><code>11111111.00000000.00000000.00000000</code></td>\n<td>/8</td>\n<td>24</td>\n<td>16 777 214</td>\n</tr>\n<tr>\n<td><code>255.255.0.0</code></td>\n<td><code>11111111.11111111.00000000.00000000</code></td>\n<td>/16</td>\n<td>16</td>\n<td>65 534</td>\n</tr>\n<tr>\n<td><code>255.255.224.0</code></td>\n<td><code>11111111.11111111.11100000.00000000</code></td>\n<td>/19</td>\n<td>13</td>\n<td>8 190</td>\n</tr>\n<tr>\n<td><code>255.255.255.0</code></td>\n<td><code>11111111.11111111.11111111.00000000</code></td>\n<td>/24</td>\n<td>8</td>\n<td>254</td>\n</tr>\n<tr>\n<td><code>255.255.255.192</code></td>\n<td><code>11111111.11111111.11111111.11000000</code></td>\n<td>/26</td>\n<td>6</td>\n<td>62</td>\n</tr>\n<tr>\n<td><code>255.255.255.224</code></td>\n<td><code>11111111.11111111.11111111.11100000</code></td>\n<td>/27</td>\n<td>5</td>\n<td>30</td>\n</tr>\n<tr>\n<td><code>255.255.255.252</code></td>\n<td><code>11111111.11111111.11111111.11111100</code></td>\n<td>/30</td>\n<td>2</td>\n<td>2</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Швидке переведення</strong> <p>Префікс у маску: 26 одиниць = три повні октети (24) плюс ще 2 одиниці у четвертому, тобто <code>255.255.255.192</code>. Маска у префікс: <code>255.255.224.0</code> = 8 + 8 + 3 = /19. Маска <code>/30</code> з двома вузлами типова для з'єднання двох маршрутизаторів \"точка-точка\".</p>\n</div>\n\n","<h1>🧮 Адреса мережі: операція AND</h1>\n<div class=\"info\"><strong>ℹ️ Метод</strong> <p>Щоб знайти адресу мережі за IP-адресою та маскою, виконують <strong>порозрядне логічне І (AND)</strong>. Там, де в масці 1, біт адреси зберігається; там, де 0, результат дорівнює 0. Так відкидається вузлова частина і залишається лише мережева.</p>\n</div>\n\n\n\n<table>\n<thead>\n<tr>\n<th>Біт адреси</th>\n<th>Біт маски</th>\n<th>AND</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>1</td>\n<td><strong>1</strong></td>\n</tr>\n<tr>\n<td>0</td>\n<td>1</td>\n<td><strong>0</strong></td>\n</tr>\n<tr>\n<td>1</td>\n<td>0</td>\n<td><strong>0</strong></td>\n</tr>\n<tr>\n<td>0</td>\n<td>0</td>\n<td><strong>0</strong></td>\n</tr>\n</tbody></table>\n<h2>📝 Приклад 1: <code>172.20.45.77</code>, маска <code>255.255.0.0</code></h2>\n<p>Перший октет 172 належить діапазону 128-191, отже, це клас B, і маска /16 є маскою за замовчуванням. Перші 16 бітів - мережа, останні 16 - вузол.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>1 октет</th>\n<th>2 октет</th>\n<th>3 октет</th>\n<th>4 октет</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>IP-адреса</strong></td>\n<td><code>10101100</code></td>\n<td><code>00010100</code></td>\n<td><code>00101101</code></td>\n<td><code>01001101</code></td>\n</tr>\n<tr>\n<td><strong>Маска</strong></td>\n<td><code>11111111</code></td>\n<td><code>11111111</code></td>\n<td><code>00000000</code></td>\n<td><code>00000000</code></td>\n</tr>\n<tr>\n<td><strong>AND</strong></td>\n<td><code>10101100</code></td>\n<td><code>00010100</code></td>\n<td><code>00000000</code></td>\n<td><code>00000000</code></td>\n</tr>\n<tr>\n<td><strong>Десятково</strong></td>\n<td>172</td>\n<td>20</td>\n<td><strong>0</strong></td>\n<td><strong>0</strong></td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>Параметр</th>\n<th>Значення</th>\n<th>Як отримано</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏢 Адреса мережі</td>\n<td><code>172.20.0.0/16</code></td>\n<td>IP AND маска</td>\n</tr>\n<tr>\n<td>📣 Широкомовна адреса</td>\n<td><code>172.20.255.255</code></td>\n<td>Усі біти вузла замінено на 1</td>\n</tr>\n<tr>\n<td>💻 Діапазон вузлів</td>\n<td><code>172.20.0.1</code> до <code>172.20.255.254</code></td>\n<td>Між адресою мережі та широкомовною</td>\n</tr>\n<tr>\n<td>🔢 Кількість вузлів</td>\n<td>2¹⁶ − 2 = <strong>65 534</strong></td>\n<td>16 бітів вузла мінус 2 службові</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Де тут маршрутизація</strong> <p>Кожен вузол виконує цю операцію перед відправленням будь-якого пакета. Він порівнює адресу мережі одержувача зі своєю: якщо вони збігаються, кадр надсилається безпосередньо одержувачу за його MAC-адресою; якщо ні, пакет передається <strong>шлюзу за замовчуванням</strong> (default gateway), тобто маршрутизатору, який знає шлях до інших мереж. Саме тут адресація перетворюється на маршрутизацію.</p>\n</div>\n\n","<h1>🧮 Приклад 2: межа мережі всередині октету</h1>\n<p><strong>Дано:</strong> IP-адреса <code>198.51.100.77</code>, маска <code>255.255.255.192</code> (/26).</p>\n<p>Маска /26 означає: 26 бітів мережі, 6 бітів вузла. Межа проходить усередині четвертого октету, тому працювати з ним доведеться на рівні бітів.</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>1 октет</th>\n<th>2 октет</th>\n<th>3 октет</th>\n<th>4 октет</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>IP-адреса</strong></td>\n<td><code>11000110</code></td>\n<td><code>00110011</code></td>\n<td><code>01100100</code></td>\n<td><code>01001101</code></td>\n</tr>\n<tr>\n<td><strong>Маска</strong></td>\n<td><code>11111111</code></td>\n<td><code>11111111</code></td>\n<td><code>11111111</code></td>\n<td><code>11000000</code></td>\n</tr>\n<tr>\n<td><strong>AND</strong></td>\n<td><code>11000110</code></td>\n<td><code>00110011</code></td>\n<td><code>01100100</code></td>\n<td><code>01000000</code></td>\n</tr>\n<tr>\n<td><strong>Десятково</strong></td>\n<td>198</td>\n<td>51</td>\n<td>100</td>\n<td><strong>64</strong></td>\n</tr>\n</tbody></table>\n<p>Перші три октети скопійовано без змін (маска 255). У четвертому октеті збережено лише два старші біти <code>01</code>, решту шість обнулено: <code>01000000</code> = <strong>64</strong>.</p>\n<p><strong>Широкомовна адреса:</strong> шість молодших бітів замінюємо на 1: <code>01111111</code> = 64 + 32 + 16 + 8 + 4 + 2 + 1 = <strong>127</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Параметр</th>\n<th>Значення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏢 Адреса мережі</td>\n<td><code>198.51.100.64/26</code></td>\n</tr>\n<tr>\n<td>📣 Широкомовна адреса</td>\n<td><code>198.51.100.127</code></td>\n</tr>\n<tr>\n<td>💻 Діапазон вузлів</td>\n<td><code>198.51.100.65</code> до <code>198.51.100.126</code></td>\n</tr>\n<tr>\n<td>🔢 Кількість вузлів</td>\n<td>2⁶ − 2 = <strong>62</strong></td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Типова помилка</strong> <p>Студенти часто пишуть адресу мережі <code>198.51.100.0</code> за звичкою до маски /24. Але з маскою /26 два старші біти четвертого октету також належать мережі, тому в діапазоні <code>198.51.100.x</code> існує чотири різні мережі: <code>.0</code>, <code>.64</code>, <code>.128</code>, <code>.192</code>.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Перевірка: чи в одній мережі два вузли</strong> <p><code>198.51.100.77</code> та <code>198.51.100.130</code> з маскою /26. Для другої адреси: <code>10000010</code> AND <code>11000000</code> = <code>10000000</code> = 128. Адреси мереж 64 і 128 різні, отже, вузли перебувають у різних підмережах, і для обміну між ними потрібен маршрутизатор, хоча перші три октети збігаються.</p>\n</div>\n\n","<h1>✂️ Поділ мережі на підмережі (Subnetting)</h1>\n<div class=\"info\"><strong>ℹ️ Ідея</strong> <p><strong>Subnetting</strong> - поділ однієї мережі на кілька менших шляхом <strong>позичання бітів</strong> (borrowed bits) із вузлової частини на користь мережевої. Кожен позичений біт подвоює кількість підмереж і вдвічі зменшує кількість адрес у кожній з них.</p>\n</div>\n\n\n\n<p><strong>Навіщо це потрібно:</strong> обмежити широкомовний трафік, відокремити підрозділи один від одного (бухгалтерія не бачить трафік розробників), спростити керування та застосувати правила безпеки між сегментами.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🏢 Мережа&lt;br/&gt;24 біти] --&gt; B[💻 Вузол&lt;br/&gt;8 бітів]\n    C[🏢 Мережа&lt;br/&gt;24 біти] --&gt; D[✂️ Підмережа&lt;br/&gt;3 біти]\n    D --&gt; E[💻 Вузол&lt;br/&gt;5 бітів]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style C fill:#e3f2fd,stroke:#1565c0\n    style B f n)\"></path></g><g class=\"edgeLabels\"></g><g class=\"nodes\"><g class=\"node default  \" id=\"exp-1789371519363-13-0-flowchart-A-0\" data-look=\"neo\" transform=\"translate(88, 48)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏢 Мережа<br>24 біти</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519363-13-0-flowchart-B-1\" data-look=\"neo\" transform=\"translate(280, 48)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 Вузол<br>8 бітів</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519363-13-0-flowchart-C-2\" data-look=\"neo\" transform=\"translate(88, 160)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏢 Мережа<br>24 біти</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519363-13-0-flowchart-D-3\" data-look=\"neo\" transform=\"translate(280, 160)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>✂️ Підмережа<br>3 біти</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519363-13-0-flowchart-E-5\" data-look=\"neo\" transform=\"translate(472, 160)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>💻 Вузол<br>5 бітів</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789371519363-13-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789371519363-13-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<p>Верхній ряд: вихідна мережа <code>/24</code>. Нижній ряд: після позичання трьох бітів межа мережі зсунулася праворуч, і маска стала <code>/27</code>.</p>\n<h2>📐 Формули</h2>\n<table>\n<thead>\n<tr>\n<th>Параметр</th>\n<th>Формула</th>\n<th>Пояснення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Кількість підмереж</td>\n<td><strong>2ⁿ</strong></td>\n<td>n - кількість позичених бітів</td>\n</tr>\n<tr>\n<td>Вузлів у підмережі</td>\n<td><strong>2ᵐ − 2</strong></td>\n<td>m - кількість бітів вузла, що залишилися</td>\n</tr>\n<tr>\n<td>Нова маска</td>\n<td><strong>старий префікс + n</strong></td>\n<td>одиниць у масці стає більше на n</td>\n</tr>\n<tr>\n<td>Крок між підмережами</td>\n<td><strong>2ᵐ</strong> у межах октету</td>\n<td>дорівнює кількості адрес у підмережі, або 256 − октет маски</td>\n</tr>\n</tbody></table>\n<div class=\"warning\"><strong>⚠️ Компроміс</strong> <p>Чим більше підмереж, тим менше вузлів у кожній. Позичивши 6 бітів із <code>/24</code>, отримаємо 64 підмережі, але лише 2² − 2 = 2 вузли в кожній. Такі мережі <code>/30</code> доречні тільки для з'єднань між двома маршрутизаторами.</p>\n</div>\n\n","<h1>🧮 Subnetting на практиці: дві типові задачі</h1>\n<h2>📝 Задача 1: відомо потрібну кількість підмереж</h2>\n<p><strong>Дано:</strong> мережа <code>192.0.2.0/24</code>, потрібно щонайменше <strong>5 підмереж</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Крок</th>\n<th>Дія</th>\n<th>Результат</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>Підібрати n так, щоб 2ⁿ ≥ 5</td>\n<td>2² = 4 замало, 2³ = 8, тому <strong>n = 3</strong></td>\n</tr>\n<tr>\n<td>2</td>\n<td>Нова маска</td>\n<td>/24 + 3 = <strong>/27</strong> = <code>255.255.255.224</code></td>\n</tr>\n<tr>\n<td>3</td>\n<td>Бітів вузла</td>\n<td>8 − 3 = <strong>5</strong></td>\n</tr>\n<tr>\n<td>4</td>\n<td>Вузлів у кожній підмережі</td>\n<td>2⁵ − 2 = <strong>30</strong></td>\n</tr>\n<tr>\n<td>5</td>\n<td>Крок між підмережами</td>\n<td>2⁵ = <strong>32</strong> адреси</td>\n</tr>\n</tbody></table>\n<table>\n<thead>\n<tr>\n<th>Підмережа</th>\n<th>Діапазон вузлів</th>\n<th>Широкомовна адреса</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>192.0.2.0/27</code></td>\n<td><code>.1</code> до <code>.30</code></td>\n<td><code>192.0.2.31</code></td>\n</tr>\n<tr>\n<td><code>192.0.2.32/27</code></td>\n<td><code>.33</code> до <code>.62</code></td>\n<td><code>192.0.2.63</code></td>\n</tr>\n<tr>\n<td><code>192.0.2.64/27</code></td>\n<td><code>.65</code> до <code>.94</code></td>\n<td><code>192.0.2.95</code></td>\n</tr>\n<tr>\n<td><code>192.0.2.96/27</code></td>\n<td><code>.97</code> до <code>.126</code></td>\n<td><code>192.0.2.127</code></td>\n</tr>\n<tr>\n<td>...</td>\n<td>...</td>\n<td>...</td>\n</tr>\n<tr>\n<td><code>192.0.2.224/27</code></td>\n<td><code>.225</code> до <code>.254</code></td>\n<td><code>192.0.2.255</code></td>\n</tr>\n</tbody></table>\n<p><strong>Звідки береться крок.</strong> Підмережі відрізняються лише значенням трьох позичених бітів, а вони є старшими бітами четвертого октету з вагами 128, 64, 32. Наймолодший з них має вагу 32, тому кожна наступна підмережа починається на 32 більше за попередню. Те саме число можна отримати як 256 − 224, де 224 - значення октету маски.</p>\n<table>\n<thead>\n<tr>\n<th>Позичені біти</th>\n<th>Четвертий октет</th>\n<th>Початок підмережі</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>000</code></td>\n<td><code>00000000</code></td>\n<td><code>.0</code></td>\n</tr>\n<tr>\n<td><code>001</code></td>\n<td><code>00100000</code></td>\n<td><code>.32</code></td>\n</tr>\n<tr>\n<td><code>010</code></td>\n<td><code>01000000</code></td>\n<td><code>.64</code></td>\n</tr>\n<tr>\n<td><code>011</code></td>\n<td><code>01100000</code></td>\n<td><code>.96</code></td>\n</tr>\n<tr>\n<td><code>111</code></td>\n<td><code>11100000</code></td>\n<td><code>.224</code></td>\n</tr>\n</tbody></table>\n<h2>📝 Задача 2: відомо потрібну кількість вузлів</h2>\n<p><strong>Дано:</strong> мережа <code>192.0.2.0/24</code>, у кожній підмережі потрібно щонайменше <strong>50 вузлів</strong>.</p>\n<table>\n<thead>\n<tr>\n<th>Крок</th>\n<th>Дія</th>\n<th>Результат</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1</td>\n<td>Підібрати m так, щоб 2ᵐ − 2 ≥ 50</td>\n<td>2⁵ − 2 = 30 замало, 2⁶ − 2 = 62, тому <strong>m = 6</strong></td>\n</tr>\n<tr>\n<td>2</td>\n<td>Позичених бітів</td>\n<td>n = 8 − 6 = <strong>2</strong></td>\n</tr>\n<tr>\n<td>3</td>\n<td>Нова маска</td>\n<td>/24 + 2 = <strong>/26</strong> = <code>255.255.255.192</code></td>\n</tr>\n<tr>\n<td>4</td>\n<td>Кількість підмереж</td>\n<td>2² = <strong>4</strong> (крок 64: <code>.0</code>, <code>.64</code>, <code>.128</code>, <code>.192</code>)</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Зворотна задача: скільки підмереж уже створено</strong> <p>Дано <code>131.28.0.0</code> з маскою <code>255.255.224.0</code>. Клас B, префікс за замовчуванням /16, задана маска /19. Позичено 19 − 16 = 3 біти, отже, мережу поділено на 2³ = 8 підмереж по 2¹³ − 2 = 8 190 вузлів.</p>\n</div>\n\n","<h1>🏷️ MAC-адреса: фізична адресація</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>MAC-адреса</strong> (Media Access Control address) - унікальний 48-бітний ідентифікатор мережевого інтерфейсу, який виробник записує в обладнання під час виготовлення. Використовується на канальному рівні для доставки кадрів усередині одного сегмента мережі.</p>\n</div>\n\n\n\n<p>Записується як <strong>6 октетів у шістнадцятковому вигляді</strong> через дефіс або двокрапку: <code>00-1B-44-11-3A-B7</code> або <code>00:1b:44:11:3a:b7</code>.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[🏷️ MAC-адреса&lt;br/&gt;48 бітів&lt;br/&gt;6 октетів] --&gt; B[🏭 OUI&lt;br/&gt;3 октети&lt;br/&gt;виробник]\n    A --&gt; C[🔢 Номер&lt;br/&gt;інтерфейсу&lt;br/&gt;3 октети]\n    style A fill:#fff9c4,stroke:#f9a825\n    style B fill:#e3f2fd,stroke:#1565c0\n    style C fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1789371519387-15-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 360px;\" viewBox=\"4 4 360 248\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789371519387-15-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans </rect><foreignObject width=\"120\" height=\"96\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: break-spaces; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏷️ MAC-адреса<br>48 бітів<br>6 октетів</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519387-15-0-flowchart-B-1\" data-look=\"neo\" transform=\"translate(280, 60)\"><rect class=\"basic label-container\" style=\"fill:#e3f2fd !important;stroke:#1565c0 !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏭 OUI<br>3 октети<br>виробник</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789371519387-15-0-flowchart-C-3\" data-look=\"neo\" transform=\"translate(280, 196)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🔢 Номер<br>інтерфейсу<br>3 октети</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789371519387-15-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789371519387-15-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th>Частина</th>\n<th>Хто призначає</th>\n<th>Що дає</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏭 <strong>OUI</strong> (перші 3 октети)</td>\n<td>Реєстр IEEE закріплює за виробником</td>\n<td>За першими трьома октетами можна визначити виробника карти</td>\n</tr>\n<tr>\n<td>🔢 <strong>Номер інтерфейсу</strong> (останні 3 октети)</td>\n<td>Сам виробник, унікально в межах OUI</td>\n<td>2²⁴ ≈ 16,7 млн адрес на кожен OUI</td>\n</tr>\n</tbody></table>\n<p>Загалом простір MAC-48 налічує 2⁴⁸ ≈ 281 трлн адрес. Адреса <code>FF-FF-FF-FF-FF-FF</code> є <strong>широкомовною</strong> на канальному рівні: кадр із такою адресою призначення отримують усі вузли сегмента.</p>\n<div class=\"note\"><strong>📝 Зв'язок між IP та MAC</strong> <p>Вузол знає IP-адресу одержувача, але кадр Ethernet потребує MAC-адреси. Відповідність між ними встановлює протокол <strong>ARP</strong> (для IPv4) або <strong>NDP</strong> (для IPv6). ARP розсилає широкомовний запит \"хто має адресу 192.168.1.10?\", а власник відповідає своєю MAC-адресою; NDP робить те саме через multicast. Результат зберігається в ARP-таблиці (<code>arp -a</code>).</p>\n</div>\n\n\n\n\n\n<div class=\"warning\"><strong>⚠️ MAC-адресу можна змінити</strong> <p>Попри те, що адреса зашита в обладнання, операційна система дозволяє задати <strong>локально адміністровану</strong> MAC-адресу програмно. Тому MAC-адреса не є надійним засобом автентифікації пристрою, хоча фільтрація за MAC часто використовується як додатковий бар'єр.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> <ol>\n<li>🗺️ <strong>Два рівні адресації.</strong> MAC-адреса (L2) ідентифікує інтерфейс у локальному сегменті, IP-адреса (L3) ідентифікує вузол у складеній мережі та використовується маршрутизаторами</li>\n<li>🔢 <strong>IPv4-адреса має 32 біти</strong> і складається з номера мережі та номера вузла. Межу між ними задає маска підмережі</li>\n<li>🔄 <strong>Адреси бувають статичними та динамічними.</strong> DHCP видає адресу, маску, шлюз і DNS; адреса <code>169.254.x.x</code> є ознакою недоступного DHCP-сервера</li>\n<li>📦 <strong>IPv6</strong> має 128-бітні адреси і створений для вирішення проблеми вичерпання IPv4</li>\n<li>🗂️ <strong>Класи A, B, C</strong> визначаються першими бітами і задають маски за замовчуванням /8, /16, /24; клас D призначений для multicast</li>\n<li>🔒 <strong>Приватні діапазони</strong> <code>10.0.0.0/8</code>, <code>172.16.0.0/12</code>, <code>192.168.0.0/16</code> не маршрутизуються в Інтернеті</li>\n<li>🧮 <strong>Адреса мережі = IP AND маска.</strong> Широкомовна адреса: усі біти вузла дорівнюють 1. Вузлів у мережі 2ᵐ − 2</li>\n<li>✂️ <strong>Subnetting:</strong> n позичених бітів дають 2ⁿ підмереж по 2ᵐ − 2 вузлів; крок між підмережами дорівнює кількості адрес у підмережі (2ᵐ)</li>\n</ol>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Що відпрацьовуємо на лабораторних</strong> <p>Переведення октетів у двійкову форму, обчислення адреси мережі та широкомовної адреси, підбір маски за кількістю підмереж або вузлів. Ці навички є основою для налаштування адресації та маршрутизації в Packet Tracer.</p>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 Чим фізична адресація відрізняється від логічної? Яку роль кожна з них відіграє під час доставки пакета до вузла в іншій мережі?</p>\n</li>\n<li><p>🤔 Яку структуру має IPv4-адреса? Чому без маски підмережі неможливо визначити, до якої мережі належить вузол?</p>\n</li>\n<li><p>🤔 Перерахуйте класи IPv4-адрес. Як визначити клас, знаючи лише перший октет? Чому клас D не ділиться на номер мережі та номер вузла?</p>\n</li>\n<li><p>🤔 Які адреси називають приватними? Чому їх не маршрутизують в Інтернеті і як тоді пристрої з такими адресами отримують доступ до нього?</p>\n</li>\n<li><p>🤔 Що показує маска підмережі? Яка маска відповідає префіксу /27, а який префікс відповідає масці <code>255.255.240.0</code>?</p>\n</li>\n<li><p>🤔 Для адреси <code>203.0.113.170</code> з маскою <code>255.255.255.224</code> визначте адресу мережі, широкомовну адресу та кількість доступних вузлів.</p>\n</li>\n<li><p>🤔 Мережу <code>172.16.0.0/16</code> потрібно поділити так, щоб у кожній підмережі було щонайменше 1000 вузлів. Яку маску слід обрати і скільки підмереж утворюється?</p>\n</li>\n<li><p>🤔 Що таке OUI в MAC-адресі? Який протокол дозволяє вузлу дізнатися MAC-адресу за відомою IP-адресою?</p>\n</li>\n</ol>\n","<h1>📚 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>IP-адреса</td>\n<td>IP address</td>\n<td>Унікальна логічна адреса мережевого інтерфейсу в мережі TCP/IP</td>\n</tr>\n<tr>\n<td>MAC-адреса</td>\n<td>MAC address</td>\n<td>48-бітний фізичний ідентифікатор мережевого інтерфейсу, призначений виробником</td>\n</tr>\n<tr>\n<td>Октет</td>\n<td>Octet</td>\n<td>Група з 8 бітів; IPv4-адреса складається з чотирьох октетів</td>\n</tr>\n<tr>\n<td>Номер мережі</td>\n<td>Network ID</td>\n<td>Частина IP-адреси, спільна для всіх вузлів однієї мережі</td>\n</tr>\n<tr>\n<td>Номер вузла</td>\n<td>Host ID</td>\n<td>Частина IP-адреси, що ідентифікує конкретний інтерфейс у мережі</td>\n</tr>\n<tr>\n<td>Маска підмережі</td>\n<td>Subnet mask</td>\n<td>32-бітне значення, одиниці якого позначають мережеву частину адреси</td>\n</tr>\n<tr>\n<td>Довжина префікса</td>\n<td>Prefix length</td>\n<td>Кількість одиниць у масці, записана через похилу риску, наприклад /24</td>\n</tr>\n<tr>\n<td>Адреса мережі</td>\n<td>Network address</td>\n<td>Адреса з нульовою вузловою частиною, ідентифікатор мережі</td>\n</tr>\n<tr>\n<td>Широкомовна адреса</td>\n<td>Broadcast address</td>\n<td>Адреса з одиничною вузловою частиною для розсилки всім вузлам мережі</td>\n</tr>\n<tr>\n<td>Підмережа</td>\n<td>Subnet</td>\n<td>Частина мережі, утворена позичанням бітів із вузлової частини</td>\n</tr>\n<tr>\n<td>Позичені біти</td>\n<td>Borrowed bits</td>\n<td>Біти вузлової частини, переведені до мережевої під час поділу на підмережі</td>\n</tr>\n<tr>\n<td>Пул адрес</td>\n<td>Address pool</td>\n<td>Діапазон адрес, з якого DHCP-сервер видає адреси клієнтам</td>\n</tr>\n<tr>\n<td>Оренда адреси</td>\n<td>Lease</td>\n<td>Обмежений термін, на який DHCP-сервер видає динамічну адресу</td>\n</tr>\n<tr>\n<td>Шлюз за замовчуванням</td>\n<td>Default gateway</td>\n<td>Адреса маршрутизатора, якому вузол передає пакети для інших мереж</td>\n</tr>\n<tr>\n<td>Приватна адреса</td>\n<td>Private address</td>\n<td>Адреса з діапазонів RFC 1918, що не маршрутизується в Інтернеті</td>\n</tr>\n<tr>\n<td>Loopback</td>\n<td>Loopback</td>\n<td>Адреса <code>127.0.0.1</code> для перевірки стека TCP/IP без виходу в мережу</td>\n</tr>\n<tr>\n<td>Групова адреса</td>\n<td>Multicast address</td>\n<td>Адреса класу D, що ідентифікує групу одержувачів</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>IP</strong></td>\n<td>Internet Protocol</td>\n<td>Міжмережевий протокол</td>\n</tr>\n<tr>\n<td><strong>IPv4</strong></td>\n<td>Internet Protocol version 4</td>\n<td>Протокол IP версії 4, 32-бітні адреси</td>\n</tr>\n<tr>\n<td><strong>IPv6</strong></td>\n<td>Internet Protocol version 6</td>\n<td>Протокол IP версії 6, 128-бітні адреси</td>\n</tr>\n<tr>\n<td><strong>MAC</strong></td>\n<td>Media Access Control</td>\n<td>Керування доступом до середовища</td>\n</tr>\n<tr>\n<td><strong>NIC</strong></td>\n<td>Network Interface Card</td>\n<td>Мережева інтерфейсна карта</td>\n</tr>\n<tr>\n<td><strong>OUI</strong></td>\n<td>Organizationally Unique Identifier</td>\n<td>Унікальний ідентифікатор організації (виробника)</td>\n</tr>\n<tr>\n<td><strong>DHCP</strong></td>\n<td>Dynamic Host Configuration Protocol</td>\n<td>Протокол динамічного налаштування вузла</td>\n</tr>\n<tr>\n<td><strong>APIPA</strong></td>\n<td>Automatic Private IP Addressing</td>\n<td>Автоматичне призначення приватної адреси</td>\n</tr>\n<tr>\n<td><strong>ARP</strong></td>\n<td>Address Resolution Protocol</td>\n<td>Протокол визначення адреси</td>\n</tr>\n<tr>\n<td><strong>NDP</strong></td>\n<td>Neighbor Discovery Protocol</td>\n<td>Протокол виявлення сусідів (IPv6)</td>\n</tr>\n<tr>\n<td><strong>CIDR</strong></td>\n<td>Classless Inter-Domain Routing</td>\n<td>Безкласова міждоменна маршрутизація</td>\n</tr>\n<tr>\n<td><strong>NAT</strong></td>\n<td>Network Address Translation</td>\n<td>Трансляція мережевих адрес</td>\n</tr>\n<tr>\n<td><strong>IANA</strong></td>\n<td>Internet Assigned Numbers Authority</td>\n<td>Адміністрація адресного простору Інтернету</td>\n</tr>\n<tr>\n<td><strong>IEEE</strong></td>\n<td>Institute of Electrical and Electronics Engineers</td>\n<td>Інститут інженерів з електротехніки та електроніки</td>\n</tr>\n<tr>\n<td><strong>IETF</strong></td>\n<td>Internet Engineering Task Force</td>\n<td>Проблемна група проєктування Інтернету</td>\n</tr>\n<tr>\n<td><strong>RFC</strong></td>\n<td>Request for Comments</td>\n<td>Документ, що описує стандарти Інтернету</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
