#presentation-container:fullscreen,#presentation-container:-webkit-full-screen,#presentation-container:-moz-full-screen,#presentation-container:-ms-fullscreen{background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)!important;}</style></head><body><div id="presentation-container"><div class="progress"><div class="progress-bar" id="progress-bar"></div></div><button id="sidebar-toggle" onclick="toggleSidebar()" title="Навігація слайдами (S)">☰</button><div id="sidebar"><div id="sidebar-header"><h3>📑 Слайди</h3><button id="sidebar-close" onclick="toggleSidebar()">✕</button></div><div id="sidebar-content"></div></div><div class="slide-container"><div class="slide" id="current-slide"></div></div><div class="controls"><button class="control-btn" onclick="previousSlide()" title="Попередній (←)">←</button><button class="control-btn" onclick="nextSlide()" title="Наступний (→)">→</button><button class="control-btn" onclick="toggleFullscreen()" title="Повноекранний режим (F)">⛶</button><button class="control-btn" onclick="toggleHelp()" title="Допомога (?)">?</button></div><div class="slide-number" id="slide-number">1 / 16</div><div id="help-overlay" class="hidden"><strong>Гарячі клавіші:</strong><br><kbd>←</kbd> <kbd>→</kbd> Навігація<br><kbd>F</kbd> Повноекранний режим<br><kbd>S</kbd> Sidebar<br><kbd>?</kbd> Допомога<br><kbd>Esc</kbd> Закрити</div></div><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script>const slides=["<h1>Технології локальних мереж</h1>\n<p><strong>Курс:</strong> Організація комп'ютерних мереж / Комп'ютерні мережі</p>\n<p><strong>Лектор:</strong> Кобилянський Антон</p>\n","<h1>📋 План лекції</h1>\n<ol>\n<li>🌐 Що таке Ethernet і чому він усюди</li>\n<li>🎙️ Спільне середовище та колізії: CSMA/CD</li>\n<li>📦 Кадр Ethernet: що всередині</li>\n<li>⚡ Скільки корисних даних реально проходить</li>\n<li>🚀 Три покоління, один кадр: 10, 100, 1000 Мбіт/с</li>\n<li>🔌 Як читати назви специфікацій</li>\n<li>🧵 Історія одного кабелю: чому кручена пара пережила всі покоління</li>\n<li>🔍 Діагностика на практиці</li>\n</ol>\n","<h1>🌐 Що таке Ethernet і чому він усюди</h1>\n<div class=\"info\"><strong>ℹ️ Визначення</strong> <p><strong>Ethernet</strong> (IEEE 802.3) - сімейство технологій локальних мереж, що визначає формат кадру, метод доступу до середовища та специфікації фізичного рівня для швидкостей від 10 Мбіт/с до сотень Гбіт/с.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> У 1980-х Ethernet конкурував із Token Ring, FDDI та ATM, і кожен із них у чомусь був технічно кращим. Переміг Ethernet, бо був простим, дешевим і не ламав сумісність при кожному зростанні швидкості.</p>\n<table>\n<thead>\n<tr>\n<th>Рік</th>\n<th>Подія</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>1973</td>\n<td>Robert Metcalfe (Xerox PARC) створює експериментальну мережу зі швидкістю 2,94 Мбіт/с</td>\n</tr>\n<tr>\n<td>1983</td>\n<td>IEEE затверджує стандарт <strong>802.3</strong>: 10 Мбіт/с</td>\n</tr>\n<tr>\n<td>1995</td>\n<td><strong>Fast Ethernet</strong> (802.3u): 100 Мбіт/с</td>\n</tr>\n<tr>\n<td>1999</td>\n<td><strong>Gigabit Ethernet</strong> по крученій парі (802.3ab): 1 Гбіт/с</td>\n</tr>\n<tr>\n<td>2002 і далі</td>\n<td>10, 40, 100, 400 Гбіт/с у дата-центрах та магістралях</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Звідки назва</strong> <p>Слово <strong>ether</strong> (ефір) у фізиці XIX століття позначало уявне середовище, що заповнює весь простір. У першому Ethernet усі комп'ютери так само підключались до одного спільного кабелю.</p>\n</div>\n\n","<h1>🎙️ Спільне середовище та колізії</h1>\n<p><strong>Головна ідея:</strong> Перший Ethernet був одним коаксіальним кабелем, до якого підключались усі комп'ютери. Кабель один, а передавати хочуть усі, тому потрібне правило, хто і коли говорить.</p>\n<div class=\"info\"><strong>ℹ️ Що таке колізія</strong> <p><strong>Колізія</strong> - ситуація, коли дві станції передають одночасно і їхні сигнали накладаються. Обидва кадри спотворені, і жоден не дійде до одержувача.</p>\n</div>\n\n\n\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[&quot;🖥️ ПК А&quot;] --- BUS[&quot;═ спільний&lt;br/&gt;кабель ═&quot;]\n    B[&quot;🖥️ ПК Б&quot;] --- BUS\n    C[&quot;🖥️ ПК В&quot;] --- BUS\n    D[&quot;🖥️ ПК Г&quot;] --- BUS\n    BUS --&gt; X[&quot;💥 А і В разом:&lt;br/&gt;обидва кадри&lt;br/&gt;зіпсовано&quot;]\n    style BUS fill:#fff3e0,stroke:#ef6c00\n    style X fill:#fce4ec,stroke:#c2185b\"><svg id=\"exp-1789190236397-3-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 572px;\" viewBox=\"4 4 572 328\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190236397-3-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789190236397-3-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789190236397-3-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789190236397-3-0 .error-icon{fill:#552222;}#exp-1789190236397-3-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789190236397-3-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789190236397-3-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1789190236397-3-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1789190236397-3-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1789190236397-3-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1789190236397-3-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1789190236397-3-0 .marker{fill:#333333;stroke:#333333;}#exp-1789190236397-3-0 .marker.cross{stroke:#333333;}#exp-1789190236397-3-0 svg{font-family:system-ui, rong> товстий коаксіал не розрізали: трансивер голкою проколював ізоляцію до центральної жили (vampire tap), а до ПК ішов окремий кабель AUI. У <strong>10Base-2</strong> тонкий коаксіал розрізали на відрізки з роз'ємами BNC і з'єднували через T-конектор на кожній мережевій карті, а на кінцях ставили термінатори 50 Ом. В обох випадках усі карти сидять паралельно на одній жилі, тому дві одночасні передачі накладаються фізично.</p>\n</div>\n\n\n\n<p><strong>Аналогія:</strong> рація на спільній частоті. Перед тим як говорити, слухають, чи канал вільний. Якщо двоє почали одночасно, обоє чують перешкоди, замовкають і пробують знову трохи пізніше.</p>\n<div class=\"tip\"><strong>💡 Це правило і є CSMA/CD</strong> <p><strong>CSMA/CD</strong> (Carrier Sense Multiple Access with Collision Detection / Множинний доступ із прослуховуванням несучої та виявленням колізій): слухай перед передачею, слухай під час передачі, при колізії зупинись і повтори через випадкову паузу.</p>\n</div>\n\n","<h1>🔄 Алгоритм CSMA/CD</h1>\n\n<div class=\"mermaid\" data-source=\"graph TD\n    A[&quot;📡 Є кадр&lt;br/&gt;для передачі&quot;] --&gt; B{&quot;🔊 Кабель&lt;br/&gt;вільний?&quot;}\n    B --&gt;|ні| C[⏳ Чекати]\n    C --&gt; B\n    B --&gt;|так| D[&quot;📤 Передавати&lt;br/&gt;і слухати&quot;]\n    D --&gt; E{💥 Колізія?}\n    E --&gt;|ні| F[&quot;✅ Кадр&lt;br/&gt;передано&quot;]\n    E --&gt;|так| G[&quot;🚨 Зупинитись,&lt;br/&gt;jam-сигнал&quot;]\n    G --&gt; H[&quot;🎲 Пауза&lt;br/&gt;випадкової&lt;br/&gt;тривалості&quot;]\n    H --&gt; B\n    style A fill:#e3f2fd,stroke:#1565c0\n    style F fill:#e8f5e9,stroke:#388e3c\n    style G fill:#fce4ec,stroke:#c2185b\n    style H fill:#fff3e0,stroke:#ef6c00\"><svg id=\"exp-1789190236422-4-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 504px;\" viewBox=\"4 4 504 1032\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190236422-4-0{font-family:system-ui,-apple-system,B class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>✅ Кадр<br>передано</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190236422-4-0-flowchart-G-13\" data-look=\"neo\" transform=\"translate(376, 856)\"><rect class=\"basic label-container\" style=\"fill:#fce4ec !important;stroke:#c2185b !important\" x=\"-76\" y=\"-36\" width=\"152\" height=\"72\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -24)\"><rect></rect><foreignObject width=\"120\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🚨 Зупинитись,<br>jam-сигнал</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190236422-4-0-flowchart-H-15\" data-look=\"neo\" transform=\"translate(424, 980)\"><rect class=\"basic label-container\" style=\"fill:#fff3e0 !important;stroke:#ef6c00 !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🎲 Пауза<br>випадкової<br>тривалості</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190236422-4-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190236422-4-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<p><strong>Головна ідея:</strong> CSMA/CD не запобігає колізіям, а робить їх дешевими. Після колізії кожна станція чекає паузу <strong>випадкової тривалості</strong>: якби обидві чекали однаково, вони б зіткнулись знову. Якщо колізія повторюється, діапазон, з якого обирається тривалість паузи, подвоюється.</p>\n<div class=\"warning\"><strong>⚠️ Де колізій уже немає</strong> <p>Сучасна мережа побудована на <strong>комутаторах</strong>, і до кожного порту підключений лише один пристрій. Прийом і передача йдуть окремими парами кабелю одночасно (<strong>повний дуплекс</strong>), тому колізії неможливі, а CSMA/CD вимкнено. Стандарти від 10 Гбіт/с напівдуплексу взагалі не мають.</p>\n</div>\n\n\n\n\n\n<div class=\"note\"><strong>📝 Чому мінімальний кадр 64 байти</strong> <p>Щоб виявити колізію, станція має передавати достатньо довго, поки спотворений сигнал повернеться з дальнього кінця кабелю. Для 10 Мбіт/с це 512 біт, тобто 64 байти. Коротші дані доповнюються нулями (<strong>padding</strong>). Це обмеження досі живе в стандарті, хоча колізій у сучасних мережах немає.</p>\n</div>\n\n","<h1>📦 Кадр Ethernet: що всередині</h1>\n<p><strong>Головна ідея:</strong> Кадр - одиниця передачі канального рівня. Усі поля мають фіксовану позицію, тому обладнання обробляє кадр, не розбираючи вміст даних.</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    P[&quot;🔄 Преамбула&lt;br/&gt;та SFD&lt;br/&gt;8 байт&quot;] --&gt; DA[&quot;📬 MAC&lt;br/&gt;призначення&lt;br/&gt;6 байт&quot;]\n    DA --&gt; SA[&quot;📮 MAC&lt;br/&gt;джерела&lt;br/&gt;6 байт&quot;]\n    SA --&gt; T[&quot;🏷️ Type&lt;br/&gt;2 байти&quot;]\n    T --&gt; DATA[&quot;📦 Дані&lt;br/&gt;46 до 1500&lt;br/&gt;байт&quot;]\n    D n<td><strong>Дані</strong></td>\n<td>Корисне навантаження; максимум 1500 байт, це і є <strong>MTU</strong></td>\n</tr>\n<tr>\n<td><strong>FCS</strong></td>\n<td>Контрольна сума CRC-32; кадр із помилкою просто відкидається</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Ethernet II та IEEE 802.3</strong> <p>Існує два майже однакові формати. У фірмовому <strong>Ethernet II</strong> третє поле означає тип протоколу, у стандартному <strong>802.3</strong> довжину даних. Пристрій розрізняє їх за значенням: до 1500 це довжина, від 1536 це тип. Весь трафік TCP/IP іде в Ethernet II, тож у Wireshark ви побачите саме його.</p>\n</div>\n\n","<h1>⚡ Скільки корисних даних реально проходить</h1>\n<p><strong>Головна ідея:</strong> Канал 10 Мбіт/с не віддає всі 10 Мбіт/с даним. На кожен кадр витрачаються 18 байт заголовків і FCS, 8 байт преамбули та обов'язкова пауза між кадрами (<strong>IFG</strong>, 12 байт).</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Мінімальний кадр</th>\n<th>Максимальний кадр</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>📦 Корисні дані</td>\n<td>46 байт</td>\n<td>1500 байт</td>\n</tr>\n<tr>\n<td>⚙️ Разом зі службовими байтами та паузою</td>\n<td>84 байти</td>\n<td>1538 байт</td>\n</tr>\n<tr>\n<td>🔢 Кадрів за секунду при 10 Мбіт/с</td>\n<td><strong>14 880</strong></td>\n<td><strong>813</strong></td>\n</tr>\n<tr>\n<td>📊 Корисна швидкість</td>\n<td><strong>5,5 Мбіт/с</strong> (55%)</td>\n<td><strong>9,8 Мбіт/с</strong> (98%)</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    S[&quot;📦 Маленькі&lt;br/&gt;кадри&quot;] --&gt; S1[&quot;⚙️ Половина&lt;br/&gt;каналу на&lt;br/&gt;службу&quot;]\n    L[&quot;📦 Великі&lt;br/&gt;кадри&quot;] --&gt; L1[&quot;✅ Майже&lt;br/&gt;весь канал&lt;br/&gt;іде на дані&quot;]\n    style S fill:#fce4ec,stroke:#c2185b\n    style S1 fill:#fce4ec,stroke:#c2185b\n    style L fill:#e8f5e9,stroke:#388e3c\n    style L1 fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1789190236463-6-0\" width=\"100%\" xmlns=\  transform=\"translate(88, 308)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏠 10 Мбіт/с<br>коаксіал,<br>кручена пара</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190236483-7-0-flowchart-E100-5\" data-look=\"neo\" transform=\"translate(280, 308)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏢 100 Мбіт/с<br>кручена пара<br>кат. 5, оптика</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190236483-7-0-flowchart-E1G-7\" data-look=\"neo\" transform=\"translate(472, 308)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🏗️ 1 Гбіт/с<br>кручена пара<br>5e, оптика</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190236483-7-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190236483-7-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<table>\n<thead>\n<tr>\n<th></th>\n<th>Ethernet</th>\n<th>Fast Ethernet</th>\n<th>Gigabit Ethernet</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>⚡ Швидкість</td>\n<td>10 Мбіт/с</td>\n<td>100 Мбіт/с</td>\n<td>1 Гбіт/с</td>\n</tr>\n<tr>\n<td>📅 Стандарт</td>\n<td>802.3 (1983)</td>\n<td>802.3u (1995)</td>\n<td>802.3z, 802.3ab (1998, 1999)</td>\n</tr>\n<tr>\n<td>📦 Кадр</td>\n<td>64 до 1518 байт</td>\n<td>той самий</td>\n<td>той самий</td>\n</tr>\n<tr>\n<td>🎙️ CSMA/CD</td>\n<td>так</td>\n<td>лише в напівдуплексі</td>\n<td>практично не використовується</td>\n</tr>\n</tbody></table>\n<div class=\"info\"><strong>ℹ️ Чому це важливо</strong> <p><strong>MII</strong> (Media Independent Interface / Інтерфейс, незалежний від середовища) - стандартна межа між MAC та мікросхемою фізичного рівня. Завдяки їй операційна система, драйвери та протоколи вищих рівнів не помічають, що мережа стала у 100 разів швидшою. Достатньо замінити обладнання.</p>\n</div>\n\n","<h1>🔌 Як читати назви специфікацій</h1>\n<p><strong>Головна ідея:</strong> Назва специфікації фізичного рівня кодує три речі: швидкість, спосіб передачі та середовище.</p>\n<div class=\"info\"><strong>ℹ️ Розбираємо 1000BASE-T</strong> <p><strong>1000</strong> = 1000 Мбіт/с. <strong>BASE</strong> = baseband, весь кабель зайнятий одним сигналом. <strong>T</strong> = twisted pair, кручена пара. Літери <strong>F</strong>, <strong>S</strong>, <strong>L</strong> означають оптоволокно, цифра <strong>2</strong> або <strong>5</strong> у старих назвах означала коаксіальний кабель.</p>\n</div>\n\n\n\n<h2>📊 Специфікації, які ви реально зустрінете</h2>\n<table>\n<thead>\n<tr>\n<th>Специфікація</th>\n<th>Середовище</th>\n<th>Відстань</th>\n<th>Де застосовується</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🟢 <strong>100BASE-TX</strong></td>\n<td>Кручена пара кат. 5, 2 пари</td>\n<td>100 м</td>\n<td>Старі офісні мережі, IP-телефони, камери</td>\n</tr>\n<tr>\n<td>🟢 <strong>1000BASE-T</strong></td>\n<td>Кручена пара кат. 5e, 4 пари</td>\n<td>100 м</td>\n<td>Основний стандарт сучасних офісів і домашніх мереж</td>\n</tr>\n<tr>\n<td>🟣 <strong>1000BASE-SX</strong></td>\n<td>Багатомодове волокно, 850 нм</td>\n<td>до 550 м</td>\n<td>З'єднання між поверхами та будівлями</td>\n</tr>\n<tr>\n<td>🟣 <strong>1000BASE-LX</strong></td>\n<td>Одномодове волокно, 1310 нм</td>\n<td>до 5 км</td>\n<td>З'єднання між віддаленими будівлями, провайдери</td>\n</tr>\n<tr>\n<td>🔵 <strong>10GBASE-T</strong></td>\n<td>Кручена пара кат. 6A, 4 пари</td>\n<td>100 м</td>\n<td>Сервери, робочі станції для відео та графіки</td>\n</tr>\n</tbody></table>\n<div class=\"note\"><strong>📝 Історичні специфікації</strong> <p><strong>10Base-5</strong> (товстий коаксіал, 500 м) та <strong>10Base-2</strong> (тонкий коаксіал, 185 м) працювали за схемою \"один кабель на всіх\" із попереднього слайду про колізії. Сьогодні їх немає навіть у старих будівлях, а <strong>10Base-T</strong> витіснений швидшими стандартами по тому самому кабелю.</p>\n</div>\n\n","<h1>🧵 Той самий кабель, у 100 разів швидше</h1>\n<p><strong>Головна ідея:</strong> У кабелі крученої пари 4 пари провідників. Перші два покоління Ethernet використовували лише 2 з них, тому запас залишався. Кожен новий стандарт проєктували так, щоб працювати по вже прокладеному кабелю: організації міняли лише обладнання.</p>\n<table>\n<thead>\n<tr>\n<th>Стандарт</th>\n<th>Скільки пар задіяно</th>\n<th>Як отримали швидкість</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>🏠 <strong>10Base-T</strong></td>\n<td>2 пари: одна на передачу, одна на прийом</td>\n<td>Простий сигнал, кабель майже порожній</td>\n</tr>\n<tr>\n<td>🏢 <strong>100BASE-TX</strong></td>\n<td>Ті самі 2 пари</td>\n<td>Розумніше кодування сигналу: у 10 разів більше даних у тій самій смузі кабелю</td>\n</tr>\n<tr>\n<td>🏗️ <strong>1000BASE-T</strong></td>\n<td>Усі 4 пари, кожна одночасно в обидва боки</td>\n<td>4 пари × 250 Мбіт/с; складна електроніка розділяє зустрічні сигнали</td>\n</tr>\n</tbody></table>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[&quot;🏢 100BASE-TX&lt;br/&gt;2 пари з 4&quot;] --&gt; B[&quot;🏗️ 1000BASE-T&lt;br/&gt;усі 4 пари&quot;]\n    style A fill:#fff9c4,stroke:#f9a825\n    style B fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1789190236506-9-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 360px;\" viewBox=\"4 4 360 88\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190236506-9-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789190236506-9-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789190236506-9-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789190236506-9-0 .error-icon{fill:#552222;}#exp-1789190236506-9-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789190236506-9-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789190236506-9-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1789190236506-9-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1789190236506-9-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1789190236506-9-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1789190236506-9-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1789190236506-9-0 .marker{fill:#333333;stroke:#333333;}#exp-1789190236506-9-0 .marker.cross{stroke:#333333;}#exp-178919023650 комутатором.</p>\n</div>\n\n\n\n<p><strong>Головна ідея:</strong> Обидва кінці кабелю мають працювати в одному режимі та на одній швидкості. Щоб не налаштовувати це вручну, пристрої домовляються самі: це <strong>автоузгодження</strong> (auto-negotiation).</p>\n\n<div class=\"mermaid\" data-source=\"graph LR\n    A[&quot;🖥️ ПК: auto&quot;] &lt;--&gt;|обмін&lt;br/&gt;імпульсами| B[&quot;🔀 Комутатор:&lt;br/&gt;auto&quot;]\n    B --&gt; C[&quot;✅ Обрано&lt;br/&gt;1000 Мбіт/с&lt;br/&gt;full duplex&quot;]\n    style A fill:#e3f2fd,stroke:#1565c0\n    style B fill:#e3f2fd,stroke:#1565c0\n    style C fill:#e8f5e9,stroke:#388e3c\"><svg id=\"exp-1789190236524-10-0\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" class=\"flowchart\" style=\"max-width: 684.375px;\" viewBox=\"4 4 684.375 112\" role=\"graphics-document document\" aria-roledescription=\"flowchart-v2\"><style>#exp-1789190236524-10-0{font-family:system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#exp-1789190236524-10-0 .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#exp-1789190236524-10-0 .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#exp-1789190236524-10-0 .error-icon{fill:#552222;}#exp-1789190236524-10-0 .error-text{fill:#552222;stroke:#552222;}#exp-1789190236524-10-0 .edge-thickness-normal{stroke-width:1px;}#exp-1789190236524-10-0 .edge-thickness-thick{stroke-width:3.5px;}#exp-1789190236524-10-0 .edge-pattern-solid{stroke-dasharray:0;}#exp-1789190236524-10-0 .edge-thickness-invisible{stroke-width:0;fill:none;}#exp-1789190236524-10-0 .edge-pattern-dashed{stroke-dasharray:3;}#exp-1789190236524-10-0 .edge-pattern-dotted{stroke-dasharray:2;}#exp-1789190236524-10-0 .marker{fill:#333333;stroke:#3 0\" height=\"48\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>🔀 Комутатор:<br>auto</p></span></div></foreignObject></g></g><g class=\"node default  \" id=\"exp-1789190236524-10-0-flowchart-C-3\" data-look=\"neo\" transform=\"translate(604.375, 60)\"><rect class=\"basic label-container\" style=\"fill:#e8f5e9 !important;stroke:#388e3c !important\" x=\"-76\" y=\"-48\" width=\"152\" height=\"96\"></rect><g class=\"label\" style=\"\" transform=\"translate(-60, -36)\"><rect></rect><foreignObject width=\"120\" height=\"72\"><div xmlns=\"http://www.w3.org/1999/xhtml\" style=\"display: table; white-space: nowrap; line-height: 1.5; max-width: 120px; text-align: center; width: 120px;\"><span class=\"nodeLabel \"><p>✅ Обрано<br>1000 Мбіт/с<br>full duplex</p></span></div></foreignObject></g></g></g></g></g><defs><filter id=\"exp-1789190236524-10-0-drop-shadow\" height=\"130%\" width=\"130%\"><feDropShadow dx=\"4\" dy=\"4\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs><defs><filter id=\"exp-1789190236524-10-0-drop-shadow-small\" height=\"150%\" width=\"150%\"><feDropShadow dx=\"2\" dy=\"2\" stdDeviation=\"0\" flood-opacity=\"0.06\" flood-color=\"#000000\"></feDropShadow></filter></defs></svg></div>\n<div class=\"warning\"><strong>⚠️ Типова помилка: duplex mismatch</strong> <p>Якщо один бік налаштували вручну (наприклад, 100 full), а другий залишили auto, другий не отримує відповіді і за стандартом обирає <strong>half duplex</strong>. Лінк піднімається, ping проходить, але під навантаженням один бік бачить \"колізії\", другий помилки CRC, і швидкість падає в рази.</p>\n</div>\n\n\n\n\n\n<div class=\"tip\"><strong>💡 Правило</strong> <p>Або <strong>auto з обох боків</strong>, або <strong>вручну з обох боків</strong> з однаковими параметрами. Для Gigabit Ethernet автоузгодження обов'язкове, тому проблема трапляється на портах 10/100.</p>\n</div>\n\n","<h1>🔍 Діагностика: що показує порт комутатора</h1>\n<p><strong>Головна ідея:</strong> Усе розглянуте вище видно у виводі однієї команди на комутаторі. Уміння читати ці лічильники перетворює теорію на робочий інструмент.</p>\n<pre><code class=\"language-text hljs language-plaintext\" data-highlighted=\"yes\">Switch# show interfaces FastEthernet0/1\nFastEthernet0/1 is up, line protocol is up (connected)\n  MTU 1500 bytes, BW 100000 Kbit\n  Full-duplex, 100Mb/s\n  ...\n     0 runts, 0 giants\n     0 input errors, 0 CRC\n     0 collisions, 0 late collision</code></pre><table>\n<thead>\n<tr>\n<th>Рядок</th>\n<th>Про що говорить</th>\n<th>З якого слайду</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><code>Full-duplex, 100Mb/s</code></td>\n<td>Результат автоузгодження</td>\n<td>🤝 Автоузгодження</td>\n</tr>\n<tr>\n<td><code>MTU 1500 bytes</code></td>\n<td>Максимальний розмір поля даних</td>\n<td>📦 Кадр</td>\n</tr>\n<tr>\n<td><code>runts</code>, <code>giants</code></td>\n<td>Кадри коротші за 64 або довші за 1518 байт</td>\n<td>📦 Кадр</td>\n</tr>\n<tr>\n<td><code>CRC</code></td>\n<td>Кадри з невірним FCS: поганий кабель, роз'єм або duplex mismatch</td>\n<td>📦 Кадр, 🧵 Кабель</td>\n</tr>\n<tr>\n<td><code>collisions</code></td>\n<td>Нормально лише в напівдуплексі; у повному дуплексі має бути 0</td>\n<td>🎙️ CSMA/CD</td>\n</tr>\n<tr>\n<td><code>late collision</code></td>\n<td>Колізія після 64-го байта: майже завжди duplex mismatch</td>\n<td>🤝 Автоузгодження</td>\n</tr>\n</tbody></table>\n<div class=\"tip\"><strong>💡 Швидка діагностика</strong> <p><code>CRC</code> разом із <code>late collision</code> вказують на duplex mismatch. Лише <code>CRC</code> без колізій частіше означає кабель. Ці лічильники доступні і в Packet Tracer, і на реальному обладнанні.</p>\n</div>\n\n","<h1>✅ Ключові висновки</h1>\n<div class=\"success\"><strong>✅ Головне з лекції</strong> <ol>\n<li>🌐 <strong>Ethernet</strong> переміг простотою та сумісністю: від 10 Мбіт/с до сотень гігабіт формат кадру не змінювався</li>\n<li>🎙️ <strong>CSMA/CD</strong> був потрібен, коли всі ділили один кабель. У сучасних комутованих мережах із повним дуплексом колізій немає</li>\n<li>📦 <strong>Кадр Ethernet</strong>: MAC-адреси, поле Type, до 1500 байт даних, контрольна сума FCS. Мінімум 64 байти є спадком епохи колізій</li>\n<li>⚡ <strong>Ефективність визначає розмір кадру</strong>: 55% для мінімальних і 98% для максимальних</li>\n<li>🚀 Кожне покоління змінювало <strong>лише фізичний рівень</strong>, тому програмне забезпечення нічого не помічало</li>\n<li>🧵 <strong>Кручена пара</strong> пережила всі покоління завдяки розумнішому кодуванню і використанню всіх 4 пар</li>\n<li>🤝 <strong>Автоузгодження</strong> має бути однаковим з обох боків; duplex mismatch видно за лічильниками CRC та late collision</li>\n</ol>\n</div>\n\n","<h1>❓ Контрольні питання</h1>\n<ol>\n<li><p>🤔 Що таке колізія і чому вона неможлива в мережі на комутаторах із повним дуплексом?</p>\n</li>\n<li><p>🤔 Опишіть алгоритм CSMA/CD. Навіщо потрібна випадкова пауза після колізії?</p>\n</li>\n<li><p>🤔 Назвіть поля кадру Ethernet II. Що означає поле Type і чому мінімальний кадр 64 байти?</p>\n</li>\n<li><p>🤔 Чому корисна швидкість на маленьких кадрах майже вдвічі нижча за номінальну, а на великих майже дорівнює їй?</p>\n</li>\n<li><p>🤔 Що залишалось незмінним при переході від 10 до 100 і 1000 Мбіт/с, а що змінювалось?</p>\n</li>\n<li><p>🤔 Розшифруйте позначення 100BASE-TX і 1000BASE-T. Скільки пар кабелю використовує кожна з них?</p>\n</li>\n<li><p>🤔 Що таке duplex mismatch, за яких налаштувань він виникає і за якими лічильниками порту його видно?</p>\n</li>\n</ol>\n","<h1>📖 Глосарій термінів</h1>\n<table>\n<thead>\n<tr>\n<th>Термін</th>\n<th>English</th>\n<th>Визначення</th>\n</tr>\n</thead>\n<tbody><tr>\n<td>Кадр</td>\n<td>Frame</td>\n<td>Одиниця передачі канального рівня: заголовок, дані та контрольна сума</td>\n</tr>\n<tr>\n<td>Колізія</td>\n<td>Collision</td>\n<td>Накладання сигналів двох або більше станцій у спільному середовищі</td>\n</tr>\n<tr>\n<td>Домен колізій</td>\n<td>Collision Domain</td>\n<td>Частина мережі, у межах якої кадри станцій можуть зіткнутися</td>\n</tr>\n<tr>\n<td>Міжкадровий інтервал</td>\n<td>Inter-Frame Gap</td>\n<td>Обов'язкова пауза між сусідніми кадрами, 96 біт</td>\n</tr>\n<tr>\n<td>Преамбула</td>\n<td>Preamble</td>\n<td>Послідовність біт на початку кадру для синхронізації приймача</td>\n</tr>\n<tr>\n<td>Заповнення</td>\n<td>Padding</td>\n<td>Байти, що доповнюють поле даних до мінімальних 46 байт</td>\n</tr>\n<tr>\n<td>Корисна пропускна здатність</td>\n<td>Throughput</td>\n<td>Швидкість передачі даних без урахування службової інформації</td>\n</tr>\n<tr>\n<td>Повний дуплекс</td>\n<td>Full Duplex</td>\n<td>Одночасна передача та прийом окремими парами або волокнами</td>\n</tr>\n<tr>\n<td>Напівдуплекс</td>\n<td>Half Duplex</td>\n<td>Передача та прийом по черзі у спільному середовищі</td>\n</tr>\n<tr>\n<td>Автоузгодження</td>\n<td>Auto-Negotiation</td>\n<td>Автоматичний вибір швидкості та дуплексу двома пристроями на лінку</td>\n</tr>\n<tr>\n<td>Невідповідність дуплексу</td>\n<td>Duplex Mismatch</td>\n<td>Один кінець лінка працює у повному дуплексі, а інший у напівдуплексі</td>\n</tr>\n<tr>\n<td>Кручена пара</td>\n<td>Twisted Pair</td>\n<td>Кабель із чотирьох пар попарно скручених мідних провідників</td>\n</tr>\n<tr>\n<td>Оптоволокно</td>\n<td>Fiber Optic</td>\n<td>Кабель, що передає дані світловими імпульсами</td>\n</tr>\n<tr>\n<td>Великі кадри</td>\n<td>Jumbo Frames</td>\n<td>Кадри з полем даних до 9000 байт для підвищення ефективності</td>\n</tr>\n</tbody></table>\n","<h1>🔤 Глосарій абревіатур</h1>\n<table>\n<thead>\n<tr>\n<th>Абревіатура</th>\n<th>Розшифровка</th>\n<th>Переклад</th>\n</tr>\n</thead>\n<tbody><tr>\n<td><strong>LAN</strong></td>\n<td>Local Area Network</td>\n<td>Локальна мережа</td>\n</tr>\n<tr>\n<td><strong>IEEE</strong></td>\n<td>Institute of Electrical and Electronics Engineers</td>\n<td>Інститут інженерів з електротехніки та електроніки</td>\n</tr>\n<tr>\n<td><strong>MAC</strong></td>\n<td>Media Access Control</td>\n<td>Керування доступом до середовища</td>\n</tr>\n<tr>\n<td><strong>CSMA/CD</strong></td>\n<td>Carrier Sense Multiple Access with Collision Detection</td>\n<td>Множинний доступ із прослуховуванням несучої та виявленням колізій</td>\n</tr>\n<tr>\n<td><strong>IFG</strong></td>\n<td>Inter-Frame Gap</td>\n<td>Міжкадровий інтервал</td>\n</tr>\n<tr>\n<td><strong>SFD</strong></td>\n<td>Start Frame Delimiter</td>\n<td>Обмежувач початку кадру</td>\n</tr>\n<tr>\n<td><strong>FCS</strong></td>\n<td>Frame Check Sequence</td>\n<td>Контрольна послідовність кадру</td>\n</tr>\n<tr>\n<td><strong>CRC</strong></td>\n<td>Cyclic Redundancy Check</td>\n<td>Циклічний надлишковий код</td>\n</tr>\n<tr>\n<td><strong>MTU</strong></td>\n<td>Maximum Transmission Unit</td>\n<td>Максимальний розмір поля даних</td>\n</tr>\n<tr>\n<td><strong>pps</strong></td>\n<td>Packets Per Second</td>\n<td>Пакетів за секунду</td>\n</tr>\n<tr>\n<td><strong>UTP</strong></td>\n<td>Unshielded Twisted Pair</td>\n<td>Неекранована кручена пара</td>\n</tr>\n<tr>\n<td><strong>MII</strong></td>\n<td>Media Independent Interface</td>\n<td>Інтерфейс, незалежний від середовища</td>\n</tr>\n<tr>\n<td><strong>MLT-3</strong></td>\n<td>Multi-Level Transmit, 3 levels</td>\n<td>Трирівневе лінійне кодування</td>\n</tr>\n<tr>\n<td><strong>PAM-5</strong></td>\n<td>Pulse Amplitude Modulation, 5 levels</td>\n<td>П'ятирівнева амплітудна модуляція</td>\n</tr>\n<tr>\n<td><strong>SFP</strong></td>\n<td>Small Form-factor Pluggable</td>\n<td>Змінний оптичний трансивер</td>\n</tr>\n</tbody></table>\n"];let currentSlideIndex=0;
function renderMath(root){if(typeof renderMathInElement!=="function"||!root)return;try{renderMathInElement(root,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\[",right:"\\]",display:true},{left:"$",right:"$",display:false},{left:"\\(",right:"\\)",display:false}],throwOnError:false,strict:"ignore",ignoredTags:["script","noscript","style","textarea","pre","code"]});}catch(e){console.warn("Math render error:",e);}}
function showSlide(i){if(i<0||i>=slides.length)return;currentSlideIndex=i;const el=document.getElementById("current-slide");el.innerHTML=slides[i];el.scrollTop=0;renderMath(el);document.getElementById("progress-bar").style.width=((i+1)/slides.length*100)+"%";document.getElementById("slide-number").textContent=(i+1)+" / "+slides.length;updateSidebarActive();}
function nextSlide(){if(currentSlideIndex<slides.length-1)showSlide(currentSlideIndex+1);}
function previousSlide(){if(currentSlideIndex>0)showSlide(currentSlideIndex-1);}
function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open");}
function toggleHelp(){document.getElementById("help-overlay").classList.toggle("hidden");}
function toggleFullscreen(){if(!document.fullscreenElement){const pc=document.getElementById("presentation-container");if(pc.requestFullscreen)pc.requestFullscreen();else if(pc.webkitRequestFullscreen)pc.webkitRequestFullscreen();else if(pc.msRequestFullscreen)pc.msRequestFullscreen();else if(pc.mozRequestFullScreen)pc.mozRequestFullScreen();}else{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();else if(document.msExitFullscreen)document.msExitFullscreen();else if(document.mozCancelFullScreen)document.mozCancelFullScreen();}}
function generateSidebar(){const sc=document.getElementById("sidebar-content");sc.innerHTML="";slides.forEach((html,idx)=>{const t=document.createElement("div");t.className="slide-thumbnail";if(idx===0)t.classList.add("active");const tmp=document.createElement("div");tmp.innerHTML=html;const title=tmp.querySelector("h1,h2");const titleText=title?title.textContent:("Слайд "+(idx+1));const textContent=tmp.textContent.replace(/s+/g," ").trim();const preview=textContent.substring(0,100)+(textContent.length>100?"...":"");t.innerHTML="<div class=\"slide-thumbnail-number\">"+(idx+1)+"</div><div class=\"slide-thumbnail-title\">"+titleText+"</div><div class=\"slide-thumbnail-content\">"+preview+"</div>";t.onclick=()=>{showSlide(idx);if(window.innerWidth<1024)toggleSidebar();};sc.appendChild(t);});}
function updateSidebarActive(){document.querySelectorAll(".slide-thumbnail").forEach((th,idx)=>{if(idx===currentSlideIndex){th.classList.add("active");th.scrollIntoView({behavior:"smooth",block:"nearest"});}else th.classList.remove("active");});}
document.addEventListener("keydown",e=>{switch(e.key){case"ArrowLeft":previousSlide();break;case"ArrowRight":case" ":e.preventDefault();nextSlide();break;case"f":case"F":toggleFullscreen();break;case"s":case"S":toggleSidebar();break;case"?":toggleHelp();break;case"Escape":const sb=document.getElementById("sidebar");const ho=document.getElementById("help-overlay");if(sb.classList.contains("open"))toggleSidebar();else if(!ho.classList.contains("hidden"))ho.classList.add("hidden");break;}});
generateSidebar();showSlide(0);</script></body></html>
